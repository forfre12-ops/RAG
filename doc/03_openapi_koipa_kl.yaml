        슬레이트 판별은 파일명 규칙이 아니라 첫 줄을 읽어서 한다(text 와 label 또는 grade 가
        있어야 후보로 본다) — 이름이 build_ 로 시작하지 않는 실제 전달본이 목록에서 빠지는 것을
        막기 위해서다. 줄 수는 5,000 까지만 세고, 그 위는 records_exact=false 로 알린다
        (그때 records 는 하한값이다).
