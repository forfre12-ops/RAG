      summary: locked_gold_eval readiness
      responses:
        '200':
          description: 등급별 locked 평가 준비도
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/dashboard:
    get:
      tags: [admin]
      summary: 운영 검수 대시보드 종합
      responses:
        '200':
          description: 운영 상태 종합
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/keywords:
    get:
      tags: [admin]
      summary: 태깅 키워드 목록 (등급·요소·활성 필터) — FUN-023
      parameters:
        - { name: grade, in: query, required: false, schema: { type: string } }
        - { name: factor, in: query, required: false, schema: { type: string } }
        - { name: active_only, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 키워드 목록
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin/reviewer role required" }
    post:
      tags: [admin]
      summary: 태깅 키워드 추가 (룰엔진 핫리로드) — FUN-023
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade, keyword, actor]
              properties:
                grade: { type: string }
                keyword: { type: string }
                pattern_type: { type: string, enum: [exact, regex, semantic], default: exact }
                factor: { type: string, nullable: true }
                weight: { type: number, default: 1.0 }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '201':
          description: 추가 결과 (룰엔진 리로드 여부 포함)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: "unknown/inactive grade code" }
        '403': { description: "admin role required" }
        '503': { description: "db unavailable" }

  /admin/keywords/{keyword_id}:
    patch:
      tags: [admin]
      summary: 태깅 키워드 수정·비활성 (is_active=false=소프트 삭제, 룰엔진 핫리로드) — FUN-023
      parameters:
        - { name: keyword_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                keyword: { type: string }
                pattern_type: { type: string, enum: [exact, regex, semantic] }
                factor: { type: string, nullable: true }
                weight: { type: number }
                is_active: { type: boolean }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '200':
          description: 수정·비활성 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }
        '404': { description: "keyword_id not found" }
        '503': { description: "db unavailable" }

  /answer:
    post:
      tags: [answer]
      summary: RAG 답안 합성 — query + RAG hits → LLM 답안 + 인용
      description: |
        분류와 별개 단계. 질의를 받아 RAG 검색(facade)으로 컨텍스트 hits를 모은 뒤
        LLM(원격/로컬/noop)으로 답안을 합성한다. 인용 출처(citations)는 hits 순서대로
        rank를 부여해 반환. noop·LLM 부재·생성 실패는 `deterministic_fallback=true`로
        결정론적 안내를 반환하며 5xx가 아닌 200으로 끝남(warnings에 사유).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagAnswerRequest'
      responses:
        '200':
          description: 답안 합성 완료 (deterministic_fallback 여부는 응답 필드 참조)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagAnswerResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "요청 검증 실패 (예: query 길이 위반)"
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ── 관리자 콘솔·골든셋 검수 (2026-08-08~09 신설, 2026-08-11 명세 반영) ─────────
  # 라우터에는 있었으나 본 명세에 없던 15경로. KL 연동 대상은 아니고 지재원 관리자 콘솔이
  # 쓰는 내부 경로이지만, 명세에 없으면 감리에서 "구현 미기술"로 읽힌다.
  /admin/audit-log:
    get:
      tags: [admin]
      summary: 감사 로그 조회 — 누가 언제 무엇을 했는가
      description: >-
        헬스체크·정적자산은 기록에서 제외된다. 응답의 actorless_ratio 는 행위자(actor_id)가
        없는 기록 비율 — 공유 API 키 모드에서는 개별 신원이 남지 않는다.
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 50 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
        - { in: query, name: action, schema: { type: string }, description: 부분일치 }
        - { in: query, name: success, schema: { type: boolean } }
        - { in: query, name: actor_id, schema: { type: string } }
      responses:
        '200':
          description: 감사 로그 페이지
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/model/rollback:
    post:
      tags: [admin]
      summary: 활성 모델을 직전 활성본으로 롤백 + 무중단 리로드
      description: >-
        배포 게이트를 적용하지 않는다 — 회귀를 되돌리는 방향이라 막으면 사고 시 복구가
        불가능해진다. 대신 사유(reason)가 필수이며 활성화와 동일한 advisory lock 으로
        직렬화된다. 복귀 후보가 없으면 rolled_back=false 로 응답한다(리로드 안 함).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: 감사에 남는 유일한 맥락이므로 필수 }
      responses:
        '200':
          description: 롤백 결과 (rolled_back · reason)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /review-queue/{classification_id}/evidence:
    get:
      tags: [confirm]
      summary: 검수 1건의 근거 — "왜 이 등급인가"
      description: >-
        분류 시점에 저장된 근거(tb_classification_evidence)를 읽는다. 재분류하지 않는다 —
        큐 본문은 미리보기라 다른 입력을 설명하게 되고, 재분류는 현재 활성 모델 기준이라
        저장된 등급과 어긋난다. 룰 근거 span 이 없던 건은 evidence 가 비며, 그것은 결함이
        아니라 "모델 확률만으로 판정돼 검수로 왔다"는 신호다.
      parameters:
        - in: path
          name: classification_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: recorded(등급·신뢰도·모델·차순위) + evidence[] + by_type
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /golden/summary:
    get:
      tags: [golden]
      summary: 정본 골든셋 구성 집계 (tier·등급·출처·라벨출처)
      description: >-
        tier 는 저장 컬럼이 아니라 label_source/review_status/서명 envelope 에서 파생된다
        (golden_tiers.tier_of 를 그대로 호출 — 별도 로직을 두면 드리프트한다).
        locked 총수와 real_locked_eval 을 구분해 낸다. 읽기 전용이며 정본 변경은
        promote_golden_candidates.py 의 명시적 게이트만 담당한다.
      parameters:
        - { in: query, name: path, schema: { type: string }, description: "datasets/ 하위 샌드박스로 제한" }
      responses:
        '200':
          description: tier·등급·출처별 집계
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /golden/jobs:
    get:
      tags: [golden]
      summary: 골든 빌드 작업 목록
      description: >-
        서버 순서는 Redis SCAN 순서라 최신순 보장이 없다(응답 ordering 필드로 고지).
        화면은 submitted_at 기준으로 재정렬해 표시한다.
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: 작업 목록 (ordering 고지 포함)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /golden/candidates:
    get:
      tags: [golden]
      summary: 합성 Proxy Gold 후보 목록
      description: >-
        여기서 확정한 등급은 Proxy Gold 이며 Locked Gold 승격이 아니다.
        공유 API 키를 거부하고 포털 JWT(헤더 또는 koipa_access_token 쿠키)만 인정한다 —
        검수 기록에 실계정이 남아야 하기 때문.
      parameters:
        - { in: query, name: status, schema: { type: string } }
        - { in: query, name: grade, schema: { type: string, enum: [TS, S1, S2, S3] } }
        - { in: query, name: origin, schema: { type: string }, description: "public_real | organization_real 등" }
        - { in: query, name: query, schema: { type: string }, description: 본문·제목 부분일치 }
      responses:
        '200':
          description: 후보 목록 + summary(품질 지표 포함)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /golden/candidates/summary:
    get:
      tags: [golden]
      summary: 골든셋 관리 콘솔 집계
      responses:
        '200':
          description: 등급·출처·확정 진행 집계
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /golden/candidates/decisions:
    get:
      tags: [golden]
      summary: 결정 원장 최근 기록 (보류·폐기·번복 포함)
      description: 원장은 append-only 라 기록을 지울 수 없다.
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 100 } }
      responses:
        '200':
          description: 결정 원장 페이지
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /golden/candidates/session:
    get:
      tags: [golden]
      summary: 골든셋 관리 콘솔 로그인 신원
      responses:
        '200':
          description: 현재 검수자 신원
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /golden/candidates/upload:
    post:
      tags: [golden]
      summary: 골든셋 관리 콘솔 문서 업로드
      description: >-
        출처(origin)·사용권한(usage_right)이 필수다 — 이 기록이 없으면 나중에 평가셋으로
        쓸 수 없다. 적재 후 분류 큐에 등록하고 status_url 을 반환한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, origin, usage_right]
              properties:
                file: { type: string, format: binary }
                origin: { type: string }
                usage_right: { type: string }
      responses:
        '200':
          description: 적재 결과 + status_url
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /golden/candidates/{doc_id}:
    get:
      tags: [golden]
      summary: 합성 Proxy Gold 후보 상세
      parameters:
        - in: path
          name: doc_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 후보 상세 (본문·판정 이력)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /golden/candidates/{doc_id}/decision:
    post:
      tags: [golden]
      summary: 합성 Proxy Gold 후보의 관리자 결정 기록
      description: >-
        결정은 append-only 로 원장에 남는다. 등급변경·보류·반려·폐기는 사유가 필수이며
        미기입 시 422. 승인은 approved_proxy 로만 남고 Locked Gold 평가 레코드를 만들지 않는다.
      parameters:
        - in: path
          name: doc_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, description: "확정·등급변경·보류·반려·폐기·재검토" }
                grade: { type: string, enum: [TS, S1, S2, S3] }
                reason: { type: string, description: 등급변경·보류·반려·폐기 시 필수 }
      responses:
        '200':
          description: 결정 기록 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: "사유 필수인 결정에 reason 미기입" }

  /golden/candidates/login.html:
    get:
      tags: [golden]
      summary: 골든셋 관리 콘솔 진입 화면 (무인증)
      description: >-
        manage.html·actual-intake.html 은 포털 JWT 쿠키를 요구하는데 쿠키를 심을 화면이
        없어 브라우저로 열면 401 JSON 한 줄만 보였다. 토큰을 URL 에 싣지 않는다
        (액세스로그·브라우저 히스토리 잔존 방지).
      responses:
        '200':
          description: 로그인 HTML
          content:
            text/html:
              schema: { type: string }

  /golden/candidates/manage.html:
    get:
      tags: [golden]
      summary: 골든셋 후보 관리 화면
      responses:
        '200':
          description: 관리 HTML
          content:
            text/html:
              schema: { type: string }
        '401': { description: "포털 JWT 쿠키 필요 — login.html 경유" }

  /golden/candidates/actual-intake.html:
    get:
      tags: [golden]
      summary: 실문서 인테이크 화면
      responses:
        '200':
          description: 인테이크 HTML
          content:
            text/html:
              schema: { type: string }
        '401': { description: "포털 JWT 쿠키 필요 — login.html 경유" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    DocumentUploadResponse:
      type: object
      required: [filename, source_format, file_hash, file_size_bytes, extraction_method,
                 extraction_quality, ocr_used, char_count, chunk_count, persisted, warnings]
      properties:
        doc_id:
          type: string
          format: uuid
          nullable: true
          description: "DB 적재 성공 시 UUID, 미가용 시 null"
        filename: { type: string }
        source_format: { type: string, example: "pdf" }
        file_hash: { type: string, description: "SHA-256 hex" }
        file_size_bytes: { type: integer }
        extraction_method: { type: string, example: "pdfminer" }
        extraction_quality: { type: number, format: float, minimum: 0, maximum: 1 }
        ocr_used: { type: boolean }
        char_count: { type: integer }
        chunk_count: { type: integer }
        persisted: { type: boolean, description: "DB/storage 저장 성공 여부" }
        warnings:
          type: array
          items: { type: string }

    Grade:
      type: string
      description: 등급체계 코드. 관리자가 수정 가능하지만 기본 4단계 제공.
      enum:
        - TS    # 특급기밀
        - S1    # 1급 비밀
        - S2    # 2급 대외비
        - S3    # 3급 공개

    GradeDefinition:
      type: object
      required: [code, name, order]
      properties:
        code: { type: string, example: "S1" }
        name: { type: string, example: "1급 비밀" }
        order: { type: integer, description: "높을수록 높은 등급" }
        description: { type: string }
        color: { type: string, example: "#D32F2F" }

    Actor:
      type: object
      required: [user_id, role]
      description: 호출자(관리자/시스템) 정보. 감사 로그용.
      properties:
        user_id: { type: string }
        role:
          type: string
          enum: [admin, reviewer, system, kl_backend]
        ip: { type: string, nullable: true }

    DocumentInput:
      type: object
      required: [doc_id, content]
      properties:
        doc_id:
          type: string
          description: KL 측 문서 식별자
        title: { type: string }
        content:
          type: string
          description: |
            전처리 전 텍스트. 길이 제한 1MB.
            바이너리 파일 분류는 별도 /preprocess/upload 사용.
        metadata:
          type: object
          description: |
            라벨링 보조 정보(작성 부서·문서 유형·작성일 등). 아래 3필드는 KL 연동 R6 계약
            (⚠ ICD 협의안 v0.9 — 화요일 미팅서 K1~K7 확정 후 동결). metadata_floor 게이트
            활성 시 등급 상향(floor)·검수 라우팅에 사용(운영 프로파일 onprem-local·full-train은 기본 활성).
          properties:
            source_type:
              type: string
              description: 문서 출처 유형(예 web_public/internal 등). source-prior 게이트 입력.
            security_marking:
              type: string
              enum: [top_secret, secret, confidential]
              description: |
                KL 원본 보안표시 → 등급 floor(안전하게 상향만·하향 없음):
                top_secret→TS · secret→S1 · confidential→S2. 소문자 exact-match(한글 표기 미매칭=무동작).
            access_scope:
              type: string
              enum: [approved_only, designated, department, all_employees]
              description: |
                접근범위 → 비밀관리성(M) 신호. 표기 없고 approved_only/designated/department이면
                예측이 낮을 때 검수 라우팅(ICD §4.4). (all_employees 처리는 협의 대상)
          additionalProperties: true
        text_already_preprocessed:
          type: boolean
          default: false

    ClassifyRequest:
      allOf:
        - $ref: '#/components/schemas/DocumentInput'
        - type: object
          properties:
            use_rag:
              type: boolean
              default: false
              description: 사내규정 RAG 컨텍스트 결합 여부 (PostgreSQL pgvector dense + bigram ts_rank 하이브리드)
            rag_namespace:
              type: string
              description: |
                선택. RAG 검색 대상 네임스페이스 명시(실제 요청 필드명 = rag_namespace).
                미지정 시 기본 네임스페이스 사용.
              example: secrets-guides
            return_evidence:
              type: boolean
              default: true

    ClassifyAsyncRequest:
      allOf:
        - $ref: '#/components/schemas/ClassifyRequest'
        - type: object
          properties:
            callback_url:
              type: string
              format: uri
              description: 완료 시 KL이 받을 콜백 URL (선택)

    ClassifyResponse:
      type: object
      required: [inference_id, doc_id, label, confidence, model_version]
      properties:
        inference_id: { type: string, format: uuid }
        doc_id: { type: string }
        label: { $ref: '#/components/schemas/Grade' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
        scores:
          type: object
          description: 등급별 확률 분포
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        evaluation_factors:
          type: object
          nullable: true
          description: 정본 가이드 3요건(S 비공지성 · V 경제적 유용성 · M 비밀관리성) 점수. 각 0~2.
          properties:
            secrecy: { type: number, minimum: 0, maximum: 2, description: 비공지성(S) }
            value: { type: number, minimum: 0, maximum: 2, description: 경제적 유용성(V) }
            management: { type: number, minimum: 0, maximum: 2, description: 비밀관리성(M) }
            scores:
              type: object
              description: 도메인 독립 factor_code → 점수 맵
              additionalProperties: { type: number }
        evidence:
          type: array
          description: 근거 키워드·문맥 span
          items:
            type: object
            properties:
              start: { type: integer }
              end: { type: integer }
              text: { type: string }
              weight: { type: number }
              tag: { type: string }
        rag_context_used:
          type: array
          items:
            type: object
            properties:
              source_doc: { type: string }
              chunk_id: { type: string }
              score: { type: number }
        model_version: { type: string }
        elapsed_ms: { type: integer }
        factors_source:
          type: string
          enum: [rule_evidenced, model_estimated]
          default: rule_evidenced
          description: evaluation_factors 출처 — rule_evidenced(룰엔진 실증 근거·법리 표시 가능) / model_estimated(등급 역산 추정치·법리 근거 아님).
        status:
          type: string
          enum: [staging, needs_review, needs_second_review]
          default: staging
          description: staging=자동확정 후보 · needs_review/needs_second_review=검수 라우팅. 최종 확정은 /confirm 소관(이 응답에서 'confirmed'는 발행되지 않음).
        warnings:
          type: array
          items: { type: string }
        rule_grade:
          type: string
          nullable: true
          description: 룰 엔진(시드 키워드 S×V×M) 단독 판정.
        model_grade:
          type: string
          nullable: true
          description: 학습 분류기(BERT) 단독 판정(override/cap/floor 이전). 모델 미로드 시 null.
        decision_path:
          type: string
          nullable: true
          description: 최종 label 도출 경로(agreement/rule-override/source-cap/rule-only 등) — 룰·모델 이중판정 투명성.

    ReviewQueueItem:
      type: object
      required: [classification_id, doc_id, grade, confidence, model_version, status]
      properties:
        classification_id: { type: string }
        doc_id: { type: string }
        filename:
          type: string
          nullable: true
        grade:
          type: string
          enum: [TS, S1, S2, S3]
          description: Model-predicted grade awaiting review.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        model_version: { type: string }
        status:
          type: string
          enum: [needs_review, needs_second_review]
        classified_at:
          type: string
          format: date-time
          nullable: true
        text_preview:
          type: string
          nullable: true

    ReviewQueueResponse:
      type: object
      required: [items, total, limit, offset, warnings]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        total:
          type: integer
          minimum: 0
          description: Total number of queue items matching the requested status filter.
        limit:
          type: integer
          minimum: 1
          maximum: 200
        offset:
          type: integer
          minimum: 0
        warnings:
          type: array
          items: { type: string }
          description: Non-empty when queue lookup degraded, for example because DB is unavailable.

    RagAnswerRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: 사용자 질의
        namespace:
          type: string
          description: RAG collection 명. 미지정 시 settings.rag_default_collection.
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        grade:
          $ref: '#/components/schemas/Grade'
        use_reranker:
          type: boolean
          default: true
        metadata:
          type: object
          description: "추가 filter (예: dept_id)."
          additionalProperties: true

    RagCitation:
      type: object
      required: [source_doc, chunk_id, score, rank]
      properties:
        source_doc: { type: string }
        chunk_id: { type: string }
        score: { type: number }
        rank: { type: integer, description: 1부터 시작 }

    RagAnswerUsage:
      type: object
      required: [provider, model, input_tokens, output_tokens, cost_usd]
      properties:
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer, default: 0 }
        success: { type: boolean, default: true }

    RagAnswerResult:
      type: object
      required: [answer, deterministic_fallback]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/RagCitation' }
        grade:
          $ref: '#/components/schemas/Grade'
          nullable: true
        usage:
          allOf:
            - $ref: '#/components/schemas/RagAnswerUsage'
          nullable: true
        warnings:
          type: array
          items: { type: string }
        deterministic_fallback:
          type: boolean
          description: LLM 미사용·실패 시 true (결정론적 안내 응답)

    JobStatus:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, done, failed, partial, cancelled]
          description: |
            partial — 일부 건은 성공·일부는 영구 실패. completed/failed로 분포 확인.
        progress: { type: number, minimum: 0, maximum: 1 }
        total: { type: integer }
        completed: { type: integer, description: 성공 건 수 }
        failed: { type: integer, description: retry 모두 실패한 건 수 }
        failed_doc_ids:
          type: array
          items: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              doc_id: { type: string }
              error_type: { type: string }
              message: { type: string }
              attempts: { type: integer }
        result:
          $ref: '#/components/schemas/ClassifyResponse'
        error: { type: string, nullable: true }

    Metrics:
      type: object
      properties:
        accuracy: { type: number }
        precision_macro: { type: number }
        recall_macro: { type: number }
        f1_macro: { type: number }
        fnr_overall:
          type: number
          description: 미탐율. 보안 핵심 KPI.
        fnr_by_grade:
          type: object
          additionalProperties: { type: number }

    MetricsReport:
      type: object
      properties:
        model_version: { type: string }
        evaluated_at: { type: string, format: date-time }
        dataset_version: { type: string }
        sample_count: { type: integer }
        metrics: { $ref: '#/components/schemas/Metrics' }
        notes: { type: string }

    TrainJobSummary:
      type: object
      properties:
        train_job_id: { type: string, format: uuid }
        status: { type: string }
        training_type: { type: string }
        base_model: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        model_version: { type: string, nullable: true }
        f1_macro: { type: number, nullable: true }
        fnr_overall: { type: number, nullable: true }

    SyntheticDoc:
      type: object
      properties:
        synth_id: { type: string, format: uuid }
        target_grade: { $ref: '#/components/schemas/Grade' }
        domain: { type: string }
        llm_provider: { type: string }
        preview: { type: string, description: "본문 앞 200자" }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, approved, rejected] }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            기계 식별용 오류 코드. 예시:
              KOIPA_VALIDATION, KOIPA_AUTH, KOIPA_NOT_FOUND,
              KOIPA_MODEL_NOT_READY, KOIPA_LLM_PROVIDER_FAIL,
              KOIPA_GPU_UNAVAILABLE, KOIPA_RATE_LIMIT, KOIPA_INTERNAL
        message: { type: string }
        request_id: { type: string, format: uuid }
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음 (역할 부족 — RBAC 거부)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 호출 한도 초과 (rate-limit). 헤더 Retry-After에 재시도 가능 시간(초) 포함.
      headers:
        Retry-After:
          schema: { type: integer }
          description: 재시도까지 대기 권장 시간(초)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: KOIPA_RATE_LIMIT }
              message: { type: string, example: 'rate limit exceeded: 60 per 1 minute' }
              retry_after_sec: { type: integer, example: 60 }
    PayloadTooLarge:
      description: 업로드 본문 크기 한도(기본 20MB) 초과.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
