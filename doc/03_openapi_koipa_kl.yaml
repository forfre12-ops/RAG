                    items: { type: object, additionalProperties: true }
                  assignments:
                    type: array
                    items:
                      type: object
                      required: [reviewer_id, kind, target, reason]
                      properties:
                        reviewer_id: { type: string }
                        kind: { type: string, enum: [doc_id, review_batch] }
                        target: { type: string, description: "kind 가 doc_id 면 문서 ID, review_batch 면 배치 이름" }
                        assigned_at: { type: string, nullable: true, description: 배정 시각(UTC ISO) }
                        assigned_by: { type: string, nullable: true, description: 배정한 관리자(서버가 확정한 포털 JWT sub) }
                        reason: { type: string }
                  ledger_events_total: { type: integer }
                  by_event: { type: object, additionalProperties: { type: integer } }
                  enforced:
                    type: object
                    description: enforcement 와 같은 값의 옛 표기
                    properties:
                      assignment: { type: boolean }
                      blind: { type: boolean }
                  enforcement:
                    type: object
                    required: [assignment_enforced, blind_enforced]
                    properties:
                      assignment_enforced: { type: boolean, description: golden_reviewer_assignment_enforced }
                      blind_enforced: { type: boolean, description: golden_review_blind_enforced }
                  events:
                    type: array
                    description: include_events=true 일 때만
                    items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
