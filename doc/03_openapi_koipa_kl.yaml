openapi: 3.0.3
info:
  title: Koipa AI Engine API
  description: |
    한국지식재산보호원 AI 영업비밀관리시스템 — 한국지식재산보호원 AI 엔진의
    KL 웹시스템 연동용 REST API 명세.

    담당 기능: FUN-003, FUN-004, FUN-005, FUN-022, FUN-023, FUN-024
    제공 주체: Koipa AI Engine (FastAPI)

    ## 이 문서가 담는 범위

    본 명세는 **엔진이 서빙하는 전체 API**를 담는다. 그중 **KL 웹시스템이 호출하는 것은
    아래 5개 경로**이며, 「API 통신 방안 검토 회신」의 IF-01~IF-06 과 같다.

      IF-01  GET  /healthz                    준비 상태 확인
      IF-02  POST /documents                  문서 등록(multipart) -> doc_id
      IF-03  POST /classify/async             비동기 분류 요청(callback_url 포함)
      IF-04  POST {callback_url}              엔진 -> 관리. 완료 통보(본 명세 대상 아님)
      IF-05  GET  /classify/jobs/{job_id}     상태 조회(콜백 유실 대비)
      IF-06  GET  /classify/{doc_id}          문서 단위 결과 조회

    각 오퍼레이션에 `x-audience` 를 달았다 — `kl` 은 KL 연동면, `internal` 은 당사
    운영면이다. 운영면(골든셋 검수·관리자·학습·합성)은 KL 이 호출하지 않는다.

    검수·골든셋 검증 화면의 운영형태는 ICD 합의 안건 **K7** 에서 확정한다. 당사는
    ⓑ(KL 포털 통합)를 전제로 진행 중이며, 현재 콘솔은 그때까지의 과도기 화면이다.
    따라서 `golden`·`admin` 계열 경로는 그 화면이 쓰는 것으로 KL 연동 대상이 아니다.

    인증: API Key (서버 간 통신) + 선택적 JWT (관리자 행위 추적)
    모든 응답은 application/json. 파일 업로드는 multipart/form-data.
    날짜·시각은 ISO 8601 UTC. 모든 ID는 UUIDv4.

    오류는 **HTTP 상태 코드로 구분**한다. 본문은 대부분 `{"detail": "사유"}` 이고(422 는 항목별
    배열), 심볼릭 `code` 필드를 담는 응답은 413(요청 본문 한도)·429(호출 한도)·500(미처리 오류)
    셋뿐이다. 코드 문자열이 아니라 상태 코드로 분기한다.

    내부 RAG 백엔드: PostgreSQL pgvector dense + bigram tsvector `ts_rank`
    하이브리드. 본 명세는 backend-agnostic 하므로 KL 측은 RAG 동작 세부를
    몰라도 호출 가능. ES 경로는 레거시 어댑터로만 남아 있다.
  version: 1.0.0-draft
  contact:
    name: Koipa AI Engineering
servers:
  - url: http://koipa-api:8000/api/v1
    description: 온프레미스 Docker 내부망
  - url: https://{host}/api/v1
    description: 프로덕션
    variables:
      host:
        default: ai.example.koipa.local

security:
  - ApiKeyAuth: []

tags:
  - name: classify
    description: 등급 분류 추론 (FUN-005)
  - name: confirm
    description: 분류 결과 확정·재라벨 (FUN-005, FUN-024)
  - name: training
    description: 모델 학습·재학습 (FUN-004)
  - name: synthesis
    description: 샘플 문서 합성 (FUN-003)
  - name: schema
    description: 등급체계 관리 (FUN-005)
  - name: metrics
    description: 성능 지표·리포트 (FUN-024)
  - name: documents
    description: 등급 판정 대상 문서 업로드·ingestion (FUN-005 연계)
  - name: health
    description: 상태 확인
  - name: admin
    description: 운영 관리자 진단·모델 활성화
  - name: golden
    description: 골든셋 빌드·검수 산출물
  - name: promotion
    description: 교정 라벨 승급 승인

paths:
  /healthz:
    get:
      x-audience: kl          # IF-01 — KL 웹시스템이 호출한다
      tags: [health]
      summary: 헬스 체크
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                description: >-
                  연동에 쓰는 필드는 status·model_version·uptime_sec 이다. 그 밖의 필드(build·
                  deploy_profile·checks 등)는 운영 진단용이라 예고 없이 늘거나 바뀔 수 있다.
                required: [status]
                additionalProperties: true
                properties:
                  status: { type: string, example: ok }
                  model_version: { type: string, example: "v-fe4b386b" }
                  uptime_sec: { type: integer, example: 5314 }
                  warmup_done: { type: boolean, description: "모델 예열 완료 여부" }

  /healthz/live:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [health]
      summary: Liveness Probe
      security: []
      responses:
        '200':
          description: 프로세스 생존
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /healthz/ready:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [health]
      summary: Readiness Probe
      security: []
      responses:
        '200':
          description: 의존성 준비 완료
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: 모델·DB·벡터스토어·스토리지 등 준비 미완료

  /healthz/deep:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [health]
      summary: 상세 의존성 진단
      security: []
      responses:
        '200':
          description: 상세 진단 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /classify:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [classify]
      summary: 단일 문서 등급 분류 (동기)
      description: |
        KL이 업로드한 문서를 즉시 분류한다. 길이가 길거나 RAG ON 시
        타임아웃 우려가 있으면 /classify/async 사용 권장.
        결과는 staging 상태로 저장되며, /confirm 호출 시 최종 확정.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: 분류 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: 본문 길이 초과 (use /classify/async)
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /classify/stream:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [classify]
      summary: 단일 문서 등급 분류 — SSE 스트리밍 (실시간 진척 수신)
      description: |
        /classify와 동일한 분류를 수행하되, 단계별 진행 상황을 Server-Sent Events로
        스트리밍한다. 긴 문서나 RAG ON 요청에서 타임아웃 없이 진척을 받을 때 사용.
        이벤트 타입: progress(단계명) | partial(중간 결과) | result(최종) | error | done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: SSE 스트림 (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /classify/explain:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [classify]
      summary: 분류 결과 상세 근거 조회 (리뷰어용)
      description: |
        /classify 응답에 담긴 EvidenceSpan을 등급·평가요소별로 재분류해
        "왜 이 등급인가"에 대한 상세 설명을 반환한다. FUN-024 리뷰 UI용.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: 분류 상세 근거
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: "요청 검증 실패" }
        '500': { $ref: '#/components/responses/InternalError' }

  /classify/async:
    post:
      x-audience: kl          # IF-03 — KL 웹시스템이 호출한다
      tags: [classify]
      summary: 분류 작업 큐 등록 (비동기)
      description: |
        POST /documents 로 받은 doc_id 를 분류 큐에 넣는다. **content 는 보내지 않는 것이 표준**이다 —
        생략하면 등록 때 저장한 본문을 쓴다. 결과는 IF-05(GET /classify/jobs/{job_id})로 조회하거나
        callback_url 로 받는다. 호출 한도는 분당 60건이며 넘으면 429 를 돌려준다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyAsyncRequest'
      responses:
        '202':
          description: 큐 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyAsyncResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: 요청 검증 실패(doc_id 누락 등). 본문은 {"detail":[{"loc":…,"msg":…}]} 형태.
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /classify/batch:
    post:
      x-audience: kl          # IF-08 — [2026-09-29] KL 요청으로 개방. 코드는 그대로(변경 없음),
        # 태그만 internal→kl 로 고쳤다. 결과는 이 응답에 인라인(즉시 실행 PoC 경로)이거나
        # POST /classify/async 와 같은 GET /classify/jobs/{job_id}(IF-05)로 조회한다 — 운영
        # Celery 모드에서는 후자다. IF-05 의 kl_backend 좁힘 규칙이 그대로 적용된다.
      tags: [classify]
      summary: 다건 문서 일괄 분류 (비동기 큐, 최대 1000건)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/ClassifyRequest' }
                callback_url:
                  type: string
                  nullable: true
                  description: 완료·실패 시 결과 webhook 을 받을 주소(선택). 단건 요청(IF-03)과 같은 규칙(6장).
      responses:
        '202':
          description: |
            일괄 작업 등록 (부분 실패 허용).
            PoC는 즉시 in-process 실행이므로 응답에 completed/failed/failed_doc_ids/errors가
            즉시 채워진다. 운영 Celery 모드에서는 0/0/[]/[] 로 시작 후 /classify/jobs/{id}로 폴링.
          content:
            application/json:
              schema:
                type: object
                required: [job_id, total, status_url]
                properties:
                  job_id: { type: string, format: uuid }
                  total: { type: integer }
                  status:
                    type: string
                    enum: [queued, running, done, failed, partial]
                  status_url: { type: string, format: uri }
                  completed:
                    type: integer
                    description: 성공적으로 처리된 건 수 (부분 실패 처리 도입)
                  failed:
                    type: integer
                    description: retry까지 모두 실패한 건 수
                  failed_doc_ids:
                    type: array
                    description: 영구 실패한 doc_id 목록
                    items: { type: string }
                  errors:
                    type: array
                    description: |
                      영구 실패 사유 (doc_id·error_type·message·attempts).
                      [2026-09-30] error_type=DocumentTooLarge 는 그 문서 한 건이 너무 커서
                      (단건 동기 경로와 같은 청크 상한) 배치 전체를 오래 막지 않도록 재시도
                      없이(attempts=0) 즉시 실패 처리한 것이다 — 재제출해도 같은 이유로 다시
                      실패하니, 그 문서만 POST /classify/async 로 단건 제출할 것.
                    items:
                      type: object
                      properties:
                        doc_id: { type: string }
                        error_type: { type: string }
                        message: { type: string }
                        attempts: { type: integer }

  /classify/jobs/{job_id}:
    get:
      x-audience: kl          # IF-05 — KL 웹시스템이 호출한다
      tags: [classify]
      summary: 비동기 분류 작업 상태·결과 조회
      description: |
        status 가 done 이면 results[0] 에 분류 결과가 있다(단건 요청은 길이 1). failed 이면 error 에
        사유가 있다. 작업 상태는 기본 24시간 보관하므로 그 안에 조회한다 — 이후에는
        GET /classify/{doc_id} 로 최근 결과를 조회한다. 없는 job_id 는 404({"detail":"job not found"}).
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classify/{doc_id}:
    get:
      x-audience: kl          # IF-06 — KL 웹시스템이 호출한다
      tags: [classify]
      summary: 문서별 최근 분류 결과 조회
      description: |
        문서의 가장 최근 분류 결과를 **저장된 값으로 만들어** 돌려준다. 근거(evidence)·평가요소·경고·룰/모델 판정까지
        필요하면 IF-05 작업 결과를 쓴다.
        사람이 검수로 등급을 확정해도 label(예측 등급)은 바뀌지 않고, 확정 등급은
        confirmed_label·confirmed_by·confirmed_at 으로 따로 온다(확정 전에는 null).
        doc_id 는 POST /documents 가 돌려준 UUID 여야 한다(아니면 422). 분류 이력이 없으면
        404({"detail":"no classification for doc_id"}).
      parameters:
        - in: path
          name: doc_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredClassificationResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'doc_id 가 UUID 형식이 아님. 본문은 {"detail":"doc_id must be a UUID"}.' }
        '503': { description: 'DB 일시 장애. 본문은 {"detail":"service temporarily unavailable"} — 잠시 뒤 다시 조회한다.' }

  /confirm:
    post:
      x-audience: kl          # IF-07 — 지재원 포털이 사람 검수로 확정한 최종 등급을 여기로 돌려보낸다.
        # [2026-09-29 정정] 예전엔 internal(KL 미호출)로 적어 뒀으나 코드(api/confirm.py:75
        # require_role("admin","reviewer","kl_backend"))는 처음부터 kl_backend 역할을 받고
        # 있었다 — actor.user_id 로 KL 포털의 실제 검수자 신원을 전파하는 설계다(같은 파일
        # resolve_actor_user_id 주석). 태그만 실제 코드에 맞춰 고친다(동작 변경 없음).
      tags: [confirm]
      summary: 분류 결과 확정 (staging -> production) — KL 포털의 검수 확정을 받는 통로
      description: |
        지재원 포털에서 사람이 검수해 확정한 등급을 돌려받는다. Koipa 는 이 값을 재학습 입력으로
        쓴다(예측 label 은 감사 증적으로 남기고 덮어쓰지 않는다 — GET /classify/{doc_id} 의
        confirmed_label 로 함께 조회 가능). actor.user_id 에 KL 포털의 실제 검수자 신원을 담아
        보낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_id, confirmed_label, actor]
              properties:
                doc_id: { type: string }
                inference_id: { type: string, format: uuid }
                confirmed_label: { $ref: '#/components/schemas/Grade' }
                actor: { $ref: '#/components/schemas/Actor' }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: 확정 완료
          content:
            application/json:
              schema:
                type: object
                required: [confirmation_id, confirmed_at]
                properties:
                  confirmation_id: { type: string, format: uuid }
                  confirmed_at: { type: string, format: date-time }
                  persisted:
                    type: boolean
                    default: true
                    description: "DB 영속 여부. false=분류 미존재/DB 일시 장애로 감사로만 기록(무음 성공 아님) — 재확인 필요."
                  warnings:
                    type: array
                    items: { type: string }
                    description: "비치명 경고(분류 미존재·미지정 라벨·멱등 중복·영속 실패 등)."
                  second_review_required:
                    type: boolean
                    default: false
                    description: "고등급 2인검토 게이트로 needs_second_review 로 보류됐는지."

  /review-queue:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [confirm]
      summary: Review queue lookup
      description: |
        Returns server-side pending review items for classifications routed to
        needs_review or needs_second_review. The default status `pending` includes
        both review states. When the backing DB is unavailable, the API returns an
        empty list with `warnings` so clients can distinguish lookup failure from
        an actually empty queue.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of items to return.
        - in: query
          name: offset
          schema:
            type: integer
