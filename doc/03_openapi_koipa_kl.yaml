  /documents/{doc_id}/similar:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [documents]
      summary: 유사 문서 조회 (확정 등급 포함)
      description: >-
        기준 문서와 의미가 비슷한 문서를 확정 등급과 함께 돌려준다. 벡터(pgvector dense·
        코사인)와 등급(tb_document_labels)이 같은 PostgreSQL 안에 있어 한 쿼리로 끝난다 —
        별도 Vector DB 는 두지 않는다. 삭제(soft delete)된 문서는 결과에서 빠진다.
        verified_only=true 는 사람이 확정한 등급이 있는 문서만 돌려준다(기계가 매긴 등급을
        사람 판단의 근거처럼 보여주지 않기 위한 것). 기준 문서가 아직 색인되지 않았으면
        indexed=false 와 빈 목록이며 오류가 아니다 — 색인은 업로드 후 워커 큐에서 돈다.
      parameters:
        - in: path
          name: doc_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: k
          schema: { type: integer, default: 5, minimum: 1, maximum: 50 }
        - in: query
          name: verified_only
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 유사 문서 목록(유사도 내림차순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  doc_id:  { type: string }
                  indexed: { type: boolean, description: 기준 문서가 색인돼 있는가 }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        doc_id:      { type: string }
                        filename:    { type: string }
                        similarity:  { type: number, description: "1 - 코사인거리" }
                        grade:       { type: string, nullable: true, enum: [TS, S1, S2, S3] }
                        is_verified: { type: boolean }
                        verified_at: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: "pgvector 확장 또는 alembic 판(f8a9b0c1d2e3) 미적용" }

  /documents/analyze:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [documents]
      summary: 업로드 문서 파싱·검수게이트·분류 단계별 진단
      description: |
        데모/관리자 콘솔용 read-only 분석 엔드포인트. 문서를 저장하지 않고
        추출 → 정규화·PII 마스킹 → 청킹 → 검수게이트 → 분류 결과를 한 번에 반환한다.
        parse에는 table_coverage, table_count, table_cell_count, warnings가 포함되어
        표 구조화 여부와 잠재 누락 경고를 확인할 수 있다.
        HWP/HWPX/Office/PDF 표 구조화는 설치된 optional extractor에 따라
        수행되며, 미설치 또는 미검출 항목은 warnings로 노출된다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                return_evidence:
                  type: boolean
                  default: true
      responses:
        '200':
          description: 단계별 진단 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: "파일 크기 초과 (MAX_UPLOAD_MB)" }
        '422': { description: "빈 파일 또는 파싱 실패" }

  /schema/grades:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [schema]
      summary: 현재 등급체계 조회
      responses:
        '200':
          description: 등급체계
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  grades:
                    type: array
                    items: { $ref: '#/components/schemas/GradeDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

    put:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [schema]
      summary: 등급체계 변경 (관리자 권한, 재학습 필요성 응답)
      description: |
        [2026-09-10] 서빙 분류기를 멈추게 하는 변경은 저장 전에 거부한다(409).
        서빙은 모델의 등급 집합이 DB 활성 등급 집합과 다르면 모델 로드를 거부하고 규칙엔진으로
        내려가므로, 활성 집합을 모델과 다르게 만드는 추가·비활성화는 다음 재기동·리로드부터
        분류기를 멈춘다. 그래도 저장하려면 force=true 와 force_reason 을 함께 보낸다.
        이름·설명·색·순서만 바꾸는 저장은 등급 집합이 같아 그대로 적용된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grades, actor]
              properties:
                grades:
                  type: array
                  items: { $ref: '#/components/schemas/GradeDefinition' }
                actor: { $ref: '#/components/schemas/Actor' }
                force:
                  type: boolean
                  default: false
                  description: 서빙 모델과 등급 집합이 어긋나는 변경을 그래도 저장할 때만 true
                force_reason:
                  type: string
                  nullable: true
                  description: force=true 일 때 필수 — 감사에 남는다
      responses:
        '200':
          description: 변경 적용
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  requires_retraining: { type: boolean }
                  reason: { type: string }
                  serving_impact:
                    type: string
                    description: 이 변경이 서빙 분류기에 주는 영향. 빈 문자열이면 영향 없음
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            쓰기는 admin 전용이다(GET 은 admin·reviewer·system·kl_backend 허용).
            reviewer/system 키로 PUT 하면 여기로 떨어진다 — `app.py` 의 `_schema_grades_rbac`.
        '409':
          description: 서빙 분류기를 멈추게 하는 변경이라 저장하지 않음(force 와 사유 없음). detail 에 영향이 적힌다
        '422':
          description: 요청 본문 검증 실패(grades·actor 누락 등)

