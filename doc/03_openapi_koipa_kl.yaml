  /regulations:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 규정 파일 등록 (색인은 비동기 — 기본 꺼짐 기능)
      description: |
        회원사가 올리는 사내 규정 파일을 받아 조항·문장으로 나누고 임베딩한다. 검수 화면이 문서와 관련된 규정 **원문 문장**을
        참고로 보여 주기 위한 재료다. **등급을 바꾸지 않는다.** `regulation_reference_enabled` 가 꺼져 있으면(기본) 이 경로는 404 다.

        - 지원 형식: txt · md · docx · pdf · hwp · hwpx (크기 한도 MAX_UPLOAD_MB)
        - **같은 파일(SHA-256)이 이미 있으면 새 판을 만들지 않고 기존 reg_id 를 200 으로 돌려준다.**
        - 색인은 워커가 한다. 상태는 `GET /regulations/{reg_id}` 로 본다(indexing → ready · failed).
        - 원본은 암호화 버킷에 보관하며 내려받는 경로는 없다. 삭제하면 원본·조항·문장이 함께 지워진다.
        - 권한: admin · kl_backend.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name, version_label]
              properties:
                file: { type: string, format: binary }
                name: { type: string, maxLength: 200, description: "규정명. 같은 규정명의 판들이 한 계열이다" }
                version_label: { type: string, maxLength: 50, description: "판 표기(예 v3.1)" }
                effective_date: { type: string, description: "시행일 YYYY-MM-DD (선택)" }
      responses:
        '202':
          description: 접수됨 — 색인 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegulationRegisterResponse' }
        '200':
          description: 같은 파일이 이미 있다(duplicate=true) — 기존 reg_id
          content:
            application/json:
