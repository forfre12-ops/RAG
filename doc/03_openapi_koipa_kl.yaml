        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin 또는 kl_backend 역할이 필요하다" }
        '413': { description: "파일 크기 초과 (MAX_UPLOAD_MB)" }
        '422': { description: "지원하지 않는 형식 · 빈 파일 · 규정명/판 표기 누락 · 시행일 형식 오류" }
        '503': { description: "색인 작업 큐를 쓸 수 없다(브로커 없음)" }
    get:
