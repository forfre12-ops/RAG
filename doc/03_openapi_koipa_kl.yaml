      responses:
        '200':
          description: 활성화 또는 게이트 차단 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/escalation-held:
    get:
      tags: [admin]
