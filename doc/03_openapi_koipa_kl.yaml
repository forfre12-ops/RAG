  /documents:
    post:
      x-audience: kl          # IF-02 — KL 웹시스템이 호출한다
      tags: [documents]
      summary: 분류 대상 문서 업로드·ingestion
      description: |
        등급 판정을 받을 업무 문서(HWP/PDF/DOCX/TXT 등)를 업로드한다.
        포맷 자동 감지 → 텍스트 추출 → 원본 스토리지 저장 →
        documents/chunks 테이블 적재. 응답의 doc_id 를 POST /classify/async 본문
        {"doc_id": "<doc_id>"} 에 실어 등급을 요청한다(쿼리 파라미터는 받지 않는다).
        enqueue_classification=true 로 보내면 등록과 동시에 비동기 분류를 큐에 걸고, 응답에
        classification_job_id 가 담긴다.

        같은 내용(SHA-256 동일)의 파일을 다시 등록하면 새 문서를 만들지 않고 기존 doc_id 를
        돌려준다. 이때 함께 보낸 메타데이터는 갱신되지 않는다.
        지원하지 않는 형식이거나 본문이 추출되지 않아도 201 로 등록된다 — 응답의 char_count·
        warnings·requires_review 를 확인한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [actor]
              properties:
                actor:
                  type: string
                  description: "Actor JSON 문자열 (user_id, role)"
                source_type:
                  type: string
                  nullable: true
                  description: "ICD §3.1 출처: public | registered_patent | academic | internal | external_confidential. 공개 출처면 분류 시 S3 로 cap 된다."
                security_marking:
                  type: string
                  nullable: true
                  description: "ICD §3.2 보안표시: top_secret | secret | confidential | none. 표기가 있으면 접근범위보다 우선한다."
                access_scope:
                  type: string
                  nullable: true
                  description: "ICD §3.3 접근범위: approved_only | designated | department | all_employees. 보안표시가 none 일 때 관리수준(M)을 정하는 주 입력."
                enqueue_classification:
                  type: boolean
                  default: false
                  description: "true 면 등록과 동시에 비동기 분류를 큐에 건다(응답에 classification_job_id)."
                callback_url:
                  type: string
                  nullable: true
                  description: "enqueue_classification=true 일 때 분류 완료·실패 결과를 받을 webhook 주소(선택). POST /classify/async(IF-03)의 callback_url 과 같은 규칙(6장)."
                client_request_id:
                  type: string
                  nullable: true
                  description: "호출자가 지정하는 임의 식별자(선택). doc_id 는 내용 해시로 재사용(dedupe)되고 job_id 는 응답을 받은 뒤에야 알 수 있어, 이 요청과 결과를 미리 묶을 키가 둘 다 못 된다. 보낸 값은 응답·작업 조회·콜백에 그대로 돌아온다."
                file:
                  type: string
                  format: binary
                  nullable: true
                  description: "원본 파일. file 과 file_path 중 정확히 하나만 보낸다. 지원 형식: TXT·MD·LOG·CSV / HWP·HWPX / DOC·DOCX / XLS·XLSM·XLSX / PPTX·PPTM / PDF(텍스트 레이어가 있는 것). 이미지와 스캔 PDF 는 OCR 을 하지 않으므로 그 밖의 형식과 같이 201 로 등록되지만 본문이 추출되지 않는다(char_count 0)."
                file_path:
                  type: string
                  nullable: true
                  description: "[2026-10-06] file 대신 서버가 직접 읽을 경로(선택). documents_shared_mount_dirs 로 지정된 공유 디렉터리들(여러 개 등록 가능) 중 하나 안에 있어야 한다 — 이 설정이 배포에 없으면(기본) 422. 전부의 바깥을 가리키면 경로조작 방어로 거절(422)."
      responses:
        '201':
          description: ingestion 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { description: "빈 파일, actor JSON 오류, file·file_path 둘 다 보냄, 둘 다 안 보냄, 또는 file_path 가 공유 디렉터리 밖/미설정. 본문은 {\"detail\": ...} 형태." }
        '500': { $ref: '#/components/responses/InternalError' }

