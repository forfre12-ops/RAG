        배정한 관리자는 요청 본문이 아니라 서버가 확정한 포털 JWT 의 sub 이며, 본문에 actor_id 등을
        실으면 422 다. 존재하지 않는 doc_id·배치는 422 로 거절한다. 이미 배정된 대상은 원장에 다시
        적지 않고 skipped 로 돌려준다(멱등). 원장은 append-only 다.
      requestBody:
