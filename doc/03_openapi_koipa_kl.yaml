        버렸다**(services/guide_service.py 머리말이 그렇게 적고 있었다). RAG 자체도
        2026-09-05 미채택으로 걷혔다.

        세 가지가 잘못이었다 — 발주처가 파일을 올리면 무언가 보관·활용된다고 읽고,
        버릴 바이트에 크기 검사·읽기 비용을 들이며, 무엇보다 **원문이 우리 서버 메모리를
        한 번 지났다**(무반출 원칙에서 굳이 만들 경로가 아니다).

        요건도 아니다 — 종전 "FUN-002" 는 정본 요구사항 추적표에 없는 번호였다.
      requestBody:
