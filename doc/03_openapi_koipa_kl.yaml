        '200':
          description: 수정된 조항
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegulationClauseItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin 또는 kl_backend 역할이 필요하다" }
        '404': { description: "규정 또는 조항 없음" }
        '409': { description: "색인 중이라 수정할 수 없다" }
        '422': { description: "display·kind 모두 없음 · 알 수 없는 kind" }
        '503': { description: "임베더를 쓸 수 없다(표시 대상을 켤 때)" }

  /regulations/{reg_id}/preview:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 활성화 전 미리보기 — 이 규정 하나로 문서마다 어떻게 보이는지
      description: |
        후보 규정 **하나만**으로 문서(최대 20건)마다 검수 화면에 무엇이 보일지 계산한다(캐시를 쓰지 않는다). 규정이 문서에
        적용되는지는 점수로 판별되지 않으므로(시험에서 적용 안 되는 규정이 오히려 점수가 높았다) 활성화 전에 사람이 이 결과를 본다.
        문서가 없거나 색인 전이면 그 문서만 reason 이 달린다(요청 전체는 실패하지 않는다).
      parameters:
        - { in: path, name: reg_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegulationPreviewRequest' }
      responses:
        '200':
          description: 문서별 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegulationPreviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin 또는 kl_backend 역할이 필요하다" }
        '404': { description: "규정 없음" }
        '422': { description: "doc_ids 가 비었거나 20건을 넘는다" }
        '503': { description: "미리보기를 계산할 수 없다" }

  /regulations/runtime-toggle:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 검수 화면 노출 스위치 조회
      description: 관리 콘솔 체크박스 값 — 켜져 있어도 이 값이 꺼져 있으면 검수 화면엔 아무것도 안 보인다(등급 판정과 무관).
      responses:
        '200':
          description: 현재 값
          content:
            application/json:
              schema: { type: object, properties: { enabled: { type: boolean } }, required: [enabled] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 검수 화면 노출 스위치 변경 — 재시작 없이 즉시 반영
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { enabled: { type: boolean } }, required: [enabled] }
      responses:
        '200':
          description: 바뀐 값
          content:
            application/json:
              schema: { type: object, properties: { enabled: { type: boolean } }, required: [enabled] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin 또는 kl_backend 역할이 필요하다" }

  /regulations/llm-select-toggle:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 로컬 LLM 고르기 스위치 조회
      description: 값이 없으면(관리자가 콘솔에서 아직 안 건드림) `.env` 의 REGULATION_LLM_SELECT_ENABLED 기본값을 따른다.
      responses:
        '200':
          description: 현재 값
          content:
            application/json:
              schema: { type: object, properties: { enabled: { type: boolean } }, required: [enabled] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 로컬 LLM 고르기 스위치 변경 — 재시작 없이 즉시 반영
      description: 사내 LLM 서버(ollama 등)가 연결돼 있지 않으면 켜도 표시가 늘지 않는다(fail-closed, llm_not_local).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { enabled: { type: boolean } }, required: [enabled] }
      responses:
        '200':
          description: 바뀐 값
          content:
            application/json:
              schema: { type: object, properties: { enabled: { type: boolean } }, required: [enabled] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin 또는 kl_backend 역할이 필요하다" }

  /regulations/{reg_id}/activate:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 활성화 — 적용 대상 확인 필수
      description: |
        `scope_confirmed=true`(이 규정이 검수 대상 문서의 취급 기준임을 확인함)여야 한다. **같은 규정명의 이전 활성 판은 같은
        트랜잭션에서 보관으로 바뀐다.** 보관 판을 다시 활성화할 수 있다. 서로 다른 규정명의 활성 수는 상한
        (`regulation_active_max`, 기본 5)을 넘지 못한다.
      parameters:
        - { in: path, name: reg_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegulationActivateRequest' }
      responses:
        '200':
          description: 활성화된 규정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegulationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin 또는 kl_backend 역할이 필요하다" }
        '404': { description: "규정 없음" }
        '409': { description: "활성화할 수 없는 상태 · 표시할 수 있는 조항이 없다 · 활성 규정 수 상한 초과" }
        '422': { description: "scope_confirmed 가 true 가 아니다" }

  /regulations/{reg_id}/archive:
    post:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 보관(사용 중지)
      description: 활성 판만 보관한다. 검수 화면의 조회에서 즉시 빠진다(다른 프로세스는 최대 30초).
      parameters:
        - { in: path, name: reg_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 보관된 규정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegulationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin 또는 kl_backend 역할이 필요하다" }
        '404': { description: "규정 없음" }
        '409': { description: "활성 판이 아니다" }

  /documents/{doc_id}/regulation-evidence:
    get:
      x-audience: internal    # 당사 운영면 — KL 은 호출하지 않는다
      tags: [regulation]
      summary: 이 문서와 관련된 규정 원문 문장 (참고용 — 등급 판정 근거가 아니다)
      description: |
        활성 규정에서 문서 대표 벡터(유사 문서 조회와 같은 것)와 본문 앞부분으로 조항을 고르고, 그 조항 안에서 문서와
        가장 가까운 문장 **하나**를 원문 그대로 돌려준다(등급별 목록의 한 줄이면 목록 전체). 생성·요약이 없다.
        **점수·유사도·신뢰도 필드가 없다.**

        `items` 가 비어 있어도 **오류가 아니다** — `reason` 이 이유다: no_active_regulation · document_not_indexed ·
        embedder_mismatch · below_floor · no_sentence · not_applicable · public_document · llm_unavailable · llm_not_local
        (뒤의 넷은 서버가 로컬 LLM 판정 옵션을 켰을 때만 나온다). 문서가 없을 때만 404, 조회 인프라를 쓸 수 없을 때만 503 이다.
        검수 화면은 이 실패로 멈추면 안 된다.

        로컬 LLM 판정 옵션을 켠 서버는 조회가 준 후보 조항 상위 몇 개를 LLM 에게 보이고 문서에 직접 적용되는 항을 **고르게** 한다 —
        돌려주는 글은 여전히 규정 원문뿐이고 LLM 이 만든 글은 없다. 해당하는 항이 없으면 `items` 가 비고 `reason` 이 `not_applicable` 이다.
        이 옵션에서는 응답에 몇 초가 걸릴 수 있다.

        등급을 바꾸지 않으며 검수 라우팅에도 쓰이지 않는다. 골든셋 검수 화면에는 붙지 않는다(독립 판정 보호).
      parameters:
        - { in: path, name: doc_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: max_items, schema: { type: integer, minimum: 1, maximum: 3 }, description: "기본은 서버 설정(1)" }
      responses:
        '200':
          description: 관련 규정 문장(없으면 items=[] + reason)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegulationEvidenceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "admin · reviewer · kl_backend 역할이 필요하다" }
        '404': { description: "문서 없음" }
        '429': { description: "레이트리밋(분당 120)" }
        '503': { description: "조회 인프라를 쓸 수 없다" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    DocumentUploadResponse:
      type: object
      required: [doc_id, filename, source_format, file_hash, file_size_bytes, extraction_method,
                 extraction_quality, char_count, chunk_count, persisted, warnings]
      properties:
        doc_id:
          type: string
          format: uuid
          nullable: true
          description: "DB 적재 성공 시 UUID, 미가용 시 null. 같은 내용(SHA-256 동일)의 파일을 다시 등록하면 새로 만들지 않고 기존 doc_id 를 돌려준다."
        filename: { type: string, description: "업로드한 파일 이름" }
        source_format: { type: string, example: "pdf", description: "감지한 파일 형식(확장자)" }
        file_hash: { type: string, description: "SHA-256 hex" }
        file_size_bytes: { type: integer, description: "파일 크기(바이트)" }
        extraction_method: { type: string, example: "pdfminer", description: "본문 추출 방식" }
        extraction_quality: { type: number, format: float, minimum: 0, maximum: 1, description: "추출 품질(0~1). 낮으면 requires_review 가 켜질 수 있다." }
        char_count:
          type: integer
          description: "추출된 글자 수. 0 이면 분류할 본문이 없다(지원하지 않는 형식 등) — warnings 를 확인한다."
        chunk_count: { type: integer, description: "본문을 나눈 조각 수" }
        pages_total: { type: integer, nullable: true, description: "전체 쪽수. 쪽 개념이 없는 형식은 null" }
        client_request_id:
          type: string
          nullable: true
          description: "요청 때 보낸 값을 그대로 돌려준다(POST /documents, POST /documents/batch). 안 보냈으면 null."
        classification_job_id:
          type: string
          nullable: true
          description: "enqueue_classification=true 로 등록했을 때만 채워진다."
        classification_status: { type: string, nullable: true, description: "enqueue_classification=true 로 등록했을 때만 채워진다." }
        classification_status_url: { type: string, nullable: true, description: "enqueue_classification=true 로 등록했을 때만 채워진다(호스트 없는 경로)." }
        persisted: { type: boolean, description: "DB/storage 저장 성공 여부" }
        warnings:
          type: array
          items: { type: string }
        requires_review:
          type: boolean
          description: "저품질 추출 등으로 분류 전 검수가 필요하면 true. 자동분류를 그대로 통과하지 않는다."
        review_reasons:
          type: array
          items: { type: string }
          description: "requires_review 가 true 인 사유 목록"

    Grade:
      type: string
      description: 등급체계 코드. 관리자가 수정 가능하지만 기본 4단계 제공.
      enum:
        - TS    # 특급기밀
        - S1    # 1급 비밀
        - S2    # 2급 대외비
        - S3    # 3급 공개

    GradeDefinition:
      type: object
      required: [code, name, order]
      properties:
        code: { type: string, example: "S1" }
        name: { type: string, example: "1급 비밀" }
        order: { type: integer, description: "높을수록 높은 등급" }
        description: { type: string }
        color: { type: string, example: "#D32F2F" }

    Actor:
      type: object
      required: [user_id, role]
      description: 호출자(관리자/시스템) 정보. 감사 로그용.
      properties:
        user_id: { type: string }
        role:
          type: string
          enum: [admin, reviewer, system, kl_backend]

    DocumentInput:
      type: object
      required: [doc_id]
      properties:
        doc_id:
          type: string
          description: |
            POST /documents 가 돌려준 doc_id(UUID). 등록하지 않은 값을 content 없이 보내면 오류가
            아니라 최고 등급(TS)·needs_review 결과가 오고 사유는 warnings 에 담긴다(fail-secure).
            등록되지 않은 doc_id 의 결과는 검수 목록·판정 이력에 저장되지 않는다.
        content:
          type: string
          nullable: true
          maxLength: 1048576
          description: |
            분류할 본문 텍스트(선택). **생략하는 것이 표준**이며, 생략하면 POST /documents 로
            등록할 때 저장한 본문을 쓴다. 최대 1,048,576자.
        metadata:
          type: object
          description: |
            라벨링 보조 정보(작성 부서·문서 유형·작성일 등). 아래 3필드는 KL 연동 R6 계약
            (⚠ ICD 협의안 v0.9 — 화요일 미팅서 K1~K7 확정 후 동결). metadata_floor 게이트
            활성 시 등급 상향(floor)·검수 라우팅에 사용(운영 프로파일 onprem-local·full-train은 기본 활성).
          properties:
            source_type:
              type: string
              description: 문서 출처 유형(예 web_public/internal 등). source-prior 게이트 입력.
            security_marking:
              type: string
              enum: [top_secret, secret, confidential]
              description: |
                KL 원본 보안표시 → 등급 floor(안전하게 상향만·하향 없음):
                top_secret→TS · secret→S1 · confidential→S2. 소문자 exact-match(한글 표기 미매칭=무동작).
            access_scope:
              type: string
              enum: [approved_only, designated, department, all_employees]
              description: |
                접근범위 → 비밀관리성(M) 신호. 표기 없고 approved_only/designated/department이면
                예측이 낮을 때 검수 라우팅(ICD §4.4). (all_employees 처리는 협의 대상)
          additionalProperties: true
        text_already_preprocessed:
          type: boolean
          default: false
          description: true 면 엔진의 본문 정규화 단계를 건너뛴다. 보내지 않아도 된다.

    ClassifyRequest:
      allOf:
        - $ref: '#/components/schemas/DocumentInput'
        - type: object
          properties:
            return_evidence:
              type: boolean
              default: true
              description: 근거(evidence)를 응답에 담을지 여부

    ClassifyAsyncRequest:
      allOf:
        - $ref: '#/components/schemas/ClassifyRequest'
        - type: object
          properties:
            callback_url:
              type: string
              format: uri
              description: |
                완료·실패 시 엔진이 결과 JSON 을 POST 할 주소(선택). http/https 만 허용하고 loopback·
                link-local 주소는 거부한다 — 거부돼도 요청은 202 로 접수되므로 상태는 IF-05 로도 확인한다.
                응답이 2xx 가 아니면 최대 5회 재시도하고 그래도 실패하면 엔진 쪽 DLQ 에 보관한다.
                본문은 완료 시 {"job_id","status":"done","results":[ClassifyJobResult]},
                실패 시 {"job_id","status":"failed","error"} 이다. 서명 헤더는 붙이지 않는다.
            client_request_id:
              type: string
              nullable: true
              description: |
                호출자가 지정하는 임의 식별자(선택). doc_id 는 내용 해시로 재사용(dedupe)되고
                job_id 는 응답을 받은 뒤에야 알 수 있어, 이 요청과 결과를 미리 묶을 키가 둘 다
                못 된다. 보낸 값은 그대로 작업(job)에 저장되고 IF-05 조회·콜백 본문에 동일하게
                돌아온다. 서버는 값의 의미를 해석하지 않는다(그대로 보관·반환만).

    EvaluationFactors:
      type: object
      description: 정본 가이드 3요건(S 비공지성 · V 경제적 유용성 · M 비밀관리성) 점수. 각 0~2.
      properties:
        secrecy: { type: number, minimum: 0, maximum: 2, description: 비공지성(S) }
        value: { type: number, minimum: 0, maximum: 2, description: 경제적 유용성(V) }
        management: { type: number, minimum: 0, maximum: 2, description: 비밀관리성(M) }
        scores:
          type: object
          description: 도메인 독립 factor_code → 점수 맵
          additionalProperties: { type: number }

    EvidenceSpan:
      type: object
      required: [start, end, text]
      properties:
        start: { type: integer }
        end: { type: integer }
        text: { type: string }
        weight: { type: number }
        tag: { type: string, nullable: true }

    ClassifyOutcome:
      type: object
      description: "분류 결과의 공통 항목 — 동기 응답(ClassifyResponse)과 비동기 작업 결과(ClassifyJobResult)가 같이 쓴다. 필수는 inference_id · doc_id · label · confidence · confidence_tier · scores · model_version 일곱이고(confidence_tier 는 2026-10-02 추가된 계산 필드 — confidence 에서 항상 파생되므로 required), 나머지는 분류를 끝까지 수행했을 때만 채워진다. 본문을 읽을 수 없어 격리한 경우(label 은 최고 등급·confidence 0·status needs_review·model_version none)와 사람이 이미 확정한 등급이 있어 추론을 건너뛴 경우(model_version 이 human_review 로 시작·status staging)에는 evaluation_factors · rule_evaluation_factors · evidence · rule_grade · model_grade · decision_path · grade_candidates · grade_candidates_reason · automation_assessment 가 비어 있다(null 또는 빈 배열). 두 경우는 model_version 과 warnings 로 가른다."
      required: [inference_id, doc_id, label, confidence, confidence_tier, scores, model_version]
      properties:
        inference_id: { type: string, format: uuid, description: "분류 결과 식별자" }
        doc_id: { type: string, description: "분류한 문서의 doc_id" }
        label: { $ref: '#/components/schemas/Grade' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
          description: 선택한 등급(label)의 확률(0~1)
        confidence_tier:
          type: string
          enum: [낮음, 보통, 높음]
          readOnly: true
          description: >-
            [2026-10-02] confidence 를 검수 우선순위 3단계로 나눈 계산 필드(항상 confidence 에서
            그대로 파생, 서버가 직접 설정하지 않는다). 자동확정 여부를 가르는 게이트가 아니다 —
            KL포털이 문서마다 매번 사람 검수를 하므로 이 값은 어느 문서를 먼저 볼지 고르는 참고
            일 뿐이다. 경계(1/3·2/3)는 아직 사람 검수 결과로 실측하지 않은 균등분할이라 바뀔 수
            있다.
        scores:
          type: object
          description: 등급별 확률 분포
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        evaluation_factors:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EvaluationFactors'
        factors_source:
          type: string
          enum: [rule_evidenced, model_estimated]
          default: rule_evidenced
          description: >-
            [2026-10-02 정정] evaluation_factors 출처 요약 — rule_evidenced(S/V/M 세 축 모두 실제
            근거가 관측됨) / model_estimated(한 축 이상 근거 없음, 해당 축은 evaluation_factors.<축>.state
            가 "unknown"). "역산 추정치"가 아니다 — 2026-10-02 부터 등급에서 거꾸로 채우는 역산 자체를
            없앴다(근거가 없으면 축이 바로 "unknown"으로 온다). 세세한 판단은 evaluation_factors 의 각
            축 state 를 직접 볼 것, 이 필드는 요약용 파생값이다.
        rule_evaluation_factors:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EvaluationFactors'
          description: >-
            [2026-10-02 폐기 예정] 역산이 있었을 때 역산 전 원래 관측값을 보존하던 필드 — 역산 자체가
            없어져 항상 null 이다(그때는 evaluation_factors 가 곧 룰 관측값). 하위 호환을 위해 필드만 남겼다.
        evidence:
          type: array
          description: 근거 키워드·문맥 span
          items:
            $ref: '#/components/schemas/EvidenceSpan'
        model_version: { type: string, description: "판정에 쓴 모델 버전" }
        status:
          type: string
          enum: [staging, needs_review, needs_second_review]
          default: staging
          description: staging=자동확정 후보 · needs_review/needs_second_review=검수 라우팅. 이 필드는 검수가 필요한지만 나타내며 'confirmed' 값은 나오지 않는다(사람이 확정한 등급은 confirmed_label).
        warnings:
          type: array
          items: { type: string }
          description: 판정 사유·주의를 담은 문장 목록(영문). 형식이 바뀔 수 있으므로 화면 표시와 로그에만 쓴다.
        rule_grade:
          type: string
          nullable: true
          description: 룰 엔진(시드 키워드 S×V×M) 단독 판정.
        model_grade:
          type: string
          nullable: true
          description: 학습 분류기(BERT) 단독 판정(override/cap/floor 이전). 모델 미로드 시 null.
        decision_path:
          type: string
          nullable: true
          description: 최종 label 도출 경로(agreement/rule-override/source-cap/rule-only 등) — 룰·모델 이중판정 투명성.
        grade_candidates:
          type: array
          items: { type: string }
          description: 비밀관리성(M)을 받지 못해 아직 하나로 정해지지 않은 등급 후보. 비어 있으면 label 이 유일한 답이다. label 을 대체하지 않는다.
        grade_candidates_reason: { type: string, nullable: true, description: 후보가 남은 사유(사람이 읽는 문장) }
        regulation_reference:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/RegulationEvidenceItem'
          description: >-
            [2026-09-29] RAG+LLM 규정참고 — 이 문서에 해당하는 사내 규정 원문이 있을 때만 채운다(등급 판정과
            무관, 참고용). 기능이 꺼져 있거나 해당 규정이 없으면 null. GPU 가 없는 배포에서는 로컬 LLM 옵션이
            제한 시간 안에 끝나지 못해 항상 null 이 된다(GPU 도입은 별도 과제).
        regulation_summary:
          type: string
          nullable: true
          description: >-
            [2026-10-02] regulation_reference 를 사람 말로 요약한 한두 문장("당연히 설명이 나가야지"
            요건). regulation_reference 가 없거나 로컬 LLM 요약 옵션이 꺼져 있으면(기본) null. ⛔ 로컬
            LLM 이 새로 쓴 글이다 — regulation_reference(원문)와 항상 같이 보일 것, 이 문장만 단독으로
            등급·법리 근거로 쓰지 않는다. GPU 가 없는 배포에서는 항상 null.

    ClassifyResponse:
      description: |
        POST /classify · /classify/stream · /classify/explain 의 응답(전부 x-audience: internal, 우리 콘솔·리뷰 화면 전용) —
        공통 항목에 처리 시간과 automation_assessment 가 붙는다.
      allOf:
        - $ref: '#/components/schemas/ClassifyOutcome'
        - type: object
          required: [elapsed_ms]
          properties:
            elapsed_ms: { type: integer, description: "처리 시간(ms)" }
            automation_assessment:
              type: object
              nullable: true
              additionalProperties: true
              description: >-
                자동확정 정책 검증용 관측치(그림자 모드). 내부 전용이라 여기(동기 응답)에만 있다 — KL 이 호출하는
                ClassifyJobResult(IF-05 결과·콜백 본문)에는 2026-09-27 부터 싣지 않는다. 연동에 쓰지 않으며
                필드는 예고 없이 바뀔 수 있다.

    ClassifyJobResult:
      description: >-
        GET /classify/jobs/{job_id} 의 results[] 한 건(IF-05, KL 이 호출) 및 콜백(IF-04) 본문 — ClassifyOutcome
        그대로이며 처리 시간·automation_assessment 는 없다(둘 다 내부 전용 ClassifyResponse 에만 있다. 2026-09-27
        automation_assessment 제거 — 그 전에는 그림자 관측치가 KL 에도 실려 나갔다).

        [2026-09-29] KL(지재원 포털)이 실제로 받는 값은 또 좁혀진다: label(최종 판정=분류기가 메인)이 항상
        있고, rule_grade 는 label 과 **다를 때만** 채워진다(같으면 null — "등급이 같으면 하나만" 요청).

        [2026-10-02 뒤집힘] evaluation_factors·rule_evaluation_factors·evidence·decision_path 는 더
        이상 비우지 않는다 — KL포털이 문서마다 매번 사람 검수를 하기로 하면서 "신뢰도는 근거와 같이
        보여준다"로 결정이 바뀌었다(9/29 엔 반대로 "KL 요청 범위 밖"이라 비웠었다). model_grade·
        grade_candidates·grade_candidates_reason·scores 는 **여전히** KL 응답에서 항상 비어 있다
        (scores={}·나머지 null 또는 빈 배열) — 이 넷은 이번 결정에서 다시 논의되지 않았다. 같은 필드를
        우리 콘솔·관리자 역할로 조회하면(같은 엔드포인트를 내부 화면도 재사용) 채워진 그대로 나온다.
        구분은 서버가 호출자 인증 역할(kl_backend 인지)로 판단하며 요청 쪽에서 고를 수 없다.
      allOf:
        - $ref: '#/components/schemas/ClassifyOutcome'

    StoredClassificationResponse:
      type: object
      description: GET /classify/{doc_id} — 저장된 최근 분류 결과와 사람이 확정한 등급.
      required: [inference_id, doc_id, label, confidence, confidence_tier, scores, model_version]
      properties:
        inference_id: { type: string, format: uuid, description: "분류 결과 식별자" }
        doc_id: { type: string, description: "분류한 문서의 doc_id" }
        label: { $ref: '#/components/schemas/Grade' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
          description: 선택한 등급(label)의 확률(0~1)
        confidence_tier:
          type: string
          enum: [낮음, 보통, 높음]
          readOnly: true
          description: >-
            [2026-10-02] confidence 를 검수 우선순위 3단계로 나눈 계산 필드 — ClassifyOutcome 과 같다.
        scores:
          type: object
          description: 등급별 확률 분포
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        model_version: { type: string, description: "판정에 쓴 모델 버전" }
        status:
          type: string
          enum: [staging, needs_review, needs_second_review]
          default: staging
          description: staging=자동확정 후보 · needs_review/needs_second_review=검수 라우팅. 검수가 필요한지만 나타내며 'confirmed' 값은 나오지 않는다(사람 확정은 confirmed_* 로 따로 온다).
        confirmed_label:
          type: string
          nullable: true
          description: 사람이 검수로 확정한 등급. 예측(label)과 별개이며 확정 전에는 null.
        confirmed_by: { type: string, nullable: true, description: 확정한 검수자 식별자 }
        confirmed_at: { type: string, nullable: true, description: 확정 시각(ISO 8601 UTC) }

    ReviewQueueItem:
      type: object
      required: [classification_id, doc_id, grade, confidence, model_version, status]
      properties:
        classification_id: { type: string }
        doc_id: { type: string }
        filename:
          type: string
          nullable: true
        grade:
          type: string
          enum: [TS, S1, S2, S3]
          description: Model-predicted grade awaiting review.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        model_version: { type: string }
        status:
          type: string
          enum: [needs_review, needs_second_review]
        classified_at:
          type: string
          format: date-time
          nullable: true
        text_preview:
          type: string
          nullable: true

    ReviewQueueResponse:
      type: object
      required: [items, total, limit, offset, warnings]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        total:
          type: integer
          minimum: 0
          description: Total number of queue items matching the requested status filter.
        limit:
          type: integer
          minimum: 1
          maximum: 200
        offset:
          type: integer
          minimum: 0
        warnings:
          type: array
          items: { type: string }
          description: Non-empty when queue lookup degraded, for example because DB is unavailable.


    ClassifyAsyncResponse:
      type: object
      required: [job_id, status_url]
      properties:
        job_id: { type: string, format: uuid, description: "작업 식별자. IF-05 조회에 쓴다." }
        status:
          type: string
          description: 접수 직후 값. 큐 처리 경로는 queued, 즉시 처리 경로는 이미 done 또는 failed 일 수 있다.
        status_url:
          type: string
          description: 상태 조회 경로(호스트 없는 상대 경로). 예 /api/v1/classify/jobs/{job_id}

    JobStatus:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid, description: "작업 식별자" }
        status:
          type: string
          enum: [queued, running, done, failed, partial, cancelled]
          description: |
            현행 코드가 내는 값은 queued · done · failed · partial 이다.
            partial — 일부 건은 성공·일부는 영구 실패(다건 작업). completed/failed 로 분포를 확인한다.
        client_request_id:
          type: string
          nullable: true
          description: "POST /classify/async(또는 POST /documents) 요청 때 보낸 값을 그대로 돌려준다. 안 보냈으면 null."
        total: { type: integer, nullable: true, description: "요청 건수(단건은 1)" }
        completed: { type: integer, nullable: true, description: 성공 건 수 }
        failed: { type: integer, nullable: true, description: retry 모두 실패한 건 수 }
        failed_doc_ids:
          type: array
          items: { type: string }
          description: "영구 실패한 doc_id 목록"
        errors:
          type: array
          description: "영구 실패 사유(doc_id · error_type · message · attempts)"
          items:
            type: object
            properties:
              doc_id: { type: string }
              error_type: { type: string }
              message: { type: string }
              attempts: { type: integer }
        results:
          type: array
          nullable: true
          description: 분류 결과. done 이면 채워지고 단건 요청은 길이 1 이다.
          items:
            $ref: '#/components/schemas/ClassifyJobResult'
        error: { type: string, nullable: true, description: failed 일 때 사유 }

    Metrics:
      type: object
      properties:
        accuracy: { type: number }
        precision_macro: { type: number }
        recall_macro: { type: number }
        f1_macro: { type: number }
        fnr_overall:
          type: number
          description: 미탐율. 보안 핵심 KPI.
        fnr_by_grade:
          type: object
          additionalProperties: { type: number }

    MetricsReport:
      type: object
      properties:
        model_version: { type: string }
        evaluated_at: { type: string, format: date-time }
        dataset_version: { type: string }
        sample_count: { type: integer }
        metrics: { $ref: '#/components/schemas/Metrics' }
        notes: { type: string }

    TrainJobSummary:
      type: object
      properties:
        train_job_id: { type: string, format: uuid }
        status: { type: string }
        training_type: { type: string }
        base_model: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        model_version: { type: string, nullable: true }
        f1_macro: { type: number, nullable: true }
        fnr_overall: { type: number, nullable: true }

    SynthCoverageCell:
      type: object
      description: 격자 한 칸. real 은 그 칸의 실문서 유래 건수 - 실문서가 있으면 합성이 급하지 않다.
      properties:
        grade: { type: string, enum: [TS, S1, S2, S3] }
        domain: { type: string }
        n: { type: integer }
        real: { type: integer }
    SyntheticDoc:
      type: object
      properties:
        synth_id: { type: string, format: uuid }
        target_grade: { $ref: '#/components/schemas/Grade' }
        domain: { type: string }
        llm_provider: { type: string }
        preview: { type: string, description: "본문 앞 200자" }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, approved, rejected] }

    HttpError:
      type: object
      required: [detail]
      description: 500·429 를 뺀 오류 응답 본문(FastAPI 기본 형태). 상태 코드로 구분한다.
      properties:
        detail:
          description: 오류 사유. 422 는 [{type, loc, msg, input}] 항목 배열이다.
          oneOf:
            - { type: string }
            - type: array
              items: { type: object, additionalProperties: true }
        code:
          type: string
          description: 413(요청 본문 한도)에서만 KOIPA_BODY_TOO_LARGE 가 온다.

    Error:
      type: object
      required: [code, message]
      description: 미처리 서버 오류(500) 본문. 그 밖의 오류 본문은 HttpError.
      properties:
        code:
          type: string
          description: |
            기계 식별용 오류 코드. 현행 코드가 내는 값은 KOIPA_INTERNAL(500)·KOIPA_RATE_LIMIT(429)·
            KOIPA_BODY_TOO_LARGE(413) 셋뿐이다. 다른 오류는 코드 없이 HTTP 상태 코드로 구분한다.
        message: { type: string }
        request_id: { type: string, nullable: true }
        details:
          type: object
          nullable: true
          additionalProperties: true
        retryable:
          type: boolean
          description: true 면 같은 요청을 다시 보내 성공할 수 있다(미처리 500 은 true).

    # ── 규정 참고 표시 (2026-09-25) — 전부 x-audience: internal 경로가 쓴다 ────────────
    RegulationRegisterResponse:
      type: object
      required: [reg_id, status, duplicate]
      properties:
        reg_id: { type: string, format: uuid }
        status: { type: string, enum: [indexing, ready, active, archived, failed] }
        duplicate: { type: boolean, description: "같은 파일이 이미 있으면 true — 새 판을 만들지 않고 기존 reg_id 를 돌려준다" }

    RegulationSummary:
      type: object
      required: [reg_id, name, version_label, status, clause_count, sentence_count]
      properties:
        reg_id: { type: string, format: uuid }
        name: { type: string }
        version_label: { type: string }
        status: { type: string, enum: [indexing, ready, active, archived, failed] }
        clause_count: { type: integer }
        sentence_count: { type: integer }
        effective_date: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        activated_at: { type: string, nullable: true }

    RegulationListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegulationSummary' }
        total: { type: integer }

    RegulationDetail:
      allOf:
        - $ref: '#/components/schemas/RegulationSummary'
        - type: object
          properties:
            filename: { type: string, nullable: true }
            source_format: { type: string, nullable: true }
            split_mode: { type: string, nullable: true, description: "article | numbered | paragraph(정확도 낮음)" }
            embed_model: { type: string, nullable: true }
            embed_target_count: { type: integer }
            embedded_count: { type: integer }
            display_clause_count: { type: integer }
            scope_note: { type: string, nullable: true }
            scope_confirmed: { type: boolean }
            warnings:
              type: array
              items: { type: string }
            error_message: { type: string, nullable: true }

    RegulationClauseItem:
      type: object
      required: [clause_id, seq, article_no, title, chapter, kind, kind_source, display, text]
      properties:
        clause_id: { type: string, format: uuid }
        seq: { type: integer }
        article_no: { type: string, description: "제34조 · 부칙 제2조 · 문단 12" }
        title: { type: string }
        chapter: { type: string }
        kind: { type: string, enum: [general, procedure, grade_def, handling, other] }
        kind_source: { type: string, enum: [auto, admin] }
        display: { type: boolean }
        text: { type: string, description: "조항 원문" }

    RegulationClauseList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegulationClauseItem' }
        total: { type: integer }

    RegulationClausePatchRequest:
      type: object
      properties:
        display: { type: boolean }
        kind: { type: string, enum: [general, procedure, grade_def, handling, other] }

    RegulationActivateRequest:
      type: object
      required: [scope_confirmed]
      properties:
        scope_confirmed: { type: boolean, description: "이 규정이 검수 대상 문서의 취급 기준임을 확인했다 — true 여야 활성화된다" }
        scope_note: { type: string, maxLength: 500, nullable: true, description: "적용 대상 한 줄 설명" }

    RegulationEvidenceItem:
      type: object
      required: [regulation, clause, sentences, is_grade_list]
      properties:
        regulation:
          type: object
          required: [reg_id, name, version_label]
          properties:
            reg_id: { type: string, format: uuid }
            name: { type: string }
            version_label: { type: string }
        clause:
          type: object
          required: [clause_id, article_no, title]
          properties:
            clause_id: { type: string, format: uuid }
            article_no: { type: string }
            title: { type: string }
        sentences:
          type: array
          items: { type: string }
          description: "규정 원문 문장 그대로. 등급별 목록이면 목록 전체(순서대로)"
        is_grade_list: { type: boolean }

    RegulationEvidenceResponse:
      type: object
      required: [doc_id, items]
      properties:
        doc_id: { type: string }
        indexed:
          type: boolean
          nullable: true
          description: "문서 대표 벡터가 있는가. null 은 확인하지 않았다는 뜻(활성 규정이 없음)"
        reason:
          type: string
          nullable: true
          description: "items 가 비었을 때 이유 — no_active_regulation | document_not_indexed | embedder_mismatch | below_floor | no_sentence | not_applicable | public_document | llm_unavailable | llm_not_local. 오류가 아니라 정상 응답이다(뒤의 넷은 로컬 LLM 판정 옵션을 켰을 때만 나온다)"
        items:
          type: array
          items: { $ref: '#/components/schemas/RegulationEvidenceItem' }

    RegulationPreviewRequest:
      type: object
      required: [doc_ids]
      properties:
        doc_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string }

    RegulationPreviewResponse:
      type: object
      required: [reg_id, results]
      properties:
        reg_id: { type: string, format: uuid }
        results:
          type: array
          items:
            type: object
            required: [doc_id, items]
            properties:
              doc_id: { type: string }
              indexed: { type: boolean, nullable: true }
              reason: { type: string, nullable: true }
              items:
                type: array
                items: { $ref: '#/components/schemas/RegulationEvidenceItem' }

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HttpError' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HttpError' }
    Forbidden:
      description: 권한 없음 (역할 부족 — RBAC 거부)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HttpError' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HttpError' }
    InternalError:
      description: 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 호출 한도 초과 (rate-limit). 헤더 Retry-After에 재시도 가능 시간(초) 포함.
      headers:
        Retry-After:
          schema: { type: integer }
          description: 재시도까지 대기 권장 시간(초)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: KOIPA_RATE_LIMIT }
              message: { type: string, example: 'rate limit exceeded: 60 per 1 minute' }
              retry_after_sec: { type: integer, example: 60 }
    PayloadTooLarge:
      description: 업로드 파일 크기 한도(기본 20MB) 또는 JSON 요청 본문 한도(기본 25MB) 초과.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HttpError' }
