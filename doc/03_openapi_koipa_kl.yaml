        include_events=true 이면 배정 원장(candidate_assignments.jsonl) 이벤트를 최신순으로 함께 준다.
        enforced 는 두 강제 손잡이(golden_reviewer_assignment_enforced · golden_review_blind_enforced)의
        현재 값이다 — 꺼져 있으면(기본) 배정은 기록만 되고 검수자에게는 종전처럼 전체가 보인다.
        enforcement 는 같은 값을 {assignment_enforced, blind_enforced} 로 준다(골든셋 콘솔의 「검수 배정」 패널이 읽는다).
        assignments 는 지금 유효한 배정을 (검수자, 문서 하나 또는 배치 하나)마다 한 줄씩 편 표이고, 그 배정을 적은
        원장 이벤트의 시각(assigned_at, UTC)·배정한 관리자(assigned_by)·사유(reason)가 붙는다.
      parameters:
        - { in: query, name: reviewer_id, schema: { type: string }, description: 이 검수자만 }
        - { in: query, name: doc_id, schema: { type: string }, description: 이 문서를 볼 수 있는 검수자만 }
        - { in: query, name: review_batch, schema: { type: string }, description: 이 배치를 배정받은 검수자만 }
        - { in: query, name: include_events, schema: { type: boolean, default: false } }
        - { in: query, name: limit, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          description: 배정 현황
          content:
            application/json:
              schema:
