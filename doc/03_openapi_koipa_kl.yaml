                type: object
                properties:
                  guide_id: { type: string }
                  current_training_version:
                    type: string
                    description: "현재 운영 모델이 학습한 기준 버전"
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: string }
                        effective_date: { type: string, format: date }
                        change_summary: { type: string }
                        registered_at: { type: string, format: date-time }

  /schema/grades:
