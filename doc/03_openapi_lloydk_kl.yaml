openapi: 3.0.3
info:
  title: Lloydk AI Engine API
  description: |
    한국지식재산보호원 AI 영업비밀관리시스템 — 로이드케이 AI 엔진의
    KL 웹시스템 연동용 REST API 명세.

    담당 기능: FUN-003, FUN-004, FUN-005, FUN-022, FUN-023, FUN-024
    호출 주체: KL 웹시스템 (Backend)
    제공 주체: Lloydk AI Engine (FastAPI)

    인증: API Key (서버 간 통신) + 선택적 JWT (관리자 행위 추적)
    모든 응답은 application/json. 파일 업로드는 multipart/form-data.
    날짜·시각은 ISO 8601 UTC. 모든 ID는 UUIDv4.

    내부 RAG 백엔드: PostgreSQL pgvector dense + bigram tsvector `ts_rank`
    하이브리드. 본 명세는 backend-agnostic 하므로 KL 측은 RAG 동작 세부를
    몰라도 호출 가능. ES 경로는 레거시 어댑터로만 남아 있다.
  version: 1.0.0-draft
  contact:
    name: Lloydk AI Engineering
servers:
  - url: http://lloydk-api:8000/api/v1
    description: 온프레미스 Docker 내부망
  - url: https://{host}/api/v1
    description: 프로덕션
    variables:
      host:
        default: ai.example.kipra.local

security:
  - ApiKeyAuth: []

tags:
  - name: classify
    description: 등급 분류 추론 (FUN-005)
  - name: confirm
    description: 분류 결과 확정·재라벨 (FUN-005, FUN-024)
  - name: training
    description: 모델 학습·재학습 (FUN-004)
  - name: synthesis
    description: 샘플 문서 합성 (FUN-003)
  - name: guide
    description: 학습 가이드 문서 (FUN-002 연계)
  - name: schema
    description: 등급체계 관리 (FUN-005)
  - name: metrics
    description: 성능 지표·리포트 (FUN-024)
  - name: documents
    description: 등급 판정 대상 문서 업로드·ingestion (FUN-005 연계)
  - name: answer
    description: RAG 기반 질의응답 합성
  - name: health
    description: 상태 확인
  - name: admin
    description: 운영 관리자 진단·모델 활성화
  - name: golden
    description: 골든셋 빌드·검수 산출물
  - name: promotion
    description: 교정 라벨 승급 승인

paths:
  /healthz:
    get:
      tags: [health]
      summary: 헬스 체크
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  model_version: { type: string, example: "kf-deberta-cls-v1.3.0" }
                  uptime_sec: { type: integer, example: 123456 }

  /healthz/live:
    get:
      tags: [health]
      summary: Liveness Probe
      security: []
      responses:
        '200':
          description: 프로세스 생존
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /healthz/ready:
    get:
      tags: [health]
      summary: Readiness Probe
      security: []
      responses:
        '200':
          description: 의존성 준비 완료
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '503':
          description: 모델·DB·벡터스토어·스토리지 등 준비 미완료

  /healthz/deep:
    get:
      tags: [health]
      summary: 상세 의존성 진단
      security: []
      responses:
        '200':
          description: 상세 진단 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /classify:
    post:
      tags: [classify]
      summary: 단일 문서 등급 분류 (동기)
      description: |
        KL이 업로드한 문서를 즉시 분류한다. 길이가 길거나 RAG ON 시
        타임아웃 우려가 있으면 /classify/async 사용 권장.
        결과는 staging 상태로 저장되며, /confirm 호출 시 최종 확정.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: 분류 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: 본문 길이 초과 (use /classify/async)
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /classify/stream:
    post:
      tags: [classify]
      summary: 단일 문서 등급 분류 — SSE 스트리밍 (실시간 진척 수신)
      description: |
        /classify와 동일한 분류를 수행하되, 단계별 진행 상황을 Server-Sent Events로
        스트리밍한다. 긴 문서나 RAG ON 요청에서 타임아웃 없이 진척을 받을 때 사용.
        이벤트 타입: progress(단계명) | partial(중간 결과) | result(최종) | error | done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: SSE 스트림 (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /classify/explain:
    post:
      tags: [classify]
      summary: 분류 결과 상세 근거 조회 (리뷰어용)
      description: |
        /classify 응답에 담긴 EvidenceSpan을 등급·평가요소별로 재분류해
        "왜 이 등급인가"에 대한 상세 설명을 반환한다. FUN-024 리뷰 UI용.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: 분류 상세 근거
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: "요청 검증 실패" }
        '500': { $ref: '#/components/responses/InternalError' }

  /classify/async:
    post:
      tags: [classify]
      summary: 분류 작업 큐 등록 (비동기, 대용량/RAG ON)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyAsyncRequest'
      responses:
        '202':
          description: 큐 등록 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }
                  status_url: { type: string, format: uri }
                  estimated_sec: { type: integer }

  /classify/batch:
    post:
      tags: [classify]
      summary: 다건 문서 일괄 분류 (비동기 큐, 최대 1000건)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                use_rag: { type: boolean, default: false }
                documents:
                  type: array
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/DocumentInput' }
      responses:
        '202':
          description: |
            일괄 작업 등록 (부분 실패 허용).
            PoC는 즉시 in-process 실행이므로 응답에 completed/failed/failed_doc_ids/errors가
            즉시 채워진다. 운영 Celery 모드에서는 0/0/[]/[] 로 시작 후 /classify/jobs/{id}로 폴링.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string, format: uuid }
                  total: { type: integer }
                  status:
                    type: string
                    enum: [queued, running, done, failed, partial]
                  status_url: { type: string, format: uri }
                  completed:
                    type: integer
                    description: 성공적으로 처리된 건 수 (부분 실패 처리 도입)
                  failed:
                    type: integer
                    description: retry까지 모두 실패한 건 수
                  failed_doc_ids:
                    type: array
                    description: 영구 실패한 doc_id 목록
                    items: { type: string }
                  errors:
                    type: array
                    description: 영구 실패 사유 (doc_id·error_type·message·attempts)
                    items:
                      type: object
                      properties:
                        doc_id: { type: string }
                        error_type: { type: string }
                        message: { type: string }
                        attempts: { type: integer }

  /classify/jobs/{job_id}:
    get:
      tags: [classify]
      summary: 비동기 분류 작업 상태·결과 조회
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404': { $ref: '#/components/responses/NotFound' }

  /classify/{doc_id}:
    get:
      tags: [classify]
      summary: 문서별 최근 분류 결과 조회
      parameters:
        - in: path
          name: doc_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyResponse'

  /confirm:
    post:
      tags: [confirm]
      summary: 관리자 분류 결과 확정 (staging -> production)
      description: |
        KL의 관리자가 분류 결과를 확정한다. 확정된 결과는 KL DB의
        최종 라벨이 되며, Lloydk 측에는 감사 로그로 보관된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_id, confirmed_label, actor]
              properties:
                doc_id: { type: string }
                model_version: { type: string }
                inference_id: { type: string, format: uuid }
                confirmed_label: { $ref: '#/components/schemas/Grade' }
                actor: { $ref: '#/components/schemas/Actor' }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: 확정 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmation_id: { type: string, format: uuid }
                  confirmed_at: { type: string, format: date-time }

  /review-queue:
    get:
      tags: [confirm]
      summary: Review queue lookup
      description: |
        Returns server-side pending review items for classifications routed to
        needs_review or needs_second_review. The default status `pending` includes
        both review states. When the backing DB is unavailable, the API returns an
        empty list with `warnings` so clients can distinguish lookup failure from
        an actually empty queue.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum number of items to return.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Pagination offset.
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, needs_review, needs_second_review, all]
            default: pending
          description: pending means needs_review plus needs_second_review.
      responses:
        '200':
          description: Pending review queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewQueueResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /relabel:
    post:
      tags: [confirm]
      summary: 오분류 수정 라벨 등록 (능동학습 입력)
      description: |
        관리자가 AI 분류 결과를 잘못된 것으로 판단하고 수정 라벨을
        부여한 경우. 누적된 재라벨 데이터는 재학습 큐로 자동 전송된다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_id, original_label, corrected_label, actor]
              properties:
                doc_id: { type: string }
                inference_id: { type: string, format: uuid }
                original_label: { $ref: '#/components/schemas/Grade' }
                corrected_label: { $ref: '#/components/schemas/Grade' }
                reason: { type: string, maxLength: 2000 }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '200':
          description: 재라벨 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  relabel_id: { type: string, format: uuid }
                  queue_size: { type: integer, description: "대기 중인 재라벨 누적 수" }
                  retrain_threshold: { type: integer, description: "재학습 자동 트리거 임계" }

  /train:
    post:
      tags: [training]
      summary: 모델 학습·재학습 트리거
      description: |
        스케줄 또는 KL 관리자 수동 트리거. 진행 상태는 /train/jobs/{id}로 폴링.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [training_type, actor]
              properties:
                training_type:
                  type: string
                  enum: [full, incremental, hyperparam_search]
                base_model:
                  type: string
                  enum: [kf-deberta-base, koelectra-base]
                  default: kf-deberta-base
                dataset_version: { type: string, description: "MLflow dataset tag" }
                hyperparams:
                  type: object
                  additionalProperties: true
                use_rag: { type: boolean, default: false }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '202':
          description: 학습 작업 등록
          content:
            application/json:
              schema:
                type: object
                properties:
                  train_job_id: { type: string, format: uuid }
                  status_url: { type: string, format: uri }
                  websocket_url: { type: string, format: uri }

  /train/jobs/{train_job_id}:
    get:
      tags: [training]
      summary: 학습 작업 진행 상태 조회
      parameters:
        - in: path
          name: train_job_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 학습 상태
          content:
            application/json:
              schema:
                type: object
                properties:
                  train_job_id: { type: string, format: uuid }
                  status:
                    type: string
                    enum: [queued, preprocessing, training, evaluating, registering, done, failed]
                  progress: { type: number, minimum: 0, maximum: 1, example: 0.42 }
                  current_epoch: { type: integer }
                  total_epochs: { type: integer }
                  metrics_so_far:
                    $ref: '#/components/schemas/Metrics'
                  started_at: { type: string, format: date-time }
                  estimated_finish_at: { type: string, format: date-time }
                  model_version: { type: string, nullable: true }
                  error: { type: string, nullable: true }

  /train/jobs:
    get:
      tags: [training]
      summary: 학습 작업 이력 목록
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrainJobSummary' }

  /synth/generate:
    post:
      tags: [synthesis]
      summary: LLM 기반 학습용 샘플 문서 생성
      description: |
        FUN-003. 등급별·도메인별 합성 문서를 LLM으로 생성하고 검수 큐에 적재한다.
        Adapter로 OpenAI/Anthropic/Google/vLLM 교체 가능.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_grade, count, actor]
              properties:
                target_grade: { $ref: '#/components/schemas/Grade' }
                domain:
                  type: string
                  enum: [tech, business, hr, finance, legal, mixed]
                  default: mixed
                count: { type: integer, minimum: 1, maximum: 500 }
                llm_provider:
                  type: string
                  enum: [anthropic, openai, google, vllm_qwen, vllm_exaone]
                  default: anthropic
                seed_documents:
                  type: array
                  items: { type: string, description: "Guide 문서 ID" }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '202':
          description: 생성 작업 등록
          content:
            application/json:
              schema:
                type: object
                properties:
                  synth_job_id: { type: string, format: uuid }
                  expected_count: { type: integer }
                  estimated_cost_usd: { type: number, format: float }

  /synth/queue:
    get:
      tags: [synthesis]
      summary: 검수 대기 중인 합성 문서 목록 (KL 검수 UI용)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 200 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SyntheticDoc' }

  /synth/{synth_id}/review:
    post:
      tags: [synthesis]
      summary: 합성 문서 검수 결과 등록 (승인/반려)
      parameters:
        - in: path
          name: synth_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, actor]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                corrected_grade: { $ref: '#/components/schemas/Grade' }
                comment: { type: string, maxLength: 2000 }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '200':
          description: 검수 결과 반영
          content:
            application/json:
              schema:
                type: object
                properties:
                  synth_id: { type: string, format: uuid }
                  final_status: { type: string, enum: [approved, rejected] }
                  added_to_dataset_version: { type: string, nullable: true }

  /documents:
    post:
      tags: [documents]
      summary: 분류 대상 문서 업로드·ingestion
      description: |
        등급 판정을 받을 업무 문서(HWP/PDF/DOCX/TXT 등)를 업로드한다.
        포맷 자동 감지 → 텍스트 추출(필요 시 OCR) → 원본 스토리지 저장 →
        documents/chunks 테이블 적재. 이후 POST /classify?doc_id=<doc_id> 로 등급 요청.
        /guide/documents(지식베이스용 가이드 문서)와 완전 분리된 도메인.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [actor, file]
              properties:
                actor:
                  type: string
                  description: "Actor JSON 문자열 (user_id, role)"
                doc_type:
                  type: string
                  nullable: true
                external_ref:
                  type: string
                  nullable: true
                  description: "외부 문서 ID (EDMS 등)"
                file:
                  type: string
                  format: binary
                  description: "HWP / HWPX / PDF / DOCX / TXT"
      responses:
        '201':
          description: ingestion 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: "파일 크기 초과 (MAX_UPLOAD_MB)" }
        '422': { description: "빈 파일 또는 actor JSON 오류" }
        '500': { $ref: '#/components/responses/InternalError' }

  /documents/analyze:
    post:
      tags: [documents]
      summary: 업로드 문서 파싱·검수게이트·분류 단계별 진단
      description: |
        데모/관리자 콘솔용 read-only 분석 엔드포인트. 문서를 저장하지 않고
        추출 → 정규화·PII 마스킹 → 청킹 → 검수게이트 → 분류 결과를 한 번에 반환한다.
        parse에는 table_coverage, table_count, table_cell_count, warnings가 포함되어
        표 구조화 여부와 잠재 누락 경고를 확인할 수 있다.
        HWP/HWPX/Office/PDF 표 구조화와 Office 내부 이미지 OCR은 설치된 optional extractor에 따라
        수행되며, 미설치 또는 미검출 항목은 warnings로 노출된다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                return_evidence:
                  type: boolean
                  default: true
      responses:
        '200':
          description: 단계별 진단 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: "파일 크기 초과 (MAX_UPLOAD_MB)" }
        '422': { description: "빈 파일 또는 파싱 실패" }

  /guide/documents:
    post:
      tags: [guide]
      summary: 학습 가이드 문서 등록·갱신 (FUN-002 연계)
      description: |
        KL이 관리하는 영업비밀 가이드 문서를 Lloydk가 학습 기준으로 사용할 수 있도록
        등록한다. 등록 시 자동으로 KURE-v1 임베딩되어 현재 RAG 백엔드
        collection/alias에 반영된다. 현재 기본은 PostgreSQL pgvector이며 ES는 레거시 경로다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [guide_id, version, file, actor]
              properties:
                guide_id: { type: string }
                version: { type: string, example: "v2.1" }
                effective_date: { type: string, format: date }
                change_summary: { type: string, maxLength: 4000 }
                file:
                  type: string
                  format: binary
                  description: HWP/DOCX/PDF
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  guide_id: { type: string }
                  version: { type: string }
                  indexed:
                    type: boolean
                    description: Elasticsearch 인덱스 적재 완료 여부 (alias 기준)
                  embedding_vector_count:
                    type: integer
                    description: 청크 단위 임베딩 벡터 개수 (KURE-v1 1024차원 기준)
                  triggers_retraining: { type: boolean }

  /guide/documents/{guide_id}:
    get:
      tags: [guide]
      summary: 가이드 문서 버전 목록 조회
      parameters:
        - in: path
          name: guide_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 버전 이력
          content:
            application/json:
              schema:
                type: object
                properties:
                  guide_id: { type: string }
                  current_training_version:
                    type: string
                    description: "현재 운영 모델이 학습한 기준 버전"
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: string }
                        effective_date: { type: string, format: date }
                        change_summary: { type: string }
                        registered_at: { type: string, format: date-time }

  /schema/grades:
    get:
      tags: [schema]
      summary: 현재 등급체계 조회
      responses:
        '200':
          description: 등급체계
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  grades:
                    type: array
                    items: { $ref: '#/components/schemas/GradeDefinition' }

    put:
      tags: [schema]
      summary: 등급체계 변경 (관리자 권한, 재학습 필요성 응답)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grades, actor]
              properties:
                grades:
                  type: array
                  items: { $ref: '#/components/schemas/GradeDefinition' }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '200':
          description: 변경 적용
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  requires_retraining: { type: boolean }
                  reason: { type: string }

  /metrics/latest:
    get:
      tags: [metrics]
      summary: 운영 중 모델의 최신 성능 지표
      responses:
        '200':
          description: 최신 지표
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsReport'

  /metrics/history:
    get:
      tags: [metrics]
      summary: 모델 버전별 성능 이력
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: 이력
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MetricsReport' }

  /metrics/confusion-matrix/{model_version}:
    get:
      tags: [metrics]
      summary: 버전별 Confusion Matrix
      parameters:
        - in: path
          name: model_version
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 매트릭스
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_version: { type: string }
                  labels:
                    type: array
                    items: { type: string }
                  matrix:
                    type: array
                    description: "행=정답, 열=예측"
                    items:
                      type: array
                      items: { type: integer }
                  fnr_by_grade:
                    type: object
                    additionalProperties: { type: number }

  /golden/build:
    post:
      tags: [golden]
      summary: 골든 후보 빌드 작업 생성
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: 빌드 작업 생성
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /golden/jobs/{job_id}:
    get:
      tags: [golden]
      summary: 골든 빌드 작업 상태 조회
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /golden/jobs/{job_id}/review.html:
    get:
      tags: [golden]
      summary: 골든 빌드 검수 HTML
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML 검수 화면
          content:
            text/html:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /promotions/pending:
    get:
      tags: [promotion]
      summary: 검증 라벨 승급 대기 목록
      responses:
        '200':
          description: 승급 대기 목록
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /promotions/promote:
    post:
      tags: [promotion]
      summary: 교정 라벨을 검증 라벨로 승급
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 승급 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /admin/model/reload:
    post:
      tags: [admin]
      summary: 활성 모델 핫리로드
      responses:
        '200':
          description: 리로드 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/model/activate:
    post:
      tags: [admin]
      summary: 특정 ModelVersion 수동 활성화
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version_label]
              properties:
                version_label: { type: string }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: 활성화 또는 게이트 차단 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/escalation-held:
    get:
      tags: [admin]
      summary: 이중검토 보류 건수
      responses:
        '200':
          description: 등급별 보류 건수
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/locked-readiness:
    get:
      tags: [admin]
      summary: locked_gold_eval readiness
      responses:
        '200':
          description: 등급별 locked 평가 준비도
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/dashboard:
    get:
      tags: [admin]
      summary: 운영 검수 대시보드 종합
      responses:
        '200':
          description: 운영 상태 종합
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }

  /admin/keywords:
    get:
      tags: [admin]
      summary: 태깅 키워드 목록 (등급·요소·활성 필터) — FUN-023
      parameters:
        - { name: grade, in: query, required: false, schema: { type: string } }
        - { name: factor, in: query, required: false, schema: { type: string } }
        - { name: active_only, in: query, required: false, schema: { type: boolean, default: true } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 500 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 키워드 목록
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin/reviewer role required" }
    post:
      tags: [admin]
      summary: 태깅 키워드 추가 (룰엔진 핫리로드) — FUN-023
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade, keyword, actor]
              properties:
                grade: { type: string }
                keyword: { type: string }
                pattern_type: { type: string, enum: [exact, regex, semantic], default: exact }
                factor: { type: string, nullable: true }
                weight: { type: number, default: 1.0 }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '201':
          description: 추가 결과 (룰엔진 리로드 여부 포함)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { description: "unknown/inactive grade code" }
        '403': { description: "admin role required" }
        '503': { description: "db unavailable" }

  /admin/keywords/{keyword_id}:
    patch:
      tags: [admin]
      summary: 태깅 키워드 수정·비활성 (is_active=false=소프트 삭제, 룰엔진 핫리로드) — FUN-023
      parameters:
        - { name: keyword_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor]
              properties:
                keyword: { type: string }
                pattern_type: { type: string, enum: [exact, regex, semantic] }
                factor: { type: string, nullable: true }
                weight: { type: number }
                is_active: { type: boolean }
                actor: { $ref: '#/components/schemas/Actor' }
      responses:
        '200':
          description: 수정·비활성 결과
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: "admin role required" }
        '404': { description: "keyword_id not found" }
        '503': { description: "db unavailable" }

  /answer:
    post:
      tags: [answer]
      summary: RAG 답안 합성 — query + RAG hits → LLM 답안 + 인용
      description: |
        분류와 별개 단계. 질의를 받아 RAG 검색(facade)으로 컨텍스트 hits를 모은 뒤
        LLM(원격/로컬/noop)으로 답안을 합성한다. 인용 출처(citations)는 hits 순서대로
        rank를 부여해 반환. noop·LLM 부재·생성 실패는 `deterministic_fallback=true`로
        결정론적 안내를 반환하며 5xx가 아닌 200으로 끝남(warnings에 사유).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagAnswerRequest'
      responses:
        '200':
          description: 답안 합성 완료 (deterministic_fallback 여부는 응답 필드 참조)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagAnswerResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: "요청 검증 실패 (예: query 길이 위반)"
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    DocumentUploadResponse:
      type: object
      required: [filename, source_format, file_hash, file_size_bytes, extraction_method,
                 extraction_quality, ocr_used, char_count, chunk_count, persisted, warnings]
      properties:
        doc_id:
          type: string
          format: uuid
          nullable: true
          description: "DB 적재 성공 시 UUID, 미가용 시 null"
        filename: { type: string }
        source_format: { type: string, example: "pdf" }
        file_hash: { type: string, description: "SHA-256 hex" }
        file_size_bytes: { type: integer }
        extraction_method: { type: string, example: "pdfminer" }
        extraction_quality: { type: number, format: float, minimum: 0, maximum: 1 }
        ocr_used: { type: boolean }
        char_count: { type: integer }
        chunk_count: { type: integer }
        persisted: { type: boolean, description: "DB/storage 저장 성공 여부" }
        warnings:
          type: array
          items: { type: string }

    Grade:
      type: string
      description: 등급체계 코드. 관리자가 수정 가능하지만 기본 4단계 제공.
      enum:
        - TS    # 특급기밀
        - S1    # 1급 비밀
        - S2    # 2급 대외비
        - S3    # 3급 공개

    GradeDefinition:
      type: object
      required: [code, name, order]
      properties:
        code: { type: string, example: "S1" }
        name: { type: string, example: "1급 비밀" }
        order: { type: integer, description: "높을수록 높은 등급" }
        description: { type: string }
        color: { type: string, example: "#D32F2F" }

    Actor:
      type: object
      required: [user_id, role]
      description: 호출자(관리자/시스템) 정보. 감사 로그용.
      properties:
        user_id: { type: string }
        role:
          type: string
          enum: [admin, reviewer, system, kl_backend]
        tenant_id: { type: string }
        ip: { type: string, nullable: true }

    DocumentInput:
      type: object
      required: [doc_id, content]
      properties:
        doc_id:
          type: string
          description: KL 측 문서 식별자
        tenant_id: { type: string }
        title: { type: string }
        content:
          type: string
          description: |
            전처리 전 텍스트. 길이 제한 1MB.
            바이너리 파일 분류는 별도 /preprocess/upload 사용.
        metadata:
          type: object
          description: 작성 부서, 문서 유형, 작성일 등 라벨링 보조 정보
          additionalProperties: true
        text_already_preprocessed:
          type: boolean
          default: false

    ClassifyRequest:
      allOf:
        - $ref: '#/components/schemas/DocumentInput'
        - type: object
          properties:
            use_rag:
              type: boolean
              default: false
              description: 사내규정 RAG 컨텍스트 결합 여부 (Elasticsearch dense kNN + BM25 + RRF 하이브리드)
            rag_index_alias:
              type: string
              description: |
                선택. RAG 검색 대상 인덱스 alias 명시.
                미지정 시 `tenant_id` 기반 기본 alias 사용 (`secrets-guides-{tenant_id}`).
                같은 tenant 내 다중 RAG 인덱스(부서별·정책별)가 필요할 때만 사용.
                상세: doc/13 §4.1 인덱스 명명 규칙.
              example: secrets-guides-koipa
            return_evidence:
              type: boolean
              default: true

    ClassifyAsyncRequest:
      allOf:
        - $ref: '#/components/schemas/ClassifyRequest'
        - type: object
          properties:
            callback_url:
              type: string
              format: uri
              description: 완료 시 KL이 받을 콜백 URL (선택)

    ClassifyResponse:
      type: object
      required: [inference_id, doc_id, label, confidence, model_version]
      properties:
        inference_id: { type: string, format: uuid }
        doc_id: { type: string }
        label: { $ref: '#/components/schemas/Grade' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
        scores:
          type: object
          description: 등급별 확률 분포
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        evaluation_factors:
          type: object
          description: 가이드 4대 평가요소 점수
          properties:
            economic_value: { type: number, minimum: 0, maximum: 5 }
            non_publicity: { type: number, minimum: 0, maximum: 5 }
            management_level: { type: number, minimum: 0, maximum: 5 }
            leak_impact: { type: number, minimum: 0, maximum: 5 }
        evidence:
          type: array
          description: 근거 키워드·문맥 span
          items:
            type: object
            properties:
              start: { type: integer }
              end: { type: integer }
              text: { type: string }
              weight: { type: number }
              tag: { type: string }
        rag_context_used:
          type: array
          items:
            type: object
            properties:
              source_doc: { type: string }
              chunk_id: { type: string }
              score: { type: number }
        model_version: { type: string }
        elapsed_ms: { type: integer }
        status:
          type: string
          enum: [staging, confirmed]
          default: staging
        warnings:
          type: array
          items: { type: string }

    ReviewQueueItem:
      type: object
      required: [classification_id, doc_id, grade, confidence, model_version, status]
      properties:
        classification_id: { type: string }
        doc_id: { type: string }
        filename:
          type: string
          nullable: true
        grade:
          type: string
          enum: [TS, S1, S2, S3]
          description: Model-predicted grade awaiting review.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        model_version: { type: string }
        status:
          type: string
          enum: [needs_review, needs_second_review]
        classified_at:
          type: string
          format: date-time
          nullable: true
        text_preview:
          type: string
          nullable: true

    ReviewQueueResponse:
      type: object
      required: [items, total, limit, offset, warnings]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReviewQueueItem'
        total:
          type: integer
          minimum: 0
          description: Total number of queue items matching the requested status filter.
        limit:
          type: integer
          minimum: 1
          maximum: 200
        offset:
          type: integer
          minimum: 0
        warnings:
          type: array
          items: { type: string }
          description: Non-empty when queue lookup degraded, for example because DB is unavailable.

    RagAnswerRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 4000
          description: 사용자 질의
        tenant_id:
          type: string
          description: tenant 필터(요청 본문 우선, 없으면 metadata.tenant_id)
        namespace:
          type: string
          description: RAG collection 명. 미지정 시 settings.rag_default_collection.
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        grade:
          $ref: '#/components/schemas/Grade'
        use_reranker:
          type: boolean
          default: true
        metadata:
          type: object
          description: "추가 filter (예: dept_id). tenant_id는 본문 tenant_id 우선."
          additionalProperties: true

    RagCitation:
      type: object
      required: [source_doc, chunk_id, score, rank]
      properties:
        source_doc: { type: string }
        chunk_id: { type: string }
        score: { type: number }
        rank: { type: integer, description: 1부터 시작 }

    RagAnswerUsage:
      type: object
      required: [provider, model, input_tokens, output_tokens, cost_usd]
      properties:
        provider: { type: string }
        model: { type: string }
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_usd: { type: number }
        latency_ms: { type: integer, default: 0 }
        success: { type: boolean, default: true }

    RagAnswerResult:
      type: object
      required: [answer, deterministic_fallback]
      properties:
        answer: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/RagCitation' }
        grade:
          $ref: '#/components/schemas/Grade'
          nullable: true
        usage:
          allOf:
            - $ref: '#/components/schemas/RagAnswerUsage'
          nullable: true
        warnings:
          type: array
          items: { type: string }
        deterministic_fallback:
          type: boolean
          description: LLM 미사용·실패 시 true (결정론적 안내 응답)

    JobStatus:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, done, failed, partial, cancelled]
          description: |
            partial — 일부 건은 성공·일부는 영구 실패. completed/failed로 분포 확인.
        progress: { type: number, minimum: 0, maximum: 1 }
        total: { type: integer }
        completed: { type: integer, description: 성공 건 수 }
        failed: { type: integer, description: retry 모두 실패한 건 수 }
        failed_doc_ids:
          type: array
          items: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              doc_id: { type: string }
              error_type: { type: string }
              message: { type: string }
              attempts: { type: integer }
        result:
          $ref: '#/components/schemas/ClassifyResponse'
        error: { type: string, nullable: true }

    Metrics:
      type: object
      properties:
        accuracy: { type: number }
        precision_macro: { type: number }
        recall_macro: { type: number }
        f1_macro: { type: number }
        fnr_overall:
          type: number
          description: 미탐율. 보안 핵심 KPI.
        fnr_by_grade:
          type: object
          additionalProperties: { type: number }

    MetricsReport:
      type: object
      properties:
        model_version: { type: string }
        evaluated_at: { type: string, format: date-time }
        dataset_version: { type: string }
        sample_count: { type: integer }
        metrics: { $ref: '#/components/schemas/Metrics' }
        notes: { type: string }

    TrainJobSummary:
      type: object
      properties:
        train_job_id: { type: string, format: uuid }
        status: { type: string }
        training_type: { type: string }
        base_model: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        model_version: { type: string, nullable: true }
        f1_macro: { type: number, nullable: true }
        fnr_overall: { type: number, nullable: true }

    SyntheticDoc:
      type: object
      properties:
        synth_id: { type: string, format: uuid }
        target_grade: { $ref: '#/components/schemas/Grade' }
        domain: { type: string }
        llm_provider: { type: string }
        preview: { type: string, description: "본문 앞 200자" }
        generated_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, approved, rejected] }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            기계 식별용 오류 코드. 예시:
              LLOYDK_VALIDATION, LLOYDK_AUTH, LLOYDK_NOT_FOUND,
              LLOYDK_MODEL_NOT_READY, LLOYDK_LLM_PROVIDER_FAIL,
              LLOYDK_GPU_UNAVAILABLE, LLOYDK_RATE_LIMIT, LLOYDK_INTERNAL
        message: { type: string }
        request_id: { type: string, format: uuid }
        details:
          type: object
          additionalProperties: true

  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 호출 한도 초과 (rate-limit). 헤더 Retry-After에 재시도 가능 시간(초) 포함.
      headers:
        Retry-After:
          schema: { type: integer }
          description: 재시도까지 대기 권장 시간(초)
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, example: LLOYDK_RATE_LIMIT }
              message: { type: string, example: 'rate limit exceeded: 60 per 1 minute' }
              retry_after_sec: { type: integer, example: 60 }
    PayloadTooLarge:
      description: 업로드 본문 크기 한도(기본 20MB) 초과.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
