# 자동 생성 파일 — 전체 규약서(doc/03_openapi_koipa_kl.yaml)에서 KL 이 호출하는 작업만 추렸다.
# 직접 고치지 않는다. 만드는 곳: poc/scripts/build_kl_api_package.py
openapi: 3.0.3
info:
  title: Koipa AI Engine API — KL 연동 인터페이스
  description: |
    한국지식재산보호원 AI 영업비밀관리시스템 — KL 웹시스템이 호출하는 7개 인터페이스만 담은 규격이다.
    전체 규약서에서 자동으로 만든 것이라 직접 고치지 않는다.

      IF-01  GET  /healthz                    준비 상태 확인
      IF-02  POST /documents                  문서 등록(multipart) -> doc_id
      IF-03  POST /classify/async             비동기 분류 요청(callback_url 은 선택)
      IF-04  POST {callback_url}              엔진 -> KL 완료 통보(선택, POST /classify/async 의 callback_url 참고)
      IF-05  GET  /classify/jobs/{job_id}     작업 상태·결과 조회
      IF-06  GET  /classify/{doc_id}          문서 단위 최근 결과 조회
      IF-07  POST /confirm                    지재원 포털의 검수 확정 등급을 돌려받음(재학습 입력)
      IF-08  POST /classify/batch             다건 문서 일괄 분류(최대 1000건, 결과는 IF-05로 조회)

    호출 순서와 예시는 함께 드리는 「AI 분류 엔진 연동 안내서」에 있다.
    인증은 서버 간 호출 기준 X-API-Key 헤더다(/healthz 는 인증 없음).
    오류는 HTTP 상태 코드로 구분한다. 본문은 대부분 {"detail": "사유"} 이고(422 는 항목별 배열),
    심볼릭 code 필드는 413·429·500 에만 있다.
  version: 1.0.0-draft
  contact:
    name: Koipa AI Engineering
servers:
- url: http://koipa-api:8000/api/v1
  description: 온프레미스 Docker 내부망
- url: https://{host}/api/v1
  description: 프로덕션
  variables:
    host:
      default: ai.example.koipa.local
security:
- ApiKeyAuth: []
tags:
- name: classify
  description: 등급 분류 추론 (FUN-005)
- name: confirm
  description: 분류 결과 확정·재라벨 (FUN-005, FUN-024)
- name: documents
  description: 등급 판정 대상 문서 업로드·ingestion (FUN-005 연계)
- name: health
  description: 상태 확인
paths:
  /healthz:
    get:
      x-audience: kl
      tags:
      - health
      summary: 헬스 체크
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                description: 연동에 쓰는 필드는 status·model_version·uptime_sec 이다. 그 밖의 필드(build· deploy_profile·checks
                  등)는 운영 진단용이라 예고 없이 늘거나 바뀔 수 있다.
                required:
                - status
                additionalProperties: true
                properties:
                  status:
                    type: string
                    example: ok
                  model_version:
                    type: string
                    example: v-fe4b386b
                  uptime_sec:
                    type: integer
                    example: 5314
                  warmup_done:
                    type: boolean
                    description: 모델 예열 완료 여부
      x-interface: IF-01
  /classify/async:
    post:
      x-audience: kl
      tags:
      - classify
      summary: 분류 작업 큐 등록 (비동기)
      description: |
        POST /documents 로 받은 doc_id 를 분류 큐에 넣는다. **content 는 보내지 않는 것이 표준**이다 —
        생략하면 등록 때 저장한 본문을 쓴다. 결과는 IF-05(GET /classify/jobs/{job_id})로 조회하거나
        callback_url 로 받는다. 호출 한도는 분당 60건이며 넘으면 429 를 돌려준다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyAsyncRequest'
      responses:
        '202':
          description: 큐 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyAsyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 요청 검증 실패(doc_id 누락 등). 본문은 {"detail":[{"loc":…,"msg":…}]} 형태.
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-interface: IF-03
  /classify/batch:
    post:
      x-audience: kl
      tags:
      - classify
      summary: 다건 문서 일괄 분류 (비동기 큐, 최대 1000건)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - documents
              properties:
                documents:
                  type: array
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/ClassifyRequest'
                callback_url:
                  type: string
                  nullable: true
                  description: 완료·실패 시 결과 webhook 을 받을 주소(선택). 단건 요청(IF-03)과 같은 규칙(6장).
      responses:
        '202':
          description: |
            일괄 작업 등록 (부분 실패 허용).
            PoC는 즉시 in-process 실행이므로 응답에 completed/failed/failed_doc_ids/errors가
            즉시 채워진다. 운영 Celery 모드에서는 0/0/[]/[] 로 시작 후 /classify/jobs/{id}로 폴링.
          content:
            application/json:
              schema:
                type: object
                required:
                - job_id
                - total
                - status_url
                properties:
                  job_id:
                    type: string
                    format: uuid
                  total:
                    type: integer
                  status:
                    type: string
                    enum:
                    - queued
                    - running
                    - done
                    - failed
                    - partial
                  status_url:
                    type: string
                    format: uri
                  completed:
                    type: integer
                    description: 성공적으로 처리된 건 수 (부분 실패 처리 도입)
                  failed:
                    type: integer
                    description: retry까지 모두 실패한 건 수
                  failed_doc_ids:
                    type: array
                    description: 영구 실패한 doc_id 목록
                    items:
                      type: string
                  errors:
                    type: array
                    description: |
                      영구 실패 사유 (doc_id·error_type·message·attempts).
                      [2026-09-30] error_type=DocumentTooLarge 는 그 문서 한 건이 너무 커서
                      (단건 동기 경로와 같은 청크 상한) 배치 전체를 오래 막지 않도록 재시도
                      없이(attempts=0) 즉시 실패 처리한 것이다 — 재제출해도 같은 이유로 다시
                      실패하니, 그 문서만 POST /classify/async 로 단건 제출할 것.
                    items:
                      type: object
                      properties:
                        doc_id:
                          type: string
                        error_type:
                          type: string
                        message:
                          type: string
                        attempts:
                          type: integer
      x-interface: IF-08
  /classify/jobs/{job_id}:
    get:
      x-audience: kl
      tags:
      - classify
      summary: 비동기 분류 작업 상태·결과 조회
      description: |
        status 가 done 이면 results[0] 에 분류 결과가 있다(단건 요청은 길이 1). failed 이면 error 에
        사유가 있다. 작업 상태는 기본 24시간 보관하므로 그 안에 조회한다 — 이후에는
        GET /classify/{doc_id} 로 최근 결과를 조회한다. 없는 job_id 는 404({"detail":"job not found"}).
      parameters:
      - in: path
        name: job_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-interface: IF-05
  /classify/{doc_id}:
    get:
      x-audience: kl
      tags:
      - classify
      summary: 문서별 최근 분류 결과 조회
      description: |
        문서의 가장 최근 분류 결과를 **저장된 값으로 만들어** 돌려준다. 근거(evidence)·평가요소·경고·룰/모델 판정까지
        필요하면 IF-05 작업 결과를 쓴다.
        사람이 검수로 등급을 확정해도 label(예측 등급)은 바뀌지 않고, 확정 등급은
        confirmed_label·confirmed_by·confirmed_at 으로 따로 온다(확정 전에는 null).
        doc_id 는 POST /documents 가 돌려준 UUID 여야 한다(아니면 422). 분류 이력이 없으면
        404({"detail":"no classification for doc_id"}).
      parameters:
      - in: path
        name: doc_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredClassificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: doc_id 가 UUID 형식이 아님. 본문은 {"detail":"doc_id must be a UUID"}.
        '503':
          description: DB 일시 장애. 본문은 {"detail":"service temporarily unavailable"} — 잠시 뒤 다시 조회한다.
      x-interface: IF-06
  /confirm:
    post:
      x-audience: kl
      tags:
      - confirm
      summary: 분류 결과 확정 (staging -> production) — KL 포털의 검수 확정을 받는 통로
      description: |
        지재원 포털에서 사람이 검수해 확정한 등급을 돌려받는다. Koipa 는 이 값을 재학습 입력으로
        쓴다(예측 label 은 감사 증적으로 남기고 덮어쓰지 않는다 — GET /classify/{doc_id} 의
        confirmed_label 로 함께 조회 가능). actor.user_id 에 KL 포털의 실제 검수자 신원을 담아
        보낸다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - doc_id
              - confirmed_label
              - actor
              properties:
                doc_id:
                  type: string
                inference_id:
                  type: string
                  format: uuid
                confirmed_label:
                  $ref: '#/components/schemas/Grade'
                actor:
                  $ref: '#/components/schemas/Actor'
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: 확정 완료
          content:
            application/json:
              schema:
                type: object
                required:
                - confirmation_id
                - confirmed_at
                properties:
                  confirmation_id:
                    type: string
                    format: uuid
                  confirmed_at:
                    type: string
                    format: date-time
                  persisted:
                    type: boolean
                    default: true
                    description: DB 영속 여부. false=분류 미존재/DB 일시 장애로 감사로만 기록(무음 성공 아님) — 재확인 필요.
                  warnings:
                    type: array
                    items:
                      type: string
                    description: 비치명 경고(분류 미존재·미지정 라벨·멱등 중복·영속 실패 등).
                  second_review_required:
                    type: boolean
                    default: false
                    description: 고등급 2인검토 게이트로 needs_second_review 로 보류됐는지.
      x-interface: IF-07
  /documents:
    post:
      x-audience: kl
      tags:
      - documents
      summary: 분류 대상 문서 업로드·ingestion
      description: |
        등급 판정을 받을 업무 문서(HWP/PDF/DOCX/TXT 등)를 업로드한다.
        포맷 자동 감지 → 텍스트 추출 → 원본 스토리지 저장 →
        documents/chunks 테이블 적재. 응답의 doc_id 를 POST /classify/async 본문
        {"doc_id": "<doc_id>"} 에 실어 등급을 요청한다(쿼리 파라미터는 받지 않는다).
        enqueue_classification=true 로 보내면 등록과 동시에 비동기 분류를 큐에 걸고, 응답에
        classification_job_id 가 담긴다.

        같은 내용(SHA-256 동일)의 파일을 다시 등록하면 새 문서를 만들지 않고 기존 doc_id 를
        돌려준다. 이때 함께 보낸 메타데이터는 갱신되지 않는다.
        지원하지 않는 형식이거나 본문이 추출되지 않아도 201 로 등록된다 — 응답의 char_count·
        warnings·requires_review 를 확인한다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - actor
              properties:
                actor:
                  type: string
                  description: Actor JSON 문자열 (user_id, role)
                source_type:
                  type: string
                  nullable: true
                  description: 'ICD §3.1 출처: public | registered_patent | academic | internal | external_confidential.
                    공개 출처면 분류 시 S3 로 cap 된다.'
                security_marking:
                  type: string
                  nullable: true
                  description: 'ICD §3.2 보안표시: top_secret | secret | confidential | none. 표기가 있으면 접근범위보다 우선한다.'
                access_scope:
                  type: string
                  nullable: true
                  description: 'ICD §3.3 접근범위: approved_only | designated | department | all_employees. 보안표시가 none
                    일 때 관리수준(M)을 정하는 주 입력.'
                enqueue_classification:
                  type: boolean
                  default: false
                  description: true 면 등록과 동시에 비동기 분류를 큐에 건다(응답에 classification_job_id).
                callback_url:
                  type: string
                  nullable: true
                  description: enqueue_classification=true 일 때 분류 완료·실패 결과를 받을 webhook 주소(선택). POST /classify/async(IF-03)의
                    callback_url 과 같은 규칙(6장).
                client_request_id:
                  type: string
                  nullable: true
                  description: 호출자가 지정하는 임의 식별자(선택). doc_id 는 내용 해시로 재사용(dedupe)되고 job_id 는 응답을 받은 뒤에야 알 수 있어, 이
                    요청과 결과를 미리 묶을 키가 둘 다 못 된다. 보낸 값은 응답·작업 조회·콜백에 그대로 돌아온다.
                file:
                  type: string
                  format: binary
                  nullable: true
                  description: '원본 파일. file 과 file_path 중 정확히 하나만 보낸다. 지원 형식: TXT·MD·LOG·CSV / HWP·HWPX / DOC·DOCX
                    / XLS·XLSM·XLSX / PPTX·PPTM / PDF(텍스트 레이어가 있는 것). 이미지와 스캔 PDF 는 OCR 을 하지 않으므로 그 밖의 형식과 같이 201
                    로 등록되지만 본문이 추출되지 않는다(char_count 0).'
                file_path:
                  type: string
                  nullable: true
                  description: '[2026-10-06] file 대신 서버가 직접 읽을 경로(선택). documents_shared_mount_dirs 로 지정된 공유 디렉터리들(여러
                    개 등록 가능) 중 하나 안에 있어야 한다 — 이 설정이 배포에 없으면(기본) 422. 전부의 바깥을 가리키면 경로조작 방어로 거절(422).'
      responses:
        '201':
          description: ingestion 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: '빈 파일, actor JSON 오류, file·file_path 둘 다 보냄, 둘 다 안 보냄, 또는 file_path 가 공유 디렉터리 밖/미설정. 본문은
            {"detail": ...} 형태.'
        '500':
          $ref: '#/components/responses/InternalError'
      x-interface: IF-02
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    DocumentUploadResponse:
      type: object
      required:
      - doc_id
      - filename
      - source_format
      - file_hash
      - file_size_bytes
      - extraction_method
      - extraction_quality
      - char_count
      - chunk_count
      - persisted
      - warnings
      properties:
        doc_id:
          type: string
          format: uuid
          nullable: true
          description: DB 적재 성공 시 UUID, 미가용 시 null. 같은 내용(SHA-256 동일)의 파일을 다시 등록하면 새로 만들지 않고 기존 doc_id 를 돌려준다.
        filename:
          type: string
          description: 업로드한 파일 이름
        source_format:
          type: string
          example: pdf
          description: 감지한 파일 형식(확장자)
        file_hash:
          type: string
          description: SHA-256 hex
        file_size_bytes:
          type: integer
          description: 파일 크기(바이트)
        extraction_method:
          type: string
          example: pdfminer
          description: 본문 추출 방식
        extraction_quality:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 추출 품질(0~1). 낮으면 requires_review 가 켜질 수 있다.
        char_count:
          type: integer
          description: 추출된 글자 수. 0 이면 분류할 본문이 없다(지원하지 않는 형식 등) — warnings 를 확인한다.
        chunk_count:
          type: integer
          description: 본문을 나눈 조각 수
        pages_total:
          type: integer
          nullable: true
          description: 전체 쪽수. 쪽 개념이 없는 형식은 null
        client_request_id:
          type: string
          nullable: true
          description: 요청 때 보낸 값을 그대로 돌려준다(POST /documents, POST /documents/batch). 안 보냈으면 null.
        classification_job_id:
          type: string
          nullable: true
          description: enqueue_classification=true 로 등록했을 때만 채워진다.
        classification_status:
          type: string
          nullable: true
          description: enqueue_classification=true 로 등록했을 때만 채워진다.
        classification_status_url:
          type: string
          nullable: true
          description: enqueue_classification=true 로 등록했을 때만 채워진다(호스트 없는 경로).
        persisted:
          type: boolean
          description: DB/storage 저장 성공 여부
        warnings:
          type: array
          items:
            type: string
        requires_review:
          type: boolean
          description: 저품질 추출 등으로 분류 전 검수가 필요하면 true. 자동분류를 그대로 통과하지 않는다.
        review_reasons:
          type: array
          items:
            type: string
          description: requires_review 가 true 인 사유 목록
    Grade:
      type: string
      description: 등급체계 코드. 관리자가 수정 가능하지만 기본 4단계 제공.
      enum:
      - TS
      - S1
      - S2
      - S3
    Actor:
      type: object
      required:
      - user_id
      - role
      description: 호출자(관리자/시스템) 정보. 감사 로그용.
      properties:
        user_id:
          type: string
        role:
          type: string
          enum:
          - admin
          - reviewer
          - system
          - kl_backend
    DocumentInput:
      type: object
      required:
      - doc_id
      properties:
        doc_id:
          type: string
          description: |
            POST /documents 가 돌려준 doc_id(UUID). 등록하지 않은 값을 content 없이 보내면 오류가
            아니라 최고 등급(TS)·needs_review 결과가 오고 사유는 warnings 에 담긴다(fail-secure).
            등록되지 않은 doc_id 의 결과는 검수 목록·판정 이력에 저장되지 않는다.
        content:
          type: string
          nullable: true
          maxLength: 1048576
          description: |
            분류할 본문 텍스트(선택). **생략하는 것이 표준**이며, 생략하면 POST /documents 로
            등록할 때 저장한 본문을 쓴다. 최대 1,048,576자.
        metadata:
          type: object
          description: |
            라벨링 보조 정보(작성 부서·문서 유형·작성일 등). 아래 3필드는 KL 연동 R6 계약
            (⚠ ICD 협의안 v0.9 — 화요일 미팅서 K1~K7 확정 후 동결). metadata_floor 게이트
            활성 시 등급 상향(floor)·검수 라우팅에 사용(운영 프로파일 onprem-local·full-train은 기본 활성).
          properties:
            source_type:
              type: string
              description: 문서 출처 유형(예 web_public/internal 등). source-prior 게이트 입력.
            security_marking:
              type: string
              enum:
              - top_secret
              - secret
              - confidential
              description: |
                KL 원본 보안표시 → 등급 floor(안전하게 상향만·하향 없음):
                top_secret→TS · secret→S1 · confidential→S2. 소문자 exact-match(한글 표기 미매칭=무동작).
            access_scope:
              type: string
              enum:
              - approved_only
              - designated
              - department
              - all_employees
              description: |
                접근범위 → 비밀관리성(M) 신호. 표기 없고 approved_only/designated/department이면
                예측이 낮을 때 검수 라우팅(ICD §4.4). (all_employees 처리는 협의 대상)
          additionalProperties: true
        text_already_preprocessed:
          type: boolean
          default: false
          description: true 면 엔진의 본문 정규화 단계를 건너뛴다. 보내지 않아도 된다.
    ClassifyRequest:
      allOf:
      - $ref: '#/components/schemas/DocumentInput'
      - type: object
        properties:
          return_evidence:
            type: boolean
            default: true
            description: 근거(evidence)를 응답에 담을지 여부
    ClassifyAsyncRequest:
      allOf:
      - $ref: '#/components/schemas/ClassifyRequest'
      - type: object
        properties:
          callback_url:
            type: string
            format: uri
            description: |
              완료·실패 시 엔진이 결과 JSON 을 POST 할 주소(선택). http/https 만 허용하고 loopback·
              link-local 주소는 거부한다 — 거부돼도 요청은 202 로 접수되므로 상태는 IF-05 로도 확인한다.
              응답이 2xx 가 아니면 최대 5회 재시도하고 그래도 실패하면 엔진 쪽 DLQ 에 보관한다.
              본문은 완료 시 {"job_id","status":"done","results":[ClassifyJobResult]},
              실패 시 {"job_id","status":"failed","error"} 이다. 서명 헤더는 붙이지 않는다.
          client_request_id:
            type: string
            nullable: true
            description: |
              호출자가 지정하는 임의 식별자(선택). doc_id 는 내용 해시로 재사용(dedupe)되고
              job_id 는 응답을 받은 뒤에야 알 수 있어, 이 요청과 결과를 미리 묶을 키가 둘 다
              못 된다. 보낸 값은 그대로 작업(job)에 저장되고 IF-05 조회·콜백 본문에 동일하게
              돌아온다. 서버는 값의 의미를 해석하지 않는다(그대로 보관·반환만).
    EvaluationFactors:
      type: object
      description: 정본 가이드 3요건(S 비공지성 · V 경제적 유용성 · M 비밀관리성) 점수. 각 0~2.
      properties:
        secrecy:
          type: number
          minimum: 0
          maximum: 2
          description: 비공지성(S)
        value:
          type: number
          minimum: 0
          maximum: 2
          description: 경제적 유용성(V)
        management:
          type: number
          minimum: 0
          maximum: 2
          description: 비밀관리성(M)
        scores:
          type: object
          description: 도메인 독립 factor_code → 점수 맵
          additionalProperties:
            type: number
    EvidenceSpan:
      type: object
      required:
      - start
      - end
      - text
      properties:
        start:
          type: integer
        end:
          type: integer
        text:
          type: string
        weight:
          type: number
        tag:
          type: string
          nullable: true
    ClassifyOutcome:
      type: object
      description: 분류 결과의 공통 항목 — 동기 응답(ClassifyResponse)과 비동기 작업 결과(ClassifyJobResult)가 같이 쓴다. 필수는 inference_id
        · doc_id · label · confidence · confidence_tier · scores · model_version 일곱이고(confidence_tier 는 2026-10-02
        추가된 계산 필드 — confidence 에서 항상 파생되므로 required), 나머지는 분류를 끝까지 수행했을 때만 채워진다. 본문을 읽을 수 없어 격리한 경우(label 은 최고 등급·confidence
        0·status needs_review·model_version none)와 사람이 이미 확정한 등급이 있어 추론을 건너뛴 경우(model_version 이 human_review 로 시작·status
        staging)에는 evaluation_factors · rule_evaluation_factors · evidence · rule_grade · model_grade · decision_path
        · grade_candidates · grade_candidates_reason · automation_assessment 가 비어 있다(null 또는 빈 배열). 두 경우는 model_version
        과 warnings 로 가른다.
      required:
      - inference_id
      - doc_id
      - label
      - confidence
      - confidence_tier
      - scores
      - model_version
      properties:
        inference_id:
          type: string
          format: uuid
          description: 분류 결과 식별자
        doc_id:
          type: string
          description: 분류한 문서의 doc_id
        label:
          $ref: '#/components/schemas/Grade'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
          description: 선택한 등급(label)의 확률(0~1)
        confidence_tier:
          type: string
          enum:
          - 낮음
          - 보통
          - 높음
          readOnly: true
          description: '[2026-10-02] confidence 를 검수 우선순위 3단계로 나눈 계산 필드(항상 confidence 에서 그대로 파생, 서버가 직접 설정하지 않는다).
            자동확정 여부를 가르는 게이트가 아니다 — KL포털이 문서마다 매번 사람 검수를 하므로 이 값은 어느 문서를 먼저 볼지 고르는 참고 일 뿐이다. 경계(1/3·2/3)는 아직 사람
            검수 결과로 실측하지 않은 균등분할이라 바뀔 수 있다.'
        scores:
          type: object
          description: 등급별 확률 분포
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        evaluation_factors:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/EvaluationFactors'
        factors_source:
          type: string
          enum:
          - rule_evidenced
          - model_estimated
          default: rule_evidenced
          description: '[2026-10-02 정정] evaluation_factors 출처 요약 — rule_evidenced(S/V/M 세 축 모두 실제 근거가 관측됨) / model_estimated(한
            축 이상 근거 없음, 해당 축은 evaluation_factors.<축>.state 가 "unknown"). "역산 추정치"가 아니다 — 2026-10-02 부터 등급에서 거꾸로
            채우는 역산 자체를 없앴다(근거가 없으면 축이 바로 "unknown"으로 온다). 세세한 판단은 evaluation_factors 의 각 축 state 를 직접 볼 것, 이 필드는
            요약용 파생값이다.'
        rule_evaluation_factors:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/EvaluationFactors'
          description: '[2026-10-02 폐기 예정] 역산이 있었을 때 역산 전 원래 관측값을 보존하던 필드 — 역산 자체가 없어져 항상 null 이다(그때는 evaluation_factors
            가 곧 룰 관측값). 하위 호환을 위해 필드만 남겼다.'
        evidence:
          type: array
          description: 근거 키워드·문맥 span
          items:
            $ref: '#/components/schemas/EvidenceSpan'
        model_version:
          type: string
          description: 판정에 쓴 모델 버전
        status:
          type: string
          enum:
          - staging
          - needs_review
          - needs_second_review
          default: staging
          description: staging=자동확정 후보 · needs_review/needs_second_review=검수 라우팅. 이 필드는 검수가 필요한지만 나타내며 'confirmed'
            값은 나오지 않는다(사람이 확정한 등급은 confirmed_label).
        warnings:
          type: array
          items:
            type: string
          description: 판정 사유·주의를 담은 문장 목록(영문). 형식이 바뀔 수 있으므로 화면 표시와 로그에만 쓴다.
        rule_grade:
          type: string
          nullable: true
          description: 룰 엔진(시드 키워드 S×V×M) 단독 판정.
        model_grade:
          type: string
          nullable: true
          description: 학습 분류기(BERT) 단독 판정(override/cap/floor 이전). 모델 미로드 시 null.
        decision_path:
          type: string
          nullable: true
          description: 최종 label 도출 경로(agreement/rule-override/source-cap/rule-only 등) — 룰·모델 이중판정 투명성.
        grade_candidates:
          type: array
          items:
            type: string
          description: 비밀관리성(M)을 받지 못해 아직 하나로 정해지지 않은 등급 후보. 비어 있으면 label 이 유일한 답이다. label 을 대체하지 않는다.
        grade_candidates_reason:
          type: string
          nullable: true
          description: 후보가 남은 사유(사람이 읽는 문장)
        regulation_reference:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/RegulationEvidenceItem'
          description: '[2026-09-29] RAG+LLM 규정참고 — 이 문서에 해당하는 사내 규정 원문이 있을 때만 채운다(등급 판정과 무관, 참고용). 기능이 꺼져 있거나 해당
            규정이 없으면 null. GPU 가 없는 배포에서는 로컬 LLM 옵션이 제한 시간 안에 끝나지 못해 항상 null 이 된다(GPU 도입은 별도 과제).'
        regulation_summary:
          type: string
          nullable: true
          description: '[2026-10-02] regulation_reference 를 사람 말로 요약한 한두 문장("당연히 설명이 나가야지" 요건). regulation_reference
            가 없거나 로컬 LLM 요약 옵션이 꺼져 있으면(기본) null. ⛔ 로컬 LLM 이 새로 쓴 글이다 — regulation_reference(원문)와 항상 같이 보일 것, 이 문장만
            단독으로 등급·법리 근거로 쓰지 않는다. GPU 가 없는 배포에서는 항상 null.'
    ClassifyJobResult:
      description: |-
        GET /classify/jobs/{job_id} 의 results[] 한 건(IF-05, KL 이 호출) 및 콜백(IF-04) 본문 — ClassifyOutcome 그대로이며 처리 시간·automation_assessment 는 없다(둘 다 내부 전용 ClassifyResponse 에만 있다. 2026-09-27 automation_assessment 제거 — 그 전에는 그림자 관측치가 KL 에도 실려 나갔다).
        [2026-09-29] KL(지재원 포털)이 실제로 받는 값은 또 좁혀진다: label(최종 판정=분류기가 메인)이 항상 있고, rule_grade 는 label 과 **다를 때만** 채워진다(같으면 null — "등급이 같으면 하나만" 요청).
        [2026-10-02 뒤집힘] evaluation_factors·rule_evaluation_factors·evidence·decision_path 는 더 이상 비우지 않는다 — KL포털이 문서마다 매번 사람 검수를 하기로 하면서 "신뢰도는 근거와 같이 보여준다"로 결정이 바뀌었다(9/29 엔 반대로 "KL 요청 범위 밖"이라 비웠었다). model_grade· grade_candidates·grade_candidates_reason·scores 는 **여전히** KL 응답에서 항상 비어 있다 (scores={}·나머지 null 또는 빈 배열) — 이 넷은 이번 결정에서 다시 논의되지 않았다. 같은 필드를 우리 콘솔·관리자 역할로 조회하면(같은 엔드포인트를 내부 화면도 재사용) 채워진 그대로 나온다. 구분은 서버가 호출자 인증 역할(kl_backend 인지)로 판단하며 요청 쪽에서 고를 수 없다.
      allOf:
      - $ref: '#/components/schemas/ClassifyOutcome'
    StoredClassificationResponse:
      type: object
      description: GET /classify/{doc_id} — 저장된 최근 분류 결과와 사람이 확정한 등급.
      required:
      - inference_id
      - doc_id
      - label
      - confidence
      - confidence_tier
      - scores
      - model_version
      properties:
        inference_id:
          type: string
          format: uuid
          description: 분류 결과 식별자
        doc_id:
          type: string
          description: 분류한 문서의 doc_id
        label:
          $ref: '#/components/schemas/Grade'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.87
          description: 선택한 등급(label)의 확률(0~1)
        confidence_tier:
          type: string
          enum:
          - 낮음
          - 보통
          - 높음
          readOnly: true
          description: '[2026-10-02] confidence 를 검수 우선순위 3단계로 나눈 계산 필드 — ClassifyOutcome 과 같다.'
        scores:
          type: object
          description: 등급별 확률 분포
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        model_version:
          type: string
          description: 판정에 쓴 모델 버전
        status:
          type: string
          enum:
          - staging
          - needs_review
          - needs_second_review
          default: staging
          description: staging=자동확정 후보 · needs_review/needs_second_review=검수 라우팅. 검수가 필요한지만 나타내며 'confirmed' 값은
            나오지 않는다(사람 확정은 confirmed_* 로 따로 온다).
        confirmed_label:
          type: string
          nullable: true
          description: 사람이 검수로 확정한 등급. 예측(label)과 별개이며 확정 전에는 null.
        confirmed_by:
          type: string
          nullable: true
          description: 확정한 검수자 식별자
        confirmed_at:
          type: string
          nullable: true
          description: 확정 시각(ISO 8601 UTC)
    ClassifyAsyncResponse:
      type: object
      required:
      - job_id
      - status_url
      properties:
        job_id:
          type: string
          format: uuid
          description: 작업 식별자. IF-05 조회에 쓴다.
        status:
          type: string
          description: 접수 직후 값. 큐 처리 경로는 queued, 즉시 처리 경로는 이미 done 또는 failed 일 수 있다.
        status_url:
          type: string
          description: 상태 조회 경로(호스트 없는 상대 경로). 예 /api/v1/classify/jobs/{job_id}
    JobStatus:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
          format: uuid
          description: 작업 식별자
        status:
          type: string
          enum:
          - queued
          - running
          - done
          - failed
          - partial
          - cancelled
          description: |
            현행 코드가 내는 값은 queued · done · failed · partial 이다.
            partial — 일부 건은 성공·일부는 영구 실패(다건 작업). completed/failed 로 분포를 확인한다.
        client_request_id:
          type: string
          nullable: true
          description: POST /classify/async(또는 POST /documents) 요청 때 보낸 값을 그대로 돌려준다. 안 보냈으면 null.
        total:
          type: integer
          nullable: true
          description: 요청 건수(단건은 1)
        completed:
          type: integer
          nullable: true
          description: 성공 건 수
        failed:
          type: integer
          nullable: true
          description: retry 모두 실패한 건 수
        failed_doc_ids:
          type: array
          items:
            type: string
          description: 영구 실패한 doc_id 목록
        errors:
          type: array
          description: 영구 실패 사유(doc_id · error_type · message · attempts)
          items:
            type: object
            properties:
              doc_id:
                type: string
              error_type:
                type: string
              message:
                type: string
              attempts:
                type: integer
        results:
          type: array
          nullable: true
          description: 분류 결과. done 이면 채워지고 단건 요청은 길이 1 이다.
          items:
            $ref: '#/components/schemas/ClassifyJobResult'
        error:
          type: string
          nullable: true
          description: failed 일 때 사유
    HttpError:
      type: object
      required:
      - detail
      description: 500·429 를 뺀 오류 응답 본문(FastAPI 기본 형태). 상태 코드로 구분한다.
      properties:
        detail:
          description: 오류 사유. 422 는 [{type, loc, msg, input}] 항목 배열이다.
          oneOf:
          - type: string
          - type: array
            items:
              type: object
              additionalProperties: true
        code:
          type: string
          description: 413(요청 본문 한도)에서만 KOIPA_BODY_TOO_LARGE 가 온다.
    Error:
      type: object
      required:
      - code
      - message
      description: 미처리 서버 오류(500) 본문. 그 밖의 오류 본문은 HttpError.
      properties:
        code:
          type: string
          description: |
            기계 식별용 오류 코드. 현행 코드가 내는 값은 KOIPA_INTERNAL(500)·KOIPA_RATE_LIMIT(429)·
            KOIPA_BODY_TOO_LARGE(413) 셋뿐이다. 다른 오류는 코드 없이 HTTP 상태 코드로 구분한다.
        message:
          type: string
        request_id:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
        retryable:
          type: boolean
          description: true 면 같은 요청을 다시 보내 성공할 수 있다(미처리 500 은 true).
    RegulationEvidenceItem:
      type: object
      required:
      - regulation
      - clause
      - sentences
      - is_grade_list
      properties:
        regulation:
          type: object
          required:
          - reg_id
          - name
          - version_label
          properties:
            reg_id:
              type: string
              format: uuid
            name:
              type: string
            version_label:
              type: string
        clause:
          type: object
          required:
          - clause_id
          - article_no
          - title
          properties:
            clause_id:
              type: string
              format: uuid
            article_no:
              type: string
            title:
              type: string
        sentences:
          type: array
          items:
            type: string
          description: 규정 원문 문장 그대로. 등급별 목록이면 목록 전체(순서대로)
        is_grade_list:
          type: boolean
  responses:
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
    InternalError:
      description: 서버 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 호출 한도 초과 (rate-limit). 헤더 Retry-After에 재시도 가능 시간(초) 포함.
      headers:
        Retry-After:
          schema:
            type: integer
          description: 재시도까지 대기 권장 시간(초)
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                example: KOIPA_RATE_LIMIT
              message:
                type: string
                example: 'rate limit exceeded: 60 per 1 minute'
              retry_after_sec:
                type: integer
                example: 60
    PayloadTooLarge:
      description: 업로드 파일 크기 한도(기본 20MB) 또는 JSON 요청 본문 한도(기본 25MB) 초과.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HttpError'
