# 콘솔 외부 노출용 HTTPS 역프록시 (운영 템플릿).
#
# 왜 이 파일이 필요한가 — 2026-08-19 KL 서버(223) 실측:
#   :80 닫힘 · :443 닫힘 · :8000 열림      → 콘솔이 평문 HTTP 로만 열려 있다
#   응답 헤더 = date/server/content-*/x-request-id  → 보안 헤더 0개, `server: uvicorn` 노출
#   /docs · /redoc · /api/v1/openapi.json · /healthz · /healthz/deep  전부 무인증 200
#   docker ps → 0.0.0.0:8000->8000/tcp     → 앱이 직접 외부에 붙어 있다
#
# 저장소의 compose 는 이미 `127.0.0.1:8000` 으로 묶는다(prod:66-67 · dual:18-19).
# 외부 노출은 **서버에만 있던** docker-compose.expose.yml 이 덮어쓴 결과다.
# 그 파일 대신 docker-compose.console-proxy.yml 을 쓰면 앱은 루프백에만 남고
# 이 nginx 만 외부에 선다.
#
# 기존 infra/mtls/nginx.mtls.conf 와의 차이:
#   mtls    연동 클라이언트(기계 대 기계)용. 클라이언트 인증서를 강제한다.
#   console 사람이 브라우저로 여는 검수 화면용. 클라이언트 인증서를 요구할 수 없다.
#   → 두 파일은 대체재가 아니라 용도가 다르다. 같은 nginx 에 server 블록 둘로 공존 가능.
#
# 배치:
#   /etc/nginx/certs/server.crt · server.key   (사내 PKI 또는 공인 인증서)
#   이 파일 → /etc/nginx/conf.d/console.conf
#
# ⚠ 업스트림은 compose 서비스명 `api` 다 — docker-compose.console-proxy.yml 로 nginx 를
#   같은 네트워크의 컨테이너로 띄우는 것을 전제한다. mtls 설정이 과거 **이미지명**을 써서
#   'host not found in upstream' 으로 crash-loop 했던 것과 같은 함정이다(그 파일 주석 참조).
#   nginx 를 호스트에 직접 설치해 쓸 경우에는 `api:8000` → `127.0.0.1:8000` 으로 바꿀 것.
#   (그때는 compose 가 api 를 127.0.0.1 에 묶고 있어야 nginx 가 닿는다 — 지금 기본값이 그렇다.)
#
# 검증:
#   curl -sI https://<host>/api/v1/golden/candidates/login.html   → 보안 헤더 6종 확인
#   curl -so /dev/null -w '%{http_code}\n' https://<host>/docs     → 403 (내부망 밖)

# 평문 접근은 전부 TLS 로 보낸다. 검수 화면은 후보 원문(TS·S1 포함)과 토큰을 실어 나른다.
server {
    listen 80;
    server_name _;
    server_tokens off;          # 이 블록에도 필요 — server 단위 지시어라 아래 443 것이 안 미친다
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;   # 브라우저 호환을 위해 1.2 허용(mtls 쪽은 1.3-only)
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;

    # 백엔드 스택 감추기 — 실측에서 `server: uvicorn` 이 그대로 나갔다.
    # proxy_hide_header 가 업스트림의 Server 를 지우고, server_tokens 가 nginx 버전을 숨긴다.
    # ⚠ 그래도 `Server: nginx` 는 남는다(검증 실측). 이름까지 지우려면 headers-more 모듈이
    #   필요한데 stock 이미지에 없다. 중요한 것은 백엔드가 uvicorn 이라는 사실을 안 알리는 것이다.
    server_tokens off;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    # ── 보안 헤더 ────────────────────────────────────────────────────────────
    # ⚠ CSP 의 'unsafe-inline' 은 임시가 아니라 **현재 화면 구조상 필수**다.
    #   실측: admin.html 의 인라인 <script> 78,955자 · index.html 13,490자,
    #   검수 화면은 서버가 통째로 렌더한 인라인 스크립트 17KB, 스타일도 전부 <style> 인라인,
    #   로고는 base64 data: URI. 이것을 빼면 콘솔이 통째로 죽는다.
    #   'unsafe-inline' 을 없애려면 인라인 스크립트/스타일을 외부 파일로 옮기거나 nonce 를
    #   붙이는 별도 작업이 선행돼야 한다 — 그 전에 지우지 말 것.
    # 외부 출처는 실제로 하나도 안 쓴다(검수 화면 external script 0개 실측) → default-src 'self'.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options            "DENY" always;          # frame-ancestors 와 이중 방어(구형 브라우저)
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "no-referrer" always;   # ?t= 서명 토큰이 Referer 로 새지 않게
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;

    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Host              $host;

    client_max_body_size 25M;            # guide upload 한도 R3 정합

    # ── 내부망만 여는 구간 ───────────────────────────────────────────────────
    # 스키마·심층 헬스는 공격자에게 지도 역할을 한다. 실측에서 넷 다 무인증 200 이었다.
    # ⚠ 아래 대역은 예시다. 실제 관리망 대역으로 바꿔야 의미가 있다 —
    #   RFC1918 을 통째로 열어 두면 서버와 같은 사설망에 있는 누구나 접근한다.
    location ~ ^/(docs|redoc)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;                # TODO: 관리망 대역으로 교체
        deny all;
        proxy_pass http://api:8000;
    }
    location = /api/v1/openapi.json {
        allow 127.0.0.1;
        allow 10.0.0.0/8;                # TODO: 관리망 대역으로 교체
        deny all;
        proxy_pass http://api:8000;
    }
    location = /api/v1/healthz/deep {
        # 추출기 가용성·설정값이 그대로 나온다(실측: 추출기 12종 상태 노출).
        allow 127.0.0.1;
        allow 10.0.0.0/8;                # TODO: 관리망 대역으로 교체
        deny all;
        proxy_pass http://api:8000;
    }
    # 얕은 헬스는 LB/모니터링용으로 열어 둔다 — 빌드 sha 와 모델 경로만 나온다.
    location = /api/v1/healthz {
        proxy_pass http://api:8000;
        access_log off;
    }

    # ── 민감 화면: 캐시 금지 ────────────────────────────────────────────────
    # 검수·서명 화면은 후보 원문 전량(120건·762KB 실측)을 본문에 싣는다. 로그인 화면은
    # 토큰을 다룬다. 공용 PC 의 디스크 캐시·중간 프록시에 남으면 안 된다.
    location ~ ^/api/v1/golden/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        # location 블록에 add_header 가 있으면 server 블록 것이 **상속되지 않는다**(nginx 규칙).
        # 그래서 위 보안 헤더를 여기서 다시 선언한다 — 빠뜨리면 정작 가장 민감한 화면만
        # 헤더가 없는 상태가 된다.
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    access_log /var/log/nginx/koipa-console.log combined buffer=32k;
}
