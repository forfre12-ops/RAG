# P2-C7: KL ↔ Lloydk 양방향 mTLS 종료 nginx 설정 (운영 템플릿).
#
# 발급 절차:
#   1. CA 생성 → ca.crt / ca.key (사내 PKI 또는 cert-manager)
#   2. 서버 인증서 + 클라이언트 인증서 발급 (CA 서명)
#   3. /etc/nginx/mtls/ 에 다음 파일 배치:
#        - server.crt + server.key  (Lloydk 서버용)
#        - ca.crt                   (KL 클라이언트 인증서 검증용)
#   4. /etc/nginx/mtls/.htpasswd_kl  (선택 — 2-factor로 basic auth 추가)
#
# 검증:
#   curl -v https://api.lloydk.example.com \
#        --cacert ca.crt --cert kl-client.crt --key kl-client.key
#
# 폐쇄망: KL 측에 client 인증서 + ca.crt를 사전 배포(USB 매체).

server {
    listen 443 ssl http2;
    server_name api.lloydk.example.com;

    # 서버 인증서
    ssl_certificate     /etc/nginx/mtls/server.crt;
    ssl_certificate_key /etc/nginx/mtls/server.key;

    # 클라이언트 인증서 검증 (mTLS)
    ssl_client_certificate /etc/nginx/mtls/ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # TLS 1.3 only (운영 권장)
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS — 폐쇄망/사설망에서도 유효
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 클라이언트 인증서 정보를 백엔드로 전달 (X-Client-* 헤더)
    proxy_set_header X-Client-DN      $ssl_client_s_dn;
    proxy_set_header X-Client-Serial  $ssl_client_serial;
    proxy_set_header X-Client-Verify  $ssl_client_verify;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header Host             $host;

    # 요청 크기 — guide upload 한도 R3 정합 (20MB)
    client_max_body_size 25M;

    location / {
        # 업스트림은 compose 서비스명 `api`(base·airgap 공통). 과거 `lloydk-api`(이미지명)로
        # 잘못 지정돼 nginx 가 기동 시 'host not found in upstream'으로 crash-loop → mTLS
        # 프로파일이 한 번도 동작하지 못했다. compose DNS 는 서비스명/네트워크 alias로만 해석된다.
        proxy_pass http://api:8000;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 헬스체크는 mTLS 없이 허용(내부망 LB 헬스용) — 선택
    # location = /api/v1/health {
    #     ssl_verify_client off;
    #     proxy_pass http://api:8000/api/v1/health;
    # }

    # 액세스 로그에 클라이언트 DN 기록
    access_log /var/log/nginx/lloydk-mtls.log combined buffer=32k;
}
