global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: lloydk-poc
    env: dev

# Alerting/recording rules는 별도 파일로 분리 가능.
# 운영 전환 시: alerts.yml (FNR 급증 / API 지연 P95 임계 등) 추가.
rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: lloydk-api
    metrics_path: /api/v1/metrics-prom
    static_configs:
      - targets: [api:8000]
        labels:
          service: api

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels:
          service: postgres

  - job_name: elasticsearch
    static_configs:
      - targets: [elasticsearch-exporter:9114]
        labels:
          service: elasticsearch

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
        labels:
          service: redis
