global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: koipa-poc
    env: dev

# Alerting/recording rules는 별도 파일로 분리 가능.
# 운영 전환 시: alerts.yml (FNR 급증 / API 지연 P95 임계 등) 추가.
rule_files:
  - alert_rules.yml

# 발화 알림을 Alertmanager 로 라우팅(그룹·중복제거·통지). Alertmanager 미기동 환경에서는
# Prometheus 가 전송 실패를 로그로만 남기고 계속 동작하므로 dev overlay 에도 무해하다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: koipa-api
    metrics_path: /api/v1/metrics-prom
    static_configs:
      - targets: [api:8000]
        labels:
          service: api

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
        labels:
          service: postgres

  # elasticsearch job 제거 — ES→PG 단일화(§03). pgvector 는 postgres-exporter 로 커버.

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
        labels:
          service: redis
