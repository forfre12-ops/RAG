server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=koipa-poc"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - replacement: koipa-poc
        target_label: cluster
    pipeline_stages:
      - docker: {}
      # 영업비밀 본문 마스킹 — 길이만 보존, 본문은 제거
      - regex:
          expression: '(content|raw_text|secret|password)["\s:]+["][^"]*["]'
      - replace:
          expression: '"<masked:\\g<1>>"'
      # P1-F4: PII 마스킹 — Loki ingest 시점에 추가 차단
      # 주민번호
      - replace:
          expression: '\d{6}-[1-4]\d{6}'
          replace: '[RRN]'
      # 외국인등록번호
      - replace:
          expression: '\d{6}-[5-8]\d{6}'
          replace: '[FRN]'
      # 사업자등록번호
      - replace:
          expression: '\d{3}-\d{2}-\d{5}'
          replace: '[BIZNO]'
      # 신용카드
      - replace:
          expression: '\b(?:\d{4}[- ]?){3}\d{4}\b'
          replace: '[CARD]'
      # 휴대전화
      - replace:
          expression: '01[016789]-?\d{3,4}-?\d{4}'
          replace: '[PHONE]'
      # 이메일
      - replace:
          expression: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          replace: '[EMAIL]'
      # JWT 토큰 (Bearer eyJ...)
      - replace:
          expression: 'Bearer\s+eyJ[A-Za-z0-9_.-]+'
          replace: 'Bearer [JWT]'
      # API key 형식 (sk-..., AKIA...)
      - replace:
          expression: '\b(?:sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})\b'
          replace: '[APIKEY]'
