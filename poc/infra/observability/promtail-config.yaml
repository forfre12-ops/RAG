server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=lloydk-poc"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
      - replacement: lloydk-poc
        target_label: cluster
    pipeline_stages:
      - docker: {}
      # 영업비밀 본문 마스킹 — 길이만 보존, 본문은 제거
      - regex:
          expression: '(content|raw_text|secret|password)["\s:]+["][^"]*["]'
      - replace:
          expression: '"<masked:\\g<1>>"'
