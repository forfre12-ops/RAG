name: lloydk-proxy-gold

services:
  ollama:
    image: ollama/ollama@sha256:98c19ced6600f2924e80b92d701cd867d8f7ef0c4dde516c619484e31e47f103
    container_name: lloydk-proxy-ollama
    restart: "no"
    init: true
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NO_CLOUD: "true"
    expose:
      - "11434"
    volumes:
      - type: bind
        source: ${PROXY_OLLAMA_DATA:?set PROXY_OLLAMA_DATA to an absolute host path}
        target: /root/.ollama
    networks:
      - proxy_llm_internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

networks:
  proxy_llm_internal:
    name: lloydk-proxy-gold-internal
    internal: true
    driver: bridge
