# docker-compose.airgap.mariadb.yml — 폐쇄망 배포의 DB 를 MariaDB 로 바꾸는 오버레이
# ─────────────────────────────────────────────────────────────────────────────
# 왜 오버레이인가. 배포 정본은 docker-compose.airgap.yml 이고 그것은 PostgreSQL 이다
# (커밋 5c7ed034 — "dev 기본 DB 를 MariaDB 로 넘긴다, **운영 배포는 그대로 PostgreSQL**").
# 그 파일을 복사해 두 벌로 만들면 한쪽만 고쳐지는 날이 온다. 바뀌는 것만 여기 둔다.
#
# 실행(번들 루트에서 — 파일 순서가 중요하다. 뒤가 앞을 덮는다):
#   docker compose --env-file .env \
#     -f infra-config/docker-compose.airgap.yml \
#     -f infra-config/docker-compose.airgap.mariadb.yml up -d
#
# 마이그레이션은 **계열을 이름으로** 부른다(head 가 둘이라 그냥 head 는 모호하다):
#   docker compose ... exec api alembic upgrade mariadb@head
#
# .env 에 추가로 필요한 것:
#   MARIADB_PASSWORD=...        (필수)
#   MARIADB_ROOT_PASSWORD=...   (필수)
#   MARIADB_PORT=3306           (선택 — 호스트 루프백 바인드 포트)
#   MARIADB_IMAGE=...           (선택 — 폐쇄망에서 docker load 한 태그로 바꿀 때)
# POSTGRES_PASSWORD 는 더 이상 쓰이지 않지만, 정본 compose 가 `:?set in .env` 로 요구하므로
# 아무 값이나 남겨 둔다(빈 값이면 렌더링 자체가 실패한다).

name: koipa-airgap

services:
  # PostgreSQL 을 띄우지 않는다.
  #
  # compose 오버레이는 서비스를 **지울 수 없다.** profiles 를 주면 기본 up 대상에서 빠진다
  # — 아무도 켜지 않는 이름을 쓴다. 정본 파일은 손대지 않으므로 기존 PG 배포는 그대로다.
  postgres:
    profiles: ["pg-not-used-on-mariadb-deployments"]

  mariadb:
    # [공급망] digest 고정 — ORM 이 10.11 에서 검증됐다(생성 칼럼 active_key·복합 PK
    # AUTO_INCREMENT 등, 커밋 ef294c56 · 베이스라인 f2a3b4c5d6e7). 올릴 때는
    # `docker pull` 후 `docker images --digests` 값으로 갱신하고 **재검증**할 것.
    # 폐쇄망에서는 docker load 한 태그를 MARIADB_IMAGE 로 지정한다.
    image: ${MARIADB_IMAGE:-mariadb:10.11@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73}
    restart: unless-stopped   # 호스트 재부팅 후 자동 복구(폐쇄망 무인 운영)
    environment:
      MARIADB_DATABASE: koipa
      MARIADB_USER: koipa
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
    volumes:
      # named volume — 정본 compose 가 pgdata 를 그렇게 두는 것과 같은 이유다
      # (Windows 바인드마운트·호스트 경로 의존 제거).
      - mariadata:/var/lib/mysql
    ports:
      # 루프백에만 연다 — 폐쇄망이라도 DB 를 호스트 밖으로 내보내지 않는다(정본과 동일).
      - "127.0.0.1:${MARIADB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      retries: 10

  api:
    environment:
      DATABASE_URL: mariadb+pymysql://koipa:${MARIADB_PASSWORD}@mariadb:3306/koipa
    # depends_on 은 병합된다 — postgres 조건이 남으면 그 서비스가 안 뜨는데 기다리게 된다.
    # !override 로 정본의 값을 **대체**한다(병합이 아니라). prod.yml 이 environment 에
    # 쓰는 것과 같은 태그다. YAML 은 같은 키를 두 번 못 쓰므로 !reset 후 재정의는 안 된다.
    depends_on: !override
      redis: { condition: service_started }
      mariadb: { condition: service_healthy }

  worker:
    environment:
      DATABASE_URL: mariadb+pymysql://koipa:${MARIADB_PASSWORD}@mariadb:3306/koipa
    depends_on: !override
      - redis
      - mariadb

  beat:
    environment:
      DATABASE_URL: mariadb+pymysql://koipa:${MARIADB_PASSWORD}@mariadb:3306/koipa
    depends_on: !override
      - redis
      - mariadb

volumes:
  mariadata:
