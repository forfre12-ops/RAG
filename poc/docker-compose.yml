name: koipa-poc

services:
  postgres:
    # ES 제거(의사결정_대장 §03 ⓑ) — pgvector dense + ts_rank 하이브리드. (stock pgvector 이미지, pg_bigm 불요)
    # [공급망] digest 고정 — 태그는 가변이라 같은 pg16 이 다른 바이트를 가리킬 수 있다.
    # 갱신 시: docker pull <tag> 후 `docker images --digests` 값을 옮겨 적고 doc/14 재평가.
    image: pgvector/pgvector:pg16@sha256:131dcf7ff6a900545df8e7e092c270aa8c6db2f2c818e408cb45ec21316b74e6
    environment:
      POSTGRES_DB: koipa
      POSTGRES_USER: koipa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koipa_dev}
    volumes:
      - ../docker-data/postgres:/var/lib/postgresql/data
      # 2026-05-28: init.sql 자동 부트스트랩 제거 — alembic baseline 단일 경로로 일원화.
      # 빈 DB 부트스트랩: `docker compose up -d postgres && cd poc && alembic upgrade head`
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koipa"]
      interval: 5s
      retries: 10

  # [2026-08-24] minio 서비스를 뺐다. 어디서도 쓰지 않는데 매 배포마다 떠 있었다.
  #   - 실배포 프로파일은 전부 storage_backend=local 이다(config.py:81 onprem-local · 173 full-train).
  #   - 223 실측: api/worker env 에 MINIO_* 없음, 컨테이너 /data 에 버킷 0개(.minio.sys 뿐).
  #   - 제출본도 "MinIO 미사용"으로 적혀 있다(기술구현_백서_v7 §2.1 인프라 표 + 각주).
  # 그런데도 떴던 이유: deploy_kl_223.sh 가 서비스명 없이 `up -d` 를 부르고 여기 정의가 남아
  # 있었다. dev 도 로컬FS 로 통일한다 — dev 만 다른 백엔드를 쓰면 재현되지 않는 차이가 생긴다.
  # S3 호환 스토리지가 필요해지면 어댑터·[minio] extra 가 그대로 있다(코드 변경 0).

  redis:
    # BSD-3-Clause 시점(7.2.x)으로 고정 — Redis 7.4+는 RSALv2/SSPL 듀얼 (doc/14 §6.3).
    # 본 사업은 OSS 적합성 위해 BSD 시점 유지. 운영 갱신 시 doc/14 라이선스 재평가.
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    command: redis-server --appendonly yes
    volumes:
      - ../docker-data/redis:/data
    ports:
      - "6379:6379"

  mlflow:
    # Phase 4 (5070 Ti 풀가동): vanilla 이미지 → psycopg2-binary 동봉 빌드.
    # Dockerfile.mlflow 가 v2.16.2 베이스에 pip install psycopg2-binary 적용.
    #
    # Backend는 SQLite 로 변경 (우리 koipa DB 와 MLflow alembic 충돌 회피).
    # 운영 환경은 별도 mlflow DB 분리 또는 별도 Postgres 인스턴스 권장.
    build:
      context: ./infra/mlflow
      dockerfile: Dockerfile.mlflow
    image: koipa/mlflow:2.16.2-psycopg
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --default-artifact-root /mlflow-data/artifacts
      --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow-data
    # [2026-08-24] 아티팩트 저장을 s3://mlflow/(minio) 에서 같은 볼륨 안 로컬 경로로 옮겼다.
    # minio 를 뺄 수 있게 하는 지점이다 — 이 의존을 안 끊으면 mlflow 가 기동하지 못한다.
    # backend-store 가 이미 같은 볼륨의 SQLite 라 저장 위치가 한곳으로 모이는 셈이다.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koipa:${POSTGRES_PASSWORD:-koipa_dev}@postgres:5432/koipa
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pg}
      # [2026-08-24] dev 도 로컬FS 로 통일 (종전 기본값 minio). 실배포 프로파일이 전부 local 이라
      # dev 만 다른 백엔드면 여기서 통과한 것이 배포에서 다르게 도는 경로가 생긴다.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ../docker-data/modelcache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    # -Q 없이 기동하면 default(celery) 큐만 소비 → task_routes로 classify/index/
    # synthesis/learning 큐에 보낸 작업이 영영 소비되지 않는다. 모든 큐를 구독한다.
    command: celery -A koipa.workers.celery_app worker -l info -Q classify,index,synthesis,learning,celery
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koipa:${POSTGRES_PASSWORD:-koipa_dev}@postgres:5432/koipa
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pg}
      # [2026-08-24] dev 도 로컬FS 로 통일 (종전 기본값 minio) — api 쪽 주석 참조.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./src:/app/src
      - ../docker-data/modelcache:/root/.cache/huggingface

  # Celery beat — beat_schedule(drift 15분·auto-rollback 60분·outbox 60초·active-learning
  # 30분)의 주기 트리거를 발행한다. 이 서비스가 없으면 폐곡선 자동화가 전혀 동작하지 않는다.
  # 단일 인스턴스만 띄울 것(다중 beat = 중복 tick).
  beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A koipa.workers.celery_app beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koipa:${POSTGRES_PASSWORD:-koipa_dev}@postgres:5432/koipa
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis
    volumes:
      - ./src:/app/src

  # D3 (2026-05-29): P2-C7 mTLS 종료 nginx — opt-in profile.
  # 활성: docker compose --profile mtls up -d nginx-mtls
  # 사전 작업: bash infra/mtls/generate_dev_certs.sh (server/ca/client 인증서 발급)
  # 운영: ./infra/mtls/certs를 PKI/cert-manager 산출물로 교체.
  nginx-mtls:
    profiles: ["mtls"]
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      - api
    ports:
      - "443:443"
    volumes:
      - ./infra/mtls/nginx.mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/mtls/certs:/etc/nginx/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      retries: 3

volumes:
  mlflow_data:  # MLflow SQLite (Phase 4 야간 작업)
