name: koipa-poc

services:
  postgres:
    # ES 제거(의사결정_대장 §03 ⓑ) — pgvector dense + ts_rank 하이브리드. (stock pgvector 이미지, pg_bigm 불요)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: koipa
      POSTGRES_USER: koipa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koipa_dev}
    volumes:
      - ../docker-data/postgres:/var/lib/postgresql/data
      # 2026-05-28: init.sql 자동 부트스트랩 제거 — alembic baseline 단일 경로로 일원화.
      # 빈 DB 부트스트랩: `docker compose up -d postgres && cd poc && alembic upgrade head`
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koipa"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-koipa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-koipa_dev_minio}
    volumes:
      - ../docker-data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    # BSD-3-Clause 시점(7.2.x)으로 고정 — Redis 7.4+는 RSALv2/SSPL 듀얼 (doc/14 §6.3).
    # 본 사업은 OSS 적합성 위해 BSD 시점 유지. 운영 갱신 시 doc/14 라이선스 재평가.
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - ../docker-data/redis:/data
    ports:
      - "6379:6379"

  mlflow:
    # Phase 4 (5070 Ti 풀가동): vanilla 이미지 → psycopg2-binary 동봉 빌드.
    # Dockerfile.mlflow 가 v2.16.2 베이스에 pip install psycopg2-binary 적용.
    #
    # Backend는 SQLite 로 변경 (우리 koipa DB 와 MLflow alembic 충돌 회피).
    # 운영 환경은 별도 mlflow DB 분리 또는 별도 Postgres 인스턴스 권장.
    build:
      context: ./infra/mlflow
      dockerfile: Dockerfile.mlflow
    image: koipa/mlflow:2.16.2-psycopg
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow-data
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-koipa}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-koipa_dev_minio}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "5000:5000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koipa:${POSTGRES_PASSWORD:-koipa_dev}@postgres:5432/koipa
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pg}
      # dev 는 minio 서비스를 띄우므로 명시 고정 (config base 기본값은 폐쇄망용 local).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-koipa}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-koipa_dev_minio}
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ../docker-data/modelcache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    # -Q 없이 기동하면 default(celery) 큐만 소비 → task_routes로 classify/index/
    # synthesis/learning 큐에 보낸 작업이 영영 소비되지 않는다. 모든 큐를 구독한다.
    command: celery -A koipa.workers.celery_app worker -l info -Q classify,index,synthesis,learning,celery
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koipa:${POSTGRES_PASSWORD:-koipa_dev}@postgres:5432/koipa
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-pg}
      # dev 는 minio 서비스를 띄우므로 명시 고정 (config base 기본값은 폐쇄망용 local).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./src:/app/src
      - ../docker-data/modelcache:/root/.cache/huggingface

  # Celery beat — beat_schedule(drift 15분·auto-rollback 60분·outbox 60초·active-learning
  # 30분)의 주기 트리거를 발행한다. 이 서비스가 없으면 폐곡선 자동화가 전혀 동작하지 않는다.
  # 단일 인스턴스만 띄울 것(다중 beat = 중복 tick).
  beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A koipa.workers.celery_app beat -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://koipa:${POSTGRES_PASSWORD:-koipa_dev}@postgres:5432/koipa
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis
    volumes:
      - ./src:/app/src

  # D3 (2026-05-29): P2-C7 mTLS 종료 nginx — opt-in profile.
  # 활성: docker compose --profile mtls up -d nginx-mtls
  # 사전 작업: bash infra/mtls/generate_dev_certs.sh (server/ca/client 인증서 발급)
  # 운영: ./infra/mtls/certs를 PKI/cert-manager 산출물로 교체.
  nginx-mtls:
    profiles: ["mtls"]
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "443:443"
    volumes:
      - ./infra/mtls/nginx.mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/mtls/certs:/etc/nginx/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      retries: 3

volumes:
  mlflow_data:  # MLflow SQLite (Phase 4 야간 작업)
