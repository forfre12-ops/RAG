name: lloydk-poc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lloydk
      POSTGRES_USER: lloydk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lloydk_dev}
    volumes:
      - E:/antigravity/rag/docker-data/postgres:/var/lib/postgresql/data
      # 2026-05-28: init.sql 자동 부트스트랩 제거 — alembic baseline 단일 경로로 일원화.
      # 빈 DB 부트스트랩: `docker compose up -d postgres && cd poc && alembic upgrade head`
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lloydk"]
      interval: 5s
      retries: 10

  elasticsearch:
    # Phase 0.2 (5070 Ti 풀가동): vanilla 이미지 → analysis-nori 동봉 빌드.
    # Dockerfile.es 가 8.15.3 베이스에 elasticsearch-plugin install analysis-nori 적용.
    build:
      context: ./infra/es
      dockerfile: Dockerfile.es
    image: lloydk/elasticsearch:8.15.3-nori
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.monitoring.collection.enabled: "false"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      ELASTIC_PASSWORD: ${ES_PASSWORD:-lloydk_dev_es}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./infra/es/userdict_ko.txt:/usr/share/elasticsearch/config/userdict_ko.txt:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 20
      start_period: 60s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lloydk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lloydk_dev_minio}
    volumes:
      - E:/antigravity/rag/docker-data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  redis:
    # BSD-3-Clause 시점(7.2.x)으로 고정 — Redis 7.4+는 RSALv2/SSPL 듀얼 (doc/14 §6.3).
    # 본 사업은 OSS 적합성 위해 BSD 시점 유지. 운영 갱신 시 doc/14 라이선스 재평가.
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - E:/antigravity/rag/docker-data/redis:/data
    ports:
      - "6379:6379"

  mlflow:
    # Phase 4 (5070 Ti 풀가동): vanilla 이미지 → psycopg2-binary 동봉 빌드.
    # Dockerfile.mlflow 가 v2.16.2 베이스에 pip install psycopg2-binary 적용.
    #
    # Backend는 SQLite 로 변경 (우리 lloydk DB 와 MLflow alembic 충돌 회피).
    # 운영 환경은 별도 mlflow DB 분리 또는 별도 Postgres 인스턴스 권장.
    build:
      context: ./infra/mlflow
      dockerfile: Dockerfile.mlflow
    image: lloydk/mlflow:2.16.2-psycopg
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow-data
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-lloydk}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-lloydk_dev_minio}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "5000:5000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lloydk:${POSTGRES_PASSWORD:-lloydk_dev}@postgres:5432/lloydk
      VECTOR_BACKEND: ${VECTOR_BACKEND:-es}
      ES_URL: http://elasticsearch:9200
      ES_USERNAME: ${ES_USERNAME:-}
      ES_PASSWORD: ${ES_PASSWORD:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lloydk}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-lloydk_dev_minio}
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - E:/antigravity/rag/docker-data/modelcache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A lloydk.workers.celery_app worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://lloydk:${POSTGRES_PASSWORD:-lloydk_dev}@postgres:5432/lloydk
      REDIS_URL: redis://redis:6379/0
      VECTOR_BACKEND: ${VECTOR_BACKEND:-es}
      ES_URL: http://elasticsearch:9200
      ES_USERNAME: ${ES_USERNAME:-}
      ES_PASSWORD: ${ES_PASSWORD:-}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./src:/app/src
      - E:/antigravity/rag/docker-data/modelcache:/root/.cache/huggingface

  # D3 (2026-05-29): P2-C7 mTLS 종료 nginx — opt-in profile.
  # 활성: docker compose --profile mtls up -d nginx-mtls
  # 사전 작업: bash infra/mtls/generate_dev_certs.sh (server/ca/client 인증서 발급)
  # 운영: ./infra/mtls/certs를 PKI/cert-manager 산출물로 교체.
  nginx-mtls:
    profiles: ["mtls"]
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "443:443"
    volumes:
      - ./infra/mtls/nginx.mtls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/mtls/certs:/etc/nginx/mtls:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      retries: 3

volumes:
  # esdata만 named volume 유지 — ES는 fsync 빈도가 높아 bind mount(WSL2↔Windows FS) IO 패널티가 큼.
  # 나머지(postgres/minio/redis/modelcache)는 E:/antigravity/rag/docker-data/ bind mount.
  esdata:
  mlflow_data:  # MLflow SQLite (Phase 4 야간 작업)
