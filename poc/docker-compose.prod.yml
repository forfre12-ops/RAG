# docker-compose.prod.yml — 운영(immutable) 오버라이드
# 사용(canonical): docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#   - --env-file 은 ${} 치환용(이게 없으면 프로젝트 .env=dev 값이 치환에 새어듦).
#   - 서비스 env_file 은 ${ENV_FILE:-.env.prod} → --env-file 과 같은 파일을 가리키게 할 것.
#     (lite-cloud 테스트: ENV_FILE=.env.cloud docker compose --env-file .env.cloud -f ... up -d)
#   - override.yml 은 -f 명시라 자동 제외 → GPU/Ollama 강제 회피.
#
# dev 대비 하드닝(상용 릴리스 기준):
#   - env_file: base 의 .env(개발용) 상속을 !override 로 끊고 ${ENV_FILE:-.env.prod} 만 로드
#     (dev .env 의 API_KEY_ROLE=admin·ENABLE_TRAINING=true·실키 주입 차단)
#   - volumes: ./src·./scripts hot-reload bind 제거(불변 이미지). 모델은 external volume(ro)로만
#   - ports: api 만 127.0.0.1:8000(리버스 프록시 뒤). pg/redis/minio/mlflow 는 미노출(내부 네트워크)
#   - 이미지: Dockerfile.api.prod(non-root uid1000·gunicorn), CPU 임베딩, 원격 LLM
#   - HF 캐시: non-root 경로(/home/lloydk)에 named volume — 매 기동 재다운로드 방지
services:
  api:
    # 재기동 정책 — 호스트 재부팅/도커 데몬 재시작 후 자동 복구. deploy.restart_policy 는
    # `docker compose up`(비-swarm)에서 무시되므로 compose 단축형 restart 를 명시해야 실효.
    restart: unless-stopped
    build:
      dockerfile: Dockerfile.api.prod
    # dev .env 상속 차단 — 운영 자격/설정은 ENV_FILE 로만. 초기 클라우드 테스트는 ENV_FILE=.env.cloud.
    env_file: !override
      - "${ENV_FILE:-.env.prod}"
    environment: !override
      # WEB_CONCURRENCY 멀티워커는 프로모션 후 /admin/model/reload 팬아웃 미구현[NFR-OPS-01]이라
      # 워커별 stale 가능 — 초기엔 1 권장(재기동으로 갱신).
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      EMBEDDING_PROVIDER: hf
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-m3}"
      CORS_ALLOW_ORIGINS: '["${ALLOWED_ORIGIN:-https://app.example.com}"]'
      HF_HOME: /home/lloydk/.cache/huggingface
      # [스레드 정합] torch 는 cgroup CPU 한도를 못 본다 — 호스트 코어 수만큼 스레드를 띄운다.
      # 실측: 2 CPU 컨테이너에서 torch.get_num_threads()=8 로 오버서브스크립션 상태였다.
      # 스레드 수를 CPU 한도와 같은 값으로 묶어 둔다(한쪽만 바꾸면 다시 어긋난다).
      OMP_NUM_THREADS: "${API_CPU_LIMIT:-6}"
      MKL_NUM_THREADS: "${API_CPU_LIMIT:-6}"
    # 불변 — dev 코드 bind 제거. 모델은 ro external volume, HF 캐시는 non-root named volume.
    volumes: !override
      - prod_artifacts:/app/artifacts:ro
      - hf_cache_api:/home/lloydk/.cache/huggingface
      # [저장 영속·공유] 원본 문서(암호화 at-rest)는 named 볼륨에. 볼륨이 없으면 컨테이너 임시레이어에
      # 써서 재생성 시 원문 소실 + api↔worker 미공유 → 원문 read-back miss 로 빈문서 분류(무음). 운영 필수.
      - app_storage:/app/.storage
      # [골든] 골든 후보 산출물(datasets/gold_real/builds). datasets 는 .dockerignore 라 이미지에
      # 없다 — 이 볼륨이 없으면 /golden/build 를 실행한 worker 가 자기 컨테이너 FS 에 쓰고,
      # review.html/signoff.html 을 렌더하는 api 는 그 파일을 못 읽어 검수 화면이 영원히 빈다.
      # 재생성 시 산출물도 소실. api↔worker 공유 필수(2026-08-02 실측 결함).
      - golden_data:/app/datasets
    # 리버스 프록시(nginx-mtls 등) 뒤 — 외부 직노출 금지.
    ports: !override
      - "127.0.0.1:8000:8000"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          # [실측 2026-08-02] 종전 기본값 2 는 분류 처리량을 그대로 3배 깎고 있었다.
          # 8코어 호스트에서 API 컨테이너만 2 CPU 로 묶여 1페이지(1,800자) 분류에 12.7초,
          # 5페이지 45.3초가 걸렸다. gunicorn --timeout 60 이라 6~7페이지에서 워커가 죽는다
          # (구형 .hwp 업로드 시 보고된 WORKER TIMEOUT 의 실제 원인). 호스트는 부하 0.28 로
          # 놀고 있었다 — 하드웨어가 아니라 이 기본값이 병목이었다.
          # 6 은 단일 고객사 배포(CPU 전용 런타임) 기준. 한 호스트에 여러 스택을 올리면
          # .env 에서 낮춰 잡을 것 — 합이 코어 수를 넘으면 서로 뺏는다.
          cpus: "${API_CPU_LIMIT:-6}"
          memory: "${API_MEM_LIMIT:-4G}"
        reservations:
          memory: "${API_MEM_RESERVATION:-1G}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  worker:
    restart: unless-stopped
    # 하드닝: dev Dockerfile.api(root)가 아니라 non-root(uid1000) 이미지로 빌드 — api 와 동일.
    # Dockerfile.api.prod 는 앱+운영/파싱 extras(hwp/hwp-tables/xls/jwt/psh/otel) 포함이라 워커
    # 파싱 태스크에도 충분. OCR([ocr])은 요건 외 + poppler=GPL 이라 전 이미지에서 제외.
    # (compose command 오버라이드가 gunicorn CMD 를 celery worker 로 대체.)
    build:
      dockerfile: Dockerfile.api.prod
    env_file: !override
      - "${ENV_FILE:-.env.prod}"
    environment: !override
      # [스레드 정합] api 와 동일 — torch 가 cgroup 한도를 못 봐 오버서브스크립션이 난다.
      OMP_NUM_THREADS: "${WORKER_CPU_LIMIT:-4}"
      MKL_NUM_THREADS: "${WORKER_CPU_LIMIT:-4}"
    # dev 코드 bind 제거. 워커도 모델 접근 필요(classify/index 태스크) → ro external volume.
    # HF 캐시는 non-root 홈(/home/lloydk) — root 캐시(/root)는 uid1000 이 쓸 수 없어 재다운로드 유발.
    volumes: !override
      - prod_artifacts:/app/artifacts:ro
      - hf_cache_worker:/home/lloydk/.cache/huggingface
      - app_storage:/app/.storage                 # api 와 동일 저장 볼륨 공유(원문 read-back)
      - golden_data:/app/datasets                 # [골든] api 와 동일 — 빌드 산출물을 api 가 읽어 검수 HTML 렌더
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          # api 와 같은 이유(위 주석). 워커는 배치 분류·인덱싱이라 역시 CPU 바운드다.
          # api(6)보다 낮게 잡는 것은 대화형 응답을 배치가 밀어내지 않게 하려는 것.
          cpus: "${WORKER_CPU_LIMIT:-4}"
          memory: "${WORKER_MEM_LIMIT:-4G}"
        reservations:
          memory: "${WORKER_MEM_RESERVATION:-1G}"

  beat:
    restart: unless-stopped
    # 하드닝: worker 와 동일 non-root 이미지(uid1000)로 빌드(dev Dockerfile.api=root 상속 차단).
    build:
      dockerfile: Dockerfile.api.prod
    env_file: !override
      - "${ENV_FILE:-.env.prod}"
    environment: !override {}
    # beat 는 스케줄만 발행 — 코드/모델 bind 불요.
    volumes: !override []

  postgres:
    restart: unless-stopped
    # 내부 네트워크만 — 호스트 노출 없음(dev 의 0.0.0.0:5432 상속 차단).
    ports: !override []
    deploy:
      resources:
        limits:
          memory: "${POSTGRES_MEM_LIMIT:-2G}"

  redis:
    restart: unless-stopped
    ports: !override []

  minio:
    ports: !override []
    deploy:
      resources:
        limits:
          memory: "${MINIO_MEM_LIMIT:-2G}"

  mlflow:
    ports: !override []

volumes:
  prod_artifacts:
    external: true
    name: "${PROD_ARTIFACTS_VOLUME:-lloydk_prod_artifacts}"
  # 원본 문서 저장(암호화 at-rest) — 안정적 이름으로 백업/복구 대상. api·worker 공유·재생성 영속.
  app_storage:
    name: "${APP_STORAGE_VOLUME:-lloydk_app_storage}"
  # 골든 후보·정본(datasets/) — api·worker 공유. 사람서명 산출물이 들어가므로 백업 대상.
  golden_data:
    name: "${GOLDEN_DATA_VOLUME:-lloydk_golden_data}"
  hf_cache_api:
  hf_cache_worker:
