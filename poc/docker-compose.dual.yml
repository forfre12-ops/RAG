# docker-compose.dual.yml — 한 호스트에 지재원 + 고객사 두 스택 공존용 오버레이
# ---------------------------------------------------------------------------
# 목적: 테스트서버 1대에 full-train(지재원)·onprem-local(고객사) 두 배포를 동시에 올린다.
# 단독 사용 금지 — base + prod 오버레이 위에 얹어 "스택 격리"만 담당한다:
#   docker compose -p <프로젝트> --env-file <.env> \
#     -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.dual.yml up -d
# 실제 구동은 scripts/deploy_testserver_dual.sh 가 프로젝트명·포트·.env 를 스택별로 주입해 자동 처리.
#
# 격리 원리:
#   - 프로젝트명(-p)이 컨테이너·네트워크·(비-external)볼륨을 스택별로 접두어 격리 → pg/redis 데이터 분리.
#   - 호스트 노출 포트는 api 하나뿐(127.0.0.1:${API_HOST_PORT}) → 스택마다 다른 포트(8000/8001).
#   - base 의 ../docker-data 바인드(pg/redis)를 named 볼륨으로 교체 → 두 스택이 같은 폴더를 밟는 충돌 제거.
#   - minio 의존 제거(storage=local) → 불필요한 minio 미기동.
#   - 분류 모델은 호스트 artifacts 를 ro 바인드, HF 임베더 캐시는 external 볼륨으로 두 스택이 공유(중복 다운로드 회피).
services:
  api:
    # 스택별 호스트 포트. 리버스 프록시/SSH 터널 전제라 127.0.0.1 바인드 유지.
    ports: !override
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    # ── [2026-08-21] 큰 문서를 한 요청에서 끝낼 수 있게 한다 (사용자 지시: 100쪽 가능하게) ──
    # 종전 값으로는 34청크(≈9쪽)에서 413 으로 거절했다. 그 상한은 임의값이 아니라
    # `타임아웃 60초 · 워커 1개` 에서 역산한 것이다(config.py:793~810).
    # 실측 2026-08-21(223, 컨테이너 6 CPU): 14청크 6.2초 → 고정비 제외 약 0.4초/청크.
    #   100쪽 ≈ 238청크 ≈ 100초.  400청크면 약 170초.
    # 그래서 타임아웃을 600초로 두고(4배 여유) 상한을 400청크로 올린다.
    #
    # ⚠ 워커를 늘리는 데는 문서화된 대가가 있다(prod 오버레이 주석·NFR-OPS-01):
    #   모델 승격 후 `/admin/model/reload` 팬아웃이 미구현이라 **워커별로 옛 모델이 남을 수
    #   있다.** 재기동하면 전부 갱신되므로, 승격 뒤에는 반드시 재배포/재기동할 것.
    #   그럼에도 늘리는 이유: 워커가 1개면 100쪽 한 건이 도는 3분 동안 **콘솔 전체가 멈춘다.**
    # ⚠ 메모리 — 워커마다 분류 모델이 한 벌씩 올라간다. 실측 2026-08-21: 워커 1개에
    #   1.08GiB(한도 4GiB). 3워커면 약 3.3GiB 로 한도에 붙으므로 한도도 10G 로 올린다
    #   (호스트 47GB 중 43GB 여유 확인).
    environment:
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-3}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-600}"
      KOIPA_ANALYZE_SYNC_MAX_CHUNKS: "${KOIPA_ANALYZE_SYNC_MAX_CHUNKS:-400}"
    deploy:
      resources:
        limits:
          memory: "${API_MEM_LIMIT:-10G}"
    # minio 미사용(storage=local) → 의존 제거해 minio 미기동.
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: !override
      - ./artifacts:/app/artifacts:ro                       # 분류 모델(v-fe4b386b · v5) ro 공급
      # [학습 산출] artifacts 는 ro(서빙 모델 보호)라 재학습이 쓸 수 없다 — 산출 전용 rw 경로를
      # 분리한다(settings.training_output_dir). worker 가 쓰고 api 가 서빙으로 읽으므로 양쪽 필수.
      - ./artifacts_out:/app/artifacts_out
      - ./datasets:/app/datasets                            # 골든 후보 — 아래 [골든] 주석 참조(api↔worker 공유·rw 필수)
      - koipa_hf_cache:/home/koipa/.cache/huggingface     # KURE 임베더 캐시 — 두 스택 공유(external)
      - storagedata:/app/.storage                           # [#4] 원문 저장(암호화 at-rest) — api↔worker 공유·영속(볼륨無 시 원문소실·미공유→빈문서 분류)
      # [준비도] /healthz 의 readiness 는 reports/operational_readiness.json 을 읽는다.
      # 이 바인드가 없으면 호스트에서 `make operational-readiness` 로 **이미 만들어 둔** 리포트가
      # 있어도 컨테이너에는 /app/reports 자체가 없어 healthz 가 영원히 "missing" 을 답한다.
      # 실측 2026-08-19(223): 호스트 ~/poc/reports/operational_readiness.json 8,789 bytes 존재,
      # 컨테이너 /app/reports = No such file or directory, healthz readiness.status = missing.
      # 읽기 전용 — 리포트는 호스트의 make 타깃이 만들고 컨테이너는 보기만 한다.
      - ./reports:/app/reports:ro
  worker:
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: !override
      - ./artifacts:/app/artifacts:ro
      - ./artifacts_out:/app/artifacts_out    # [학습 산출] api 와 동일 — 위 주석 참조
      # [골든] datasets 는 .dockerignore 에 있어 이미지에 안 들어간다. 이 바인드가 없으면
      # /golden/build 를 실행한 worker 는 자기 컨테이너 FS 에 build_*.jsonl 을 쓰고,
      # review.html/signoff.html 을 렌더하는 api 에는 /app/datasets 자체가 없어 후보를
      # 영원히 못 읽는다(빈 검수 화면). 산출물도 컨테이너 재생성 시 소실된다.
      # celery 미가용 시 api 가 in-proc 으로 빌드하던 경로에서는 드러나지 않던 결함
      # (2026-08-02 테스트서버 실측). 정본 골든 시딩도 이 바인드로 들어온다.
      - ./datasets:/app/datasets
      - koipa_hf_cache:/home/koipa/.cache/huggingface
      - storagedata:/app/.storage                           # [#4] api 와 동일 저장 볼륨 공유(원문 read-back)
  postgres:
    # base 의 ../docker-data/postgres 바인드를 named 볼륨으로 — 프로젝트 접두어로 스택 격리.
    volumes: !override
      - pgdata:/var/lib/postgresql/data
  redis:
    volumes: !override
      - redisdata:/data

volumes:
  pgdata:        # 프로젝트 스코프(비-external) → koipa-jjw_pgdata / koipa-cust_pgdata 로 자동 분리
  redisdata:
  storagedata:   # [#4] 원문 저장 — 프로젝트 스코프(스택별 격리·스택 내 api↔worker 공유·재생성에도 영속)
  koipa_hf_cache:
    # 두 스택 공유 — 스크립트가 `docker volume create koipa_hf_cache` 로 선생성.
    external: true
