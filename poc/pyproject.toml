[project]
name = "lloydk-ai"
version = "0.1.0"
description = "Lloydk AI Engine for KIPRA Trade-Secret System (PoC)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "minio>=7.2",
  "qdrant-client>=1.10",
  "transformers>=4.44",
  "torch>=2.3",
  "accelerate>=0.33",
  "datasets>=2.20",
  "evaluate>=0.4",
  "scikit-learn>=1.5",
  "mlflow>=2.16",
  "langchain>=0.3",
  "langchain-anthropic>=0.2",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "anthropic>=0.39",
  "openai>=1.50",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "unstructured>=0.15",
  "soynlp>=0.0.493",
  "konlpy>=0.6",
  "FlagEmbedding>=1.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
