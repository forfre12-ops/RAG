[project]
name = "koipa-ai"
version = "0.1.0"
description = "Koipa AI Engine for KOIPA Trade-Secret System (PoC)"
requires-python = ">=3.11"
# 기본 dependencies — CI · 핵심 학습/추론 파이프라인 필수
# 무거운/선택적 의존성은 모두 [project.optional-dependencies]로 분리됨
dependencies = [
  # 웹 프레임워크
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",  # /guide/documents multipart 업로드
  "prometheus-client>=0.20",  # W7 관측성 — Prometheus exposition
  "pdfminer.six>=20240706",   # W8 PDF 추출 (BSD-3, AGPL 회피) — PyMuPDF 대체 1순위
  "slowapi>=0.1.9",           # J4 API rate-limit (분당/시간당 한도, 429 + Retry-After)

  # W9 LLM·임베딩 일반화 — 원격/로컬 양쪽 모두 옵션 지원 (납품 일반화)
  "openai>=1.50",                # LocalOpenAIProvider (vLLM·Ollama·LM Studio 공통) + OpenAI 원격
  "sentence-transformers>=3.0",  # KURE-v1·BGE-M3 임베딩 로컬 로드 (HF 기본 폴백)

  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",

  # DB · 큐 · 스토리지
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "celery[redis]>=5.4",
  "redis>=5.0",

  # 스토리지: 폐쇄망 운영 기본은 로컬FS(file://, LocalStorage) — 별도 패키지 불요.
  # S3 호환 객체 스토리지(minio/seaweedfs/AWS S3·NCP 등) 백엔드는 optional extra `[minio]`로
  # 옵트인한다. 어댑터(minio_store.py)·팩토리·docker-compose·config는 이미 완비돼 있어,
  # `pip install -e ".[minio]"` + storage_backend=minio(또는 lite-cloud 프로파일)면 즉시 사용.
  # (ES 백엔드가 `elasticsearch`를 별도 설치하는 것과 동일 패턴 — 미사용 백엔드 패키지를
  # 폐쇄망 base 설치·감사 대상에서 제외해 슬림/공격표면 축소.)

  # 벡터 DB: pgvector(psycopg 경유, 별도 패키지 불요) — ES 제거(의사결정_대장 §03 ⓑ).
  # 레거시 es 백엔드(es_store.py)가 필요하면 `elasticsearch>=8.15,<9.0`를 별도 설치.

  # ML 코어 (학습·추론 필수)
  "transformers>=4.44",
  "torch>=2.3",
  "accelerate>=0.33",
  "datasets>=2.20",
  "evaluate>=0.4",
  "scikit-learn>=1.5",
  "scipy>=1.14",                 # exact joint scenario/family/shape MILP selector
  "mlflow>=2.16",
  "matplotlib>=3.9",  # M6 평가 — confusion-matrix PNG 렌더 (report.py)

  # 표준 문서 추출 (lazy import 기반)
  # PyMuPDF는 AGPL-3.0 — 기본에서 제외, 선택 extra `[pdf-agpl]`로 옵트인.
  # 운영 기본은 pdfminer.six(BSD-3). doc/14 §5.1 참조.
  "python-docx>=1.1",
  "openpyxl>=3.1",            # W8 Excel(.xlsx/.xlsm) 추출 (MIT). 구형 .xls는 xlrd 필요(선택).
  "python-pptx>=0.6",         # W8 PowerPoint(.pptx/.pptm) 추출 (MIT).
  # 구형 .doc(Word 97-2003)은 시스템 antiword CLI 필요(pip 아님). 없으면 .docx 변환 안내.

  # 유틸
  "pyyaml>=6.0",

  # 보안 — API key hash (bcrypt, 운영 필수)
  "bcrypt>=4.0",
]

[project.optional-dependencies]
# HWP/HWPX 추출 (한국 공공문서). extractor.py가 try/except로 graceful 처리.
# 활성: pip install -e ".[hwp]"
hwp = [
  # [하한 중요] 0.8.1 미만에는 Document.to_hwpx_bytes 가 없다. 그 메서드가 .hwp 의
  # 유일한 표-존재 검출기라, 없으면 표 커버리지 판정이 실패하고 표 셀 회수가
  # 통째로 생략된다(공고문 .hwp 실측: 46,473자·표 47개 → 10,439자·표 0개).
  # 배포 이미지는 0.8.1 이므로 개발 환경도 같은 하한으로 맞춘다 — 하한이 낮으면
  # 새 venv 가 조용히 구버전을 받아 로컬 실측이 배포본과 어긋난다(2026-08-02 실제 발생).
  "rhwp-python>=0.8.1",           # 모든 플랫폼 wheel
]

# 구형 .xls(Excel 97-2003 BIFF) 추출. .xlsx/.xlsm은 base openpyxl로 충분하나
# 바이너리 .xls는 openpyxl 미지원이라 xlrd 필요. extractor.py가 graceful 처리.
# 활성: pip install -e ".[xls]"
xls = [
  "xlrd>=2.0",                     # BIFF .xls 리더 (BSD). 2.0+는 .xls 전용(.xlsx 미지원)
]

# HWP 표 셀 회수. 기본 rhwp([hwp])는 .hwp 바이너리에서 본문만 뽑고 표 셀을 통째로
# 흘린다(실측: 공고문 표 0행 → unhwp 593행, 숫자 7/7 보존 + 21개 추가 회수).
# 2026-08-01 구 pyhwp(AGPLv3+) → unhwp(MIT) 교체. AGPL 옵트인 경로 자체를 없앴다.
#   - 라이선스 검증: unhwp 네이티브는 Rust, 동봉 크레이트 29종 전수가 MIT/Apache-2.0/
#     Unlicense/Zlib. 카피레프트 문자열 0건, pyhwp/hwp.js/hwplib 파생 흔적 0건
#     (바이너리 문자열 + crates.io 전수 조회).
#   - 적용 범위는 .hwp 한정. .hwpx 는 rhwp 가 이미 정확하고 unhwp 가 오히려 표를
#     누락한 사례가 있다(acc-S1-03.hwpx: 표 5행→0행) → extractor 가 형식으로 차단.
#   - 배포 이미지에 포함된다(Dockerfile extras). 미설치여도 graceful degrade.
# 활성: pip install -e ".[hwp-tables]"
hwp-tables = [
  "unhwp>=0.8",                    # HWP5 파서 (MIT). to_markdown()으로 표 셀 회수
]

# OCR — 요건 외(FUN-022 는 전자문서 텍스트추출뿐)이며 어떤 배포 이미지·에어갭 번들에도
# 포함하지 않는다(2026-08-02). 아래 파이썬 패키지는 MIT/HPND 로 라이선스 문제가 없으나,
# 실동작에 필요한 OS 바이너리 poppler 가 GPL 이라 반출 경로를 통째로 없앴다.
# extra 정의만 남겨 둔 것은 향후 OCR 이 요건화될 때 재활성하기 위함이다(로컬 개발 한정).
# 시스템 선설치 필요: winget install UB-Mannheim.TesseractOCR 후 kor.traineddata 복사.
# 활성(로컬 전용): pip install -e ".[ocr]"
ocr = [
  "pytesseract>=0.3.10",           # Tesseract Python 래퍼 (MIT)
  "Pillow>=10.0",                   # 이미지 처리 (PIL 대체, HPND)
  "pdf2image>=1.16",               # 스캔 PDF → 이미지 변환 (MIT), poppler 별도 필요
]

# PyMuPDF AGPL 옵트인 — Artifex 상용 라이선스 또는 명시적 AGPL 수용 환경에서만.
# 운영 기본은 pdfminer.six(BSD-3). doc/14 §5.1 라이선스 결정 참조.
# 활성: pip install -e ".[pdf-agpl]"
pdf-agpl = [
  "pymupdf>=1.24",
]

# PDF 표 행/열 구조화. 미설치 시 extractor.py는 텍스트 추출은 계속하고
# pdf_table_extractor_unavailable 경고를 남긴다.
# 활성: pip install -e ".[pdf-tables]"
pdf-tables = [
  "pdfplumber>=0.11",
]

# 한국어 형태소 분석·정규화 (Mecab 의존, Java JDK 필요할 수 있음)
# 활성: pip install -e ".[nlp]"
nlp = [
  "soynlp>=0.0.493",
  "konlpy>=0.6",
]

# 임베딩 가속 (BGE 계열 최적화) — 없으면 sentence-transformers fallback
# 활성: pip install -e ".[embedding]"
embedding = [
  "FlagEmbedding>=1.2",
  "sentence-transformers>=3.0",    # FlagEmbedding 실패 시 폴백 (hf_embedding.py)
]

# Reranker (A1) — cross-encoder 재정렬. FlagEmbedding 또는 sentence_transformers.
# 활성: pip install -e ".[reranker]"
reranker = [
  "FlagEmbedding>=1.2",
  "sentence-transformers>=3.0",
]

# S3 호환 객체 스토리지 백엔드 (minio/seaweedfs/AWS S3·NCP Object Storage 등).
# 폐쇄망 운영 기본은 로컬FS(file://)라 미사용 — 클라우드 티어(CSAP)·객체 스토리지 배포에서만
# 옵트인. 어댑터(minio_store.py)·팩토리·docker-compose 완비 → storage_backend=minio + 이 extra
# 설치면 즉시 사용(코드 변경 0). 미설치 상태로 minio backend 선택 시 RuntimeWarning 후 LocalStorage
# 폴백. 활성: pip install -e ".[minio]"
minio = [
  "minio>=7.2",
]

# 상용 LLM API (P3 합성 실측, 운영 옵션)
# 활성: pip install -e ".[llm]"
llm = [
  "anthropic>=0.39",
  "openai>=1.50",
]

# 능동학습 체인·오케스트레이션 (향후 RAG·LangGraph 구현 시)
# 활성: pip install -e ".[orchestration]"
orchestration = [
  "langchain>=0.3",
  "langchain-anthropic>=0.2",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
]

# OpenAPI yaml 검증 + 라이선스/SBOM 산출 (CI lint·검수 산출물)
# 활성: pip install -e ".[lint]"
lint = [
  "openapi-spec-validator>=0.7",
  "pip-licenses>=5.0",             # 의존성 라이선스 표 (doc/14)
  "cyclonedx-bom>=4.5",            # SBOM CycloneDX (doc/14 §7)
]

# 모든 옵션 한 번에 설치 (운영 환경용)
# 활성: pip install -e ".[full]"
full = [
  "rhwp-python>=0.8.1",
  "xlrd>=2.0",
  "pdfplumber>=0.11",
  "soynlp>=0.0.493",
  "konlpy>=0.6",
  "FlagEmbedding>=1.2",
  "sentence-transformers>=3.0",
  "anthropic>=0.39",
  "openai>=1.50",
  "langchain>=0.3",
  "langchain-anthropic>=0.2",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "minio>=7.2",                    # S3 호환 객체 스토리지 백엔드(옵션 [minio])
]

# PSH (Performance Scenario Harness) 보조 — Prometheus push, 그래프 렌더
# 활성: pip install -e ".[psh]"
psh = [
  "prometheus-client>=0.20",        # 이미 base에 있지만 명시적 그룹화
]

# P1-F5: OpenTelemetry 분산 트레이싱
# 활성: pip install -e ".[otel]"
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
  "opentelemetry-instrumentation-redis>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-exporter-otlp>=1.27",
]

# P1-C3: JWT 인증 운영용
# 활성: pip install -e ".[jwt]"
jwt = [
  "cryptography>=43.0",
  "PyJWT>=2.9",
]

# 평가 산출물 (confusion-matrix PNG·통계 그래프)
# 활성: pip install -e ".[evaluation]"
evaluation = [
  "matplotlib>=3.9",                # 이미 base에 있지만 명시적 그룹화
  "seaborn>=0.13",                  # 분포 시각화 (선택)
]

# 서빙 노브(온도·게이트 임계) 자동 탐색 — 지재원 오프라인 CLI 전용.
# 활성: pip install -e ".[tuning]" · 실행: scripts/optuna_tune_gates.py
# base 에 넣지 않는 이유: 운영 서빙 경로는 optuna 를 import 하지 않는다(튜너가 lazy import).
#   폐쇄망 런타임 이미지에 불필요한 의존을 넣지 않고 공격표면·감사대상을 줄인다.
# 그럼에도 extra 로 선언하는 이유: 설계도 §06·서빙 파라미터 명세가 이 튜너를 산출물로
#   기술하는데 pyproject 어디에도 없으면 문서만 있고 설치 경로가 없는 유령 의존이 된다
#   (폐쇄망은 wheel vendoring 필요). 2026-08-02 문서↔코드 대조에서 확인.
tuning = [
  "optuna>=3.6",                    # Apache-2.0
]

# 개발 (테스트·린트·노트북)
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",                # 커버리지 측정 (C7 — coverage 80% 목표)
  "ruff>=0.6",
  "ipykernel>=6.29",
  "fakeredis>=2.20",                # B3 — redis 미가용 환경에서 R1·outbox 테스트 통과
  "minio>=7.2",                    # base에서 optional [minio]로 분리 — 테스트/CI는 minio 백엔드 검증 위해 유지
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.bandit]
# C8: 보안 SAST — 운영 진입 직전 OWASP ASVS L2 스캔.
# 구 `.bandit`(INI) 에서 이관. INI 는 configparser 가 시스템 기본 인코딩으로 읽어
# 한글 주석이 있으면 비-UTF8 로캘(예: Windows cp949)에서 UnicodeDecodeError 로 죽는다.
# TOML 은 사양상 UTF-8 고정이라 인코딩 무관하게 안전하다.
# CI 호출: bandit -r src/ -ll -c pyproject.toml
exclude_dirs = ["tests", "migrations", "scripts/legacy", "build", "dist", ".venv"]
skips = [
  "B101",  # assert_used — pytest assert 는 정상
  "B404",  # subprocess import — backup·DR 스크립트에서 의도적 사용
  "B603",  # subprocess call without shell — 신뢰 가능 인자에만 사용
  "B607",  # start process with partial path — 컨테이너 고정 PATH 전제
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["E402", "E701", "E702", "E731", "E741", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
  "ignore:Field .model_version. in ClassifyResponse has conflict with protected namespace .model_.:UserWarning",
]
# Phase 0.3 (5070 Ti 풀가동) — 회귀 분리 markers.
# 기본 `pytest` 는 lite-noapi 빠른 회귀(현재 540+ 케이스) 그대로 실행.
# 풀스택/GPU/모델 다운이 필요한 케이스는 명시적으로 marker 부착 → 별도 실행.
markers = [
  "fullstack: requires running docker compose (postgres + es + minio + redis + mlflow). 활성화: pytest -m fullstack",
  "gpu: requires CUDA GPU (sm_120 또는 호환). 활성화: pytest -m gpu",
  "model_download: downloads HuggingFace models (~수GB). 활성화: pytest -m model_download",
  "slow: loads ML model or does heavy inference (>10s expected). make test-lite 에서 제외",
  "phase2: Phase 2 KURE/BGE-M3/dragonkue 3-way embedding 측정",
  "phase3: Phase 3 KF-DeBERTa 학습 + P1 F1/FNR 측정",
  "phase4: Phase 4 P5 E2E 풀스택 측정",
  "phase5: Phase 5 Qwen3/Solar P3 합성 비교",
]
