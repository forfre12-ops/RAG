# ------------------------------------------------------------
# 오염 데이터셋 격리 (2026-06-01)
# ------------------------------------------------------------

deprecated:
  labeled_5k:
    reason: |
      본문에 bracket 형태 등급 키워드 직접 삽입 (예: "[특급기밀] 관련 사항").
      룰 라벨러가 생성한 키워드로 동일 룰 라벨러 검증 → 순환 오염.
      train/val/test 모두 같은 generator 패턴 → 평가 독립성 없음.
    moved_to: poc/datasets/legacy_synthetic/labeled_5k/
    status: deprecated — 학습·평가 입력 금지

  labeled_5k_plus_qwen3:
    reason: labeled_5k 동일 문제 상속 (첫 3500건 동일, 200건 Qwen3 추가분만 clean)
    moved_to: poc/datasets/legacy_synthetic/labeled_5k_plus_qwen3/
    status: deprecated — 학습·평가 입력 금지

  rag_corpus_qa:
    reason: |
      학습 문서와 동일 generator로 생성된 QA 쌍.
      RAG 평가에 사용 시 학습 분포 내 자기 참조 → 평가 독립성 없음.
    moved_to: poc/datasets/legacy_synthetic/rag_corpus_qa/
    status: deprecated — RAG 평가 입력 금지

