version: "1.0"
generated_at: "2026-05-30"
purpose: |
  KOIPA AI 영업비밀관리시스템 학습·평가 데이터셋 정본 매니페스트.
  P1(분류) · P2(임베딩) · P3(합성) · P4(추출) PoC 5종 + Phase 8 고도화 산출물.
  자체결정으로 발주처 실문서 미제공 가정. 합성·공개·골든셋 3중 구성.

owner: lloydk
contact: forfre12@gmail.com

datasets:

  # ------------------------------------------------------------
  # 합성 코퍼스 (P3 · ES 영구 인덱싱 · P2 측정 입력)
  # ------------------------------------------------------------

  synthetic_5k:
    path: poc/datasets/synthetic_5k/
    files: 5000
    size_mb: 4.5
    format: per-doc json (synth_id, target_grade, domain, title, body, ...)
    provider: noop (deterministic mock)
    purpose: |
      P3 dryrun + P2 임베딩 천장 측정용. noop 결정론적 생성이라
      본문 단조성으로 Recall@5 천장 0.7222 정량 입증의 입력.
    grades: { TS: 1250, S1: 1250, S2: 1250, S3: 1250 }
    license: MIT (LloydK 자체 생성)
    indexed_in_es: true
    es_index: docs

  synthetic_qwen3:
    path: poc/datasets/synthetic_qwen3/
    files: 200
    size_mb: 0.3
    format: per-doc json
    provider: local_openai (Qwen3 14B Q4_K_M, Ollama)
    purpose: |
      Phase 5 P3 200건 비교. 라벨 일치도 100% · FNR 0% PASS → Qwen3 1순위 확정 근거.
    grades: { TS: 50, S1: 50, S2: 50, S3: 50 }
    license: Apache 2.0 (Qwen3 출력)
    indexed_in_es: true
    es_index: docs

  synthetic_solar:
    path: poc/datasets/synthetic_solar/
    files: 200
    size_mb: 0.5
    format: per-doc json
    provider: local_openai (Solar 10.7B Q4_0, Ollama)
    purpose: |
      Phase 5 P3 비교. 라벨 일치도 81% · FNR 27% · JSON 76.5% 실패 → 미달 입증.
    grades: { TS: 50, S1: 50, S2: 50, S3: 50 }
    license: CC-BY-NC-4.0 (Solar 출력, 비상업)
    indexed_in_es: false
    note: 비상업 라이선스로 운영 코퍼스 제외, 비교 측정용으로만 유지

  synthetic:
    path: poc/datasets/synthetic/
    files: 120
    size_mb: 0.1
    format: per-doc json
    provider: noop
    purpose: PoC dryrun · CI smoke (40~120건)
    license: MIT
    indexed_in_es: false

  # ------------------------------------------------------------
  # labeled 학습 데이터셋 (KF-DeBERTa P1 입력)
  # ------------------------------------------------------------

  labeled_5k:
    path: poc/datasets/labeled_5k/
    files:
      train.jsonl: 3500
      val.jsonl: 748
      test.jsonl: 752
    total_lines: 5000
    size_mb: 2.7
    split: stratified 70/15/15 by grade
    source: synthetic_5k + 룰 라벨러 검증
    purpose: |
      Phase 3 KF-DeBERTa 1ep 학습 입력. 학습 분포 F1=1.0 / FNR=0.0% PASS.
      학습 외 분포 정합 83.3% (합성 데이터 한계 정량 입증).
    license: MIT (LloydK 자체 생성)

  labeled_5k_plus_qwen3:
    path: poc/datasets/labeled_5k_plus_qwen3/
    files:
      train.jsonl: 3700
      val.jsonl: 748
      test.jsonl: 752
    total_lines: 5200
    size_mb: 2.8
    split: stratified 70/15/15 by grade
    source: synthetic_5k + synthetic_qwen3 + 룰 라벨러 검증
    purpose: |
      Phase 8 KF-DeBERTa 재학습 입력. confidence 0.632 → 0.746 개선 입증.
      미탐 1단계 개선 동시 확인.
    license: MIT + Apache 2.0 (혼합)

  labeled_p1_retrain_v3:
    path: poc/datasets/labeled_p1_retrain_v3/train.jsonl
    files:
      train.jsonl: 6238
      manifest.json: 1
    total_lines: 6238
    format: jsonl (text, label, source, optional doc_id/domain)
    source: labeled_oss_v1/train + rag_corpus_v2(label_match=true) + gold_real repeated x3
    grade_distribution: { TS: 1147, S1: 1192, S2: 1678, S3: 2221 }
    purpose: |
      P1 v3 retraining input prepared on 2026-06-01.
      Full training command is recorded in poc/datasets/labeled_p1_retrain_v3/manifest.json.
    license: mixed internal/generated/public-derived evaluation records

  # ------------------------------------------------------------
  # 골든셋 (S9 적대적 FNR · 분류 회귀 게이트)
  # ------------------------------------------------------------

  adversarial_golden_100:
    path: poc/datasets/adversarial/golden_100.jsonl
    lines: 100
    size_mb: 0.0
    format: jsonl (doc_id, text, expected_grade, attack_type, rationale)
    purpose: |
      S9 적대적 FNR 게이트 100건. P1-B3 (2026-05-29 P1 묶음).
      attack_type: 동음이의어·약어 치환·문맥 분산·rule keyword 누락.
    license: MIT (LloydK 자체 큐레이션)

  # ------------------------------------------------------------
  # P4 추출 코퍼스 (HWP/PDF/DOCX)
  # ------------------------------------------------------------

  p4_corpus:
    path: poc/datasets/p4_corpus/
    files: 30
    size_mb: 0.0
    format: 다양 (HWP / DOCX / PDF / TXT)
    purpose: P4 추출 PoC 입력. 누락 ≤ 5% · 품질 ≥ 0.7 합격선 측정.
    note: |
      현재 30파일은 LloydK 자체 작성 보일러플레이트. 발주처 실문서 도착 시
      datasets/raw/koipa/로 적재 + P4 재측정.
    license: MIT (LloydK 자체 생성)

# ------------------------------------------------------------
# ES 영구 인덱싱 (Phase 8 B1-2)
# ------------------------------------------------------------

es_indices:
  docs:
    total_docs: 5200
    size_mb: 107.4
    embedder: BAAI/bge-m3
    backend: Elasticsearch 8.15
    purpose: /answer 라이브 citations 0→3 실측 + P2 ES 측정 입력
    populated_at: "2026-05-30"
    populated_from: [synthetic_5k, synthetic_qwen3]
  p2_cached_es:
    total_docs: 5000
    size_mb: 101.8
    embedder: BAAI/bge-m3
    purpose: P2 측정 캐시
  secrets-guides-default-cached-v1.0:
    total_docs: 4672
    size_mb: 108
    purpose: 가이드 RAG (다중 임베딩 캐시)
  secrets-guides-default-nlpai-lab-kure-v1-v1.0:
    total_docs: 169
    size_mb: 3.7
    embedder: nlpai-lab/KURE-v1
    purpose: 가이드 RAG (KURE-v1 임베딩)

# ------------------------------------------------------------
# 데이터셋 합격선 (학습·평가 게이팅)
# ------------------------------------------------------------

acceptance:
  # -------------------------------------------------------
  # P1 분류 — F1 지표는 eval_type 별로 구분해서 보고한다
  # -------------------------------------------------------
  p1_classification:
    pass_criteria: { F1_macro: ">= 0.75", FNR_underclass: "<= 5%" }
    current_model: artifacts/classifier_p1_retrain_v3/v-3443785f
    model_spec: KF-DeBERTa-base, max_seq=512, bf16, 5ep, labeled_p1_retrain_v3
    model_history:
      v-1ac43d0f: "OSS only, gold_real F1=0.322"
      v-37d130b7: "mixed v1, gold_real F1=0.545, S1_R=0.20"
      v-44384f0c: "mixed v2, gold_real F1=0.487, S1_R=0.68, FNR=0.000"
      v-3443785f: "p1_retrain_v3 current, OSS test F1=0.794; public/case/nkt direct F1=0.830, TS/S1/S2->S3=0"
    eval_tiers:
      synthetic_masked_eval:
        eval_type: synthetic_masked
        source: gold/classification_gold.jsonl (test_set_v2 기반, 144건)
        measured: { F1: 1.000, FNR: 0.000 }
        note: "합성 파이프라인 내부 일관성 확인용. 운영 성능 근거 불가."
      llm_judge_gold:
        eval_type: llm_judge_pseudo_gold
        source: gold_real/classification_gold.jsonl (777 total; 610 llm_judge/codex eval records)
        filter: llm_judge_primary, llm_judge_consensus, codex_review
        measured_rule_labeler:  { F1: 0.498, FNR: 0.367, n: 610, note: "2026-06-01 high-risk pattern guard" }
        measured_ml_v3_direct:  { F1: 0.487, FNR: 0.441, n: 710, note: "S1_R=0.68, S2_R=0.49" }
        measured_ml_v3_api:     { F1: 0.487, FNR: 0.000, n: 710, note: "FNR-safe 오버라이드, TS/S1/S2 R=1.00" }
        measured_ml_retrain_v3_direct: { F1: 0.547, FNR_TS_S1: 0.000, n: 610, TS_S1_S2_to_S3: 17, note: "S2->S3 remains on pseudo tier" }
        note: "LLM pseudo-gold. 운영 참고용. TS/S1 recall 대폭 개선."
      human_review_gold:
        eval_type: human_review_pseudo
        source: gold_real/classification_gold.jsonl
        filter: human_review, public_definitive, koipa_case_based, nkt_designated
        gold_breakdown:
          human_review: 0건          # 발주처 실문서 (미입수)
          public_definitive: 50      # public definitive S3
          koipa_case_based: 81       # KOIPA/case-based S1/S2
          nkt_designated: 36         # national-core/high-risk TS
          total: 167
        measured_rule_labeler: { F1: 0.561, FNR: 0.368, n: 167, note: "TS recall=0.972; S1/S2 still below target" }
        measured_ml_v3_api:    { F1: 0.561, FNR: 0.000, n: 100, note: "TS/S1/S2 R=1.00, S3 과분류" }
        measured_ml_retrain_v3_direct: { F1: 0.830, FNR_TS_S1: 0.000, n: 167, TS_S1_S2_to_S3: 0, note: "TS/S1/S2 recall all 1.00; S3 recall 0.46" }
        note: |
          법적 근거 있는 pseudo-gold. 발주처 실문서 human_review 입수 시 자동 편입.
          FNR=0.000: 민감 문서 미탐 없음 (보안 시스템 핵심 지표 충족).
      in_distribution:
        eval_type: oss_corpus_val
        source: labeled_oss_v1/val.jsonl (680건)
        measured_ml_v3: { F1: 0.774, FNR: 0.225 }
        note: "in-distribution PASS 기준(0.75) 충족."
      external_holdout:
        eval_type: external
        source: (미구축)
        measured: null

  p2_retrieval:
    pass_criteria: { Recall_at_5: ">= 0.80", latency_p50_ms: "<= 200" }
    eval_tiers:
      grade_hit:
        note: "같은 등급 문서 검색 시 hit — 완화된 지표. 운영 성능 근거 불가."
        measured: { Recall: 0.7222, latency: 110.98, embedder: BGE-M3, mode: dense }
        status: FAIL (합성 천장)
      doc_id_hit:
        note: "expected_doc_id 기준 Recall@5 — 진짜 RAG 지표."
        source: oss_eval_queries.json (2112건, expected_doc_id 포함), corpus=oss_corpus 3754건
        measured_hash_dryrun:    { Recall: 0.487, note: "hash embedder — 하한값" }
        measured_kure_v1_dense:  { Recall: 0.510, latency_p50_ms: 47 }
        measured_kure_v1_hybrid:          { Recall: 0.624, latency_p50_ms: 173, note: "청킹 없음" }
        measured_bge_m3_dense:            { Recall: 0.453, latency_p50_ms: 46, note: "청킹 없음" }
        measured_bge_m3_hybrid:           { Recall: 0.596, latency_p50_ms: 163, note: "청킹 없음" }
        measured_kure_v1_dense_chunk1200: { Recall: 0.647, latency_p50_ms: 47 }
        measured_kure_v1_hybrid_chunk1200: { Recall: 0.808, latency_p50_ms: 167, note: "oss_eval_queries 2112건" }
        measured_kure_v1_hybrid_retrieval_gold80: { Recall: 0.925, MRR: 0.842, nDCG_at_5: 0.862, latency_p50_ms: 174, n: 80, note: "retrieval_gold.jsonl 80건, 2026-06-02 PASS" }
        measured_bge_m3_dense_chunk1200:  { Recall: 0.572, latency_p50_ms: 45 }
        measured_bge_m3_hybrid_chunk1200: { Recall: 0.790, latency_p50_ms: 166 }
        measured_kure_v1_hybrid_bge_reranker: { Recall: 0.621, latency_p50_ms: 1206, note: "reranker 효과 없음" }
        gap_vs_grade_hit: "grade-hit 0.722 vs doc_id 0.808 (chunked hybrid) — 실제 성능이 더 높음"
        best_config: "KURE-v1 + ES hybrid + 1200자 청킹 (oss_corpus 3754문서 → 14755벡터 in latest eval)"
        chunk_strategy: "chunk_size=1200자, overlap=100자 — settings.rag_index_chunk_size/overlap"
        reranker_verdict: "BGE reranker는 효과 없음 — latency 7배 증가, Recall 오히려 소폭 감소"
        status: PASS (KURE-v1 hybrid + 청킹 Recall@5=0.925 on retrieval_gold80)

  p3_synthesis:
    pass_criteria: { label_match_rate: ">= 90%", FNR_underclass: "<= 5%" }
    measured_qwen3: { label_match: 1.0, FNR: 0.0 }
    measured_solar: { label_match: 0.81, FNR: 0.27 }
    measured_noop_v2: { label_match: 0.25, note: "V2 generator — 등급명 미포함, 의도된 낮은 match" }
    status: PASS (Qwen3) / FAIL (Solar) / N/A (noop V2)

# ------------------------------------------------------------
# 정직성 노트
# ------------------------------------------------------------

honesty_notes:
  - |
    발주처 실문서 미제공 가정 자체결정 잠금 상태.
    합성+공개+골든셋 3중으로 운영 일반화 가능하나 외부 일반화 검증은 한계.
  - |
    synthetic_5k는 noop provider라 본문 boilerplate. 합성 천장 0.7222 정량 입증의
    1차 원인. 합격선 도달은 Qwen3 풀 합성 (현재 1,200건 백그라운드 진행 중) 또는
    Anthropic API 키 도착 후 결정.
  - |
    p4_corpus 30건은 자체 생성 보일러플레이트. 실 HWP/PDF 추출 품질은 발주처
    실문서 도착 후 재측정.

