# 데이터 출처·라이선스 기록 (배포감사 지적: raw.jsonl 행 단위 출처·라이선스 필드 부재)
# 이 파일은 raw.jsonl 의 출처를 데이터셋 단위로 고정한다. 행 단위 URL 은 상류 데이터셋이
# 제공하지 않으므로(판례일련번호 기준 조회), 상류 식별자 + 재현 스크립트로 추적성을 갈음한다.

dataset: datasets/trade_secret_cases/raw.jsonl
rows: 358
created_at: 2026-06-03
sha256_recorded_by: doc/releases/<release_id>/INTEGRITY.sha256

upstream:
  kind: huggingface_dataset
  id: joonhok-exo-ai/korean_law_open_data_precedents
  description: 대한민국 법원 공개 판례 오픈데이터(법제처·대법원 공개본)
  split: train

derivation:
  script: scripts/mine_trade_secret_cases.py
  method: |
    상류 판례 전량에서 영업비밀·부정경쟁·산업기술·전직금지·비밀유지·기술유출 신호어와
    기술 신호어(공정·노하우·설계도·소스코드·알고리즘·제조방법·조성·수율·파라미터)로
    필터링해 판시사항·판결요지 중심으로 구조화한 것. 원문 전문(全文) 사본이 아니다.
  reproducible: true   # 동일 상류 + 동일 스크립트로 재생성 가능

license:
  status: 비보호저작물 (저작권 없음)
  basis: |
    저작권법 제7조 제3호 — "법원의 판결·결정·명령 및 심판이나 행정심판절차 그 밖에
    이와 유사한 절차에 의한 의결·결정 등"은 보호받지 못하는 저작물이다.
    따라서 본 데이터의 판례 텍스트에는 저작권 제한이 적용되지 않는다.
  note: |
    상류 HuggingFace 데이터셋의 배포 조건은 별도로 확인 대상이다(데이터 자체는
    비보호저작물이나, 데이터셋 패키징에 부가 조건이 붙을 수 있음). 법무 확인 항목.

personal_data:
  assessment: 판결문 공개본 — 당사자 표기는 상류 공개본의 익명화 정책을 따른다.
  prohibition: 재식별(re-identification) 시도 금지. 등급분류 학습 프록시 용도로만 사용.

usage:
  runtime: 없음
  runtime_evidence: |
    src/ 전체에서 이 경로를 읽는 코드 0건. 유일한 언급은
    src/koipa/modules/m6_evaluation/anchor_corpus.py 주석의 "의도적 제외" 선언
    (등급 필드가 없는 원자료라 앵커 코퍼스에서 뺀다).
  build_time: scripts/mine_trade_secret_cases.py 산출물 — 학습셋 구성 실험용
  deployment: |
    배포 아카이브에서 제외한다(런타임 미참조 + 출처 추적 부담).
    .tarignore / 아카이브 생성 스크립트의 제외 목록에 포함.

related:
  - scripts/depollute_court_proxy_gold.py   # 판례 프록시 오염 제거(과분류 원인 시정)
  - doc/result/open/데이터_거버넌스_계획.html
