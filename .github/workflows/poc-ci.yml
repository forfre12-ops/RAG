name: poc-ci

on:
  push:
    branches: [main]
    paths:
      - 'poc/**'
      - '.github/workflows/poc-ci.yml'
  pull_request:
    paths:
      - 'poc/**'
      - '.github/workflows/poc-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (126 unit + integration tests)
        run: pytest tests/ -v --tb=short

      - name: Run PoC dryrun suite (P4 -> P3 -> P2 -> P1 -> P5)
        run: python scripts/run_all_pocs.py

      - name: Bundle manifest dry-run (doc/12 §4.1)
        run: |
          python scripts/build_offline_bundle.py \
            --version "ci-${{ github.sha }}" \
            --dry-run \
            --output dist/lloydk-airgap-bundle

      - name: Migration sample-5 dry-run (doc/13 §6 S2.5)
        run: |
          mkdir -p migration
          cat > migration/sample.jsonl <<'JSONL'
          {"id":"d1","vector":[1.0,0.0,0.0,0.0],"payload":{"grade":"TS","text":"기밀 1"}}
          {"id":"d2","vector":[0.0,1.0,0.0,0.0],"payload":{"grade":"S1","text":"비밀 2"}}
          JSONL
          python scripts/migrate_qdrant_to_es.py \
            --collection sample \
            --target-index ci-test-index \
            --alias secrets-guides-koipa \
            --skip-extract \
            --dry-run

      - name: Upload PoC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-reports
          path: poc/reports/
          retention-days: 14

      - name: Upload bundle manifest (dry-run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-manifest
          path: |
            poc/dist/lloydk-airgap-bundle/manifest.yaml
            poc/dist/lloydk-airgap-bundle/manifest.json
            poc/dist/lloydk-airgap-bundle/CHECKSUMS.sha256
          retention-days: 14
          if-no-files-found: warn
