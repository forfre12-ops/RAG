name: poc-ci

on:
  push:
    branches: [main]
    paths:
      - 'poc/**'
      - 'doc/03_openapi_lloydk_kl.yaml'
      - '.github/workflows/poc-ci.yml'
  pull_request:
    paths:
      - 'poc/**'
      - 'doc/03_openapi_lloydk_kl.yaml'
      - '.github/workflows/poc-ci.yml'

jobs:
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openapi-spec-validator
        run: pip install "openapi-spec-validator>=0.7"

      - name: Validate OpenAPI spec (doc/03_openapi_lloydk_kl.yaml)
        run: openapi-spec-validator doc/03_openapi_lloydk_kl.yaml

  licenses-check:
    # doc/14 §11.1: 직접 의존성 라이선스 위험 사전 차단
    # PyMuPDF는 allowlist 통과 (발주처 협의 사항), 신규 strong copyleft만 fail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - name: Install base + lint extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      - name: License risk check (direct deps, with allowlist)
        run: python scripts/dump_licenses.py --check --scope=direct

      - name: Generate SBOM artifacts (txt + md + json + CycloneDX)
        run: |
          mkdir -p licenses
          python scripts/dump_licenses.py --format=text -o licenses/LICENSES.txt
          python scripts/dump_licenses.py --format=md -o licenses/LICENSES.md
          python scripts/dump_licenses.py --format=json -o licenses/licenses.json
          python scripts/dump_licenses.py --format=cyclonedx -o licenses/sbom.cyclonedx.json

      - name: Upload SBOM artifacts (CycloneDX + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            poc/licenses/LICENSES.txt
            poc/licenses/LICENSES.md
            poc/licenses/licenses.json
            poc/licenses/sbom.cyclonedx.json
          retention-days: 90  # doc/14 운영 전환 시 발주처 검수 첨부용

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - name: Install dependencies (기본 + dev extras만, 무거운 extras 제외)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (126 unit + integration tests)
        run: pytest tests/ -v --tb=short

      - name: Run PoC dryrun suite (P4 -> P3 -> P2 -> P1 -> P5)
        run: python scripts/run_all_pocs.py

      - name: Bundle manifest dry-run (doc/12 §4.1)
        run: |
          python scripts/build_offline_bundle.py \
            --version "ci-${{ github.sha }}" \
            --dry-run \
            --output dist/lloydk-airgap-bundle

      - name: Upload PoC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-reports
          path: poc/reports/
          retention-days: 14

      - name: Upload bundle manifest (dry-run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-manifest
          path: |
            poc/dist/lloydk-airgap-bundle/manifest.yaml
            poc/dist/lloydk-airgap-bundle/manifest.json
            poc/dist/lloydk-airgap-bundle/CHECKSUMS.sha256
          retention-days: 14
          if-no-files-found: warn
