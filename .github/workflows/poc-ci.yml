name: poc-ci

on:
  push:
    branches: [main]
    paths:
      - 'poc/**'
      - 'doc/03_openapi_lloydk_kl.yaml'
      - '.github/workflows/poc-ci.yml'
  pull_request:
    paths:
      - 'poc/**'
      - 'doc/03_openapi_lloydk_kl.yaml'
      - '.github/workflows/poc-ci.yml'

jobs:
  secrets-scan:
    # I3: gitleaks로 누출 사전 차단. test/licenses-check와 병렬 실행, fail-fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks full history scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 기본 룰셋 사용 (.gitleaks.toml 없으면 내장 default 적용)
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  ruff-lint:
    # 코드 스타일·미사용 import·E402·E741 등 정적 분석. fail-fast로 사전 차단.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Lint src + scripts
        run: ruff check src/ scripts/

  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openapi-spec-validator
        run: pip install "openapi-spec-validator>=0.7"

      - name: Validate OpenAPI spec (doc/03_openapi_lloydk_kl.yaml)
        run: openapi-spec-validator doc/03_openapi_lloydk_kl.yaml

  licenses-check:
    # doc/14 §11.1: 직접 의존성 라이선스 위험 사전 차단
    # PyMuPDF는 allowlist 통과 (발주처 협의 사항), 신규 strong copyleft만 fail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - name: Install base + lint extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      - name: License risk check (direct deps, with allowlist)
        run: python scripts/dump_licenses.py --check --scope=direct

      - name: Generate SBOM artifacts (txt + md + json + CycloneDX)
        run: |
          mkdir -p licenses
          python scripts/dump_licenses.py --format=text -o licenses/LICENSES.txt
          python scripts/dump_licenses.py --format=md -o licenses/LICENSES.md
          python scripts/dump_licenses.py --format=json -o licenses/licenses.json
          python scripts/dump_licenses.py --format=cyclonedx -o licenses/sbom.cyclonedx.json

      - name: Upload SBOM artifacts (CycloneDX + reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            poc/licenses/LICENSES.txt
            poc/licenses/LICENSES.md
            poc/licenses/licenses.json
            poc/licenses/sbom.cyclonedx.json
          retention-days: 90  # doc/14 운영 전환 시 발주처 검수 첨부용

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./poc
    # M3: Postgres 서비스 컨테이너 — _pg_ok() 통합 테스트 자동 활성화 (skipif 해제)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lloydk
          POSTGRES_PASSWORD: lloydk_dev_pg
          POSTGRES_DB: lloydk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lloydk -d lloydk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # pydantic-settings는 case-insensitive로 DATABASE_URL → settings.database_url 매핑
      DATABASE_URL: postgresql+psycopg://lloydk:lloydk_dev_pg@localhost:5432/lloydk
      PGPASSWORD: lloydk_dev_pg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - name: Install dependencies (기본 + dev extras만, 무거운 extras 제외)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bootstrap DB schema (alembic 단일 경로)
        # 2026-05-28: init.sql ↔ alembic 이중 유지 해소. 모든 DDL은 alembic baseline
        # (000000000001_baseline_init.py)이 단독으로 적용. psql 외부 부트스트랩 제거.
        run: alembic upgrade head

      - name: P3 — Alembic migration drift check (model ↔ migration 동기화 검증)
        # 목적: ORM 모델 변경 후 alembic revision 누락을 사전 차단.
        # 동작:
        #   1) `alembic check` 가능하면 그것으로 drift 즉시 판정.
        #   2) 없거나 실패 시 fallback — autogenerate 시도하여 비어있지 않으면 fail.
        # alembic baseline + N4 인덱스까지 upgrade head 된 상태에서 ORM 메타데이터와 비교.
        run: bash scripts/ci_alembic_drift_check.sh

      - name: Run pytest (126 unit + integration tests)
        run: pytest tests/ -v --tb=short

      - name: Run PoC dryrun suite (P4 -> P3 -> P2 -> P1 -> P5)
        run: python scripts/run_all_pocs.py

      - name: PSH — Scenario Performance (dryrun, fail on KPI miss + 회귀 ≥30% 시 fail)
        id: psh
        run: |
          python scripts/run_perf_scenarios.py \
            --mode dryrun \
            --fail-on-miss \
            --no-probe \
            --regression-threshold 30 \
            --fail-on-regression
        # fail-on-regression은 첫 회차(직전 없음)엔 영향 없음. 누적 후부터 작동.
        # F3: 실패 시 step 종료코드 1 그대로 전파 → 이후 if: failure() 트리거

      - name: PSH — PR 코멘트 작성 (KPI 요약 + 회귀 표)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'poc/reports/perf/perf_latest_dryrun.json';
            if (!fs.existsSync(p)) { core.info('PSH 결과 파일 없음 — 코멘트 생략'); return; }
            const r = JSON.parse(fs.readFileSync(p, 'utf-8'));
            const s = r.summary, env = r.env, regs = r.regressions || [];
            const failRows = (r.scenarios || [])
              .flatMap(sc => sc.kpis || [])
              .filter(k => k.status === 'FAIL')
              .map(k => '| ' + k.kpi_id + ' | ' + k.name + ' | ' + k.measured + ' | ' + k.threshold + ' | ' + k.compare + ' |')
              .join('\n');
            const regsTable = regs.length === 0
              ? '_회귀 없음 (≥30%)_'
              : '| KPI | name | prev | curr | Δ% |\n|-----|------|------|------|-----|\n' +
                regs.map(rr => '| ' + rr.kpi_id + ' | ' + rr.name + ' | ' + rr.prev.toFixed(3) + ' | ' + rr.curr.toFixed(3) + ' | ' + (rr.delta_pct > 0 ? '↑' : '↓') + Math.abs(rr.delta_pct).toFixed(1) + '% |').join('\n');
            const lines = [
              '## 📊 PSH (Performance Scenario Harness) 보고서',
              '',
              'Mode: `' + r.mode + '`  |  Commit: `' + env.git_sha + '`  |  TS: ' + r.ts,
              '',
              '### KPI 요약',
              '| 항목 | 값 |',
              '|------|-----|',
              '| PASS | **' + s.pass + ' / ' + s.total_kpis + '** (' + (s.pass_rate * 100).toFixed(1) + '%) |',
              '| FAIL | ' + s.fail + ' |',
              '| SKIP | ' + s.skip + ' |',
              '| Scenarios | PASS=' + s.scenarios.pass + ' FAIL=' + s.scenarios.fail + ' SKIP=' + s.scenarios.skip + ' ERROR=' + s.scenarios.error + ' |',
              '',
              '### 회귀 탐지 (직전 회차 대비 ≥30%)',
              regsTable,
              ''
            ];
            if (failRows) {
              lines.push('### FAIL KPIs');
              lines.push('| KPI | name | measured | threshold | compare |');
              lines.push('|-----|------|----------|-----------|---------|');
              lines.push(failRows);
              lines.push('');
            }
            lines.push('<sub>📦 전체 보고서는 artifact `scenario-perf-report-' + env.git_sha + '` 다운로드</sub>');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });

      - name: PSH — F3 CI 실패 시 GitHub Issue 자동 생성 (main push 한정)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'poc/reports/perf/perf_latest_dryrun.json';
            let missCount = 'N/A', regCount = 'N/A', gitSha = context.sha, ts = new Date().toISOString();
            let failKpiTable = '_(PSH 보고서 미생성 — 이전 단계에서 실패)_';
            let regsTable = '_(N/A)_';
            if (fs.existsSync(p)) {
              const r = JSON.parse(fs.readFileSync(p, 'utf-8'));
              const s = r.summary || {}, env = r.env || {}, regs = r.regressions || [];
              missCount = s.fail != null ? s.fail : 'N/A';
              regCount = regs.length;
              gitSha = env.git_sha || gitSha;
              ts = r.ts || ts;
              const failRows = (r.scenarios || [])
                .flatMap(sc => (sc.kpis || []).map(k => ({...k, scenario: sc.scenario_id || sc.id || ''})))
                .filter(k => k.status === 'FAIL')
                .map(k => '| ' + k.kpi_id + ' | ' + k.name + ' | ' + k.measured + ' | ' + k.threshold + ' | ' + k.compare + ' |')
                .join('\n');
              if (failRows) {
                failKpiTable = '| KPI | name | measured | threshold | compare |\n|-----|------|----------|-----------|---------|\n' + failRows;
              } else {
                failKpiTable = '_(FAIL KPI 없음 — 회귀로 실패했을 가능성)_';
              }
              if (regs.length > 0) {
                regsTable = '| KPI | name | prev | curr | Δ% |\n|-----|------|------|------|-----|\n' +
                  regs.map(rr => '| ' + rr.kpi_id + ' | ' + rr.name + ' | ' + rr.prev.toFixed(3) + ' | ' + rr.curr.toFixed(3) + ' | ' + (rr.delta_pct > 0 ? '↑' : '↓') + Math.abs(rr.delta_pct).toFixed(1) + '% |').join('\n');
              } else {
                regsTable = '_(회귀 없음)_';
              }
            }
            const runUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const title = '[PSH][CI fail] ' + gitSha.substring(0, 7) + ' — KPI miss=' + missCount + ' regression=' + regCount;
            const body = [
              '## PSH CI 실패 자동 보고',
              '',
              '- **git_sha**: `' + gitSha + '`',
              '- **실패 시간**: ' + ts,
              '- **KPI miss 수**: ' + missCount,
              '- **regression 수**: ' + regCount,
              '- **Workflow run**: ' + runUrl,
              '',
              '### FAIL KPIs',
              failKpiTable,
              '',
              '### 회귀 탐지 (≥30%)',
              regsTable,
              '',
              '<sub>F3: 본 Issue는 `.github/workflows/poc-ci.yml`에 의해 자동 생성되었습니다.</sub>'
            ].join('\n');
            // 중복 방지: 동일 SHA(short) 제목으로 열린 Issue 있으면 코멘트만 추가
            const shortSha = gitSha.substring(0, 7);
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'psh-regression',
              per_page: 100,
            });
            const dup = existing.find(i => i.title.includes(shortSha));
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: dup.number,
                body: '재발 — run ' + runUrl + '\n\n' + body,
              });
              core.info('Existing issue #' + dup.number + ' updated with comment.');
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci-failure', 'psh-regression'],
              });
              core.info('Created issue #' + created.number);
            }

      - name: PSH — GitHub Pages publish (main 브랜치만)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages
          cp doc/20_시나리오_성능_보고서.html pages/index.html
          cp -r poc/reports/perf pages/perf
        working-directory: ${{ github.workspace }}

      - name: PSH — Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          commit_message: "PSH report ${{ github.sha }}"

      - name: Bundle manifest dry-run (doc/12 §4.1)
        run: |
          python scripts/build_offline_bundle.py \
            --version "ci-${{ github.sha }}" \
            --dry-run \
            --output dist/lloydk-airgap-bundle

      - name: Upload PoC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-reports
          path: poc/reports/
          retention-days: 14

      - name: Upload bundle manifest (dry-run artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-manifest
          path: |
            poc/dist/lloydk-airgap-bundle/manifest.yaml
            poc/dist/lloydk-airgap-bundle/manifest.json
            poc/dist/lloydk-airgap-bundle/CHECKSUMS.sha256
          retention-days: 14
          if-no-files-found: warn

      - name: Upload scenario performance report (doc/20 HTML + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-perf-report-${{ github.sha }}
          path: |
            doc/20_시나리오_성능_보고서.html
            poc/reports/perf/
          retention-days: 90
          if-no-files-found: warn
