name: poc-ci

on:
  push:
    branches: [main]
    paths:
      - 'poc/**'
      - '.github/workflows/poc-ci.yml'
  pull_request:
    paths:
      - 'poc/**'
      - '.github/workflows/poc-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (48 unit + integration tests)
        run: pytest tests/ -v --tb=short

      - name: Run PoC dryrun suite (P4 -> P3 -> P2 -> P1 -> P5)
        run: python scripts/run_all_pocs.py

      - name: Upload PoC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-reports
          path: poc/reports/
          retention-days: 14
