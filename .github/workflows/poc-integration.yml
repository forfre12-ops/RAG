name: poc-integration

# 통합·인수 시험을 poc-ci.yml 의 test-lite 잡과 **독립으로** 돌린다.
#
# 왜 따로 두는가(2026-09-21 조사):
#   poc-ci.yml 의 test-lite 잡에는 KL 연동 계약(make test-kl-integration)·인수팩 시험이 이미
#   들어 있다. 그런데 그 잡은 pytest 보다 앞에 있는 "P3 — Alembic migration drift check"
#   단계에서 먼저 실패해 pytest 단계 전체가 건너뛰어진다. 공개 GitHub Actions 이력에서
#   poc-ci 최근 100회(2026-08-16 ~ 2026-09-12, 전부 pull_request·failure) 중 20회를 표본으로
#   열어 본 결과, 20/20 이 drift 단계 failure → make test-lite-cov · make test-fullstack ·
#   make test-kl-integration 이 모두 skipped 였다. 즉 시험 명령은 있으나 한 번도 실행되지 않았다.
#   (같은 명령 `alembic check` 를 2026-09-21 작업트리에서 새 DB 에 돌려도
#    "New upgrade operations detected" 25건으로 실패한다 — drift 자체는 이 워크플로 밖의 문제다.)
#
#   그래서 아래 시험은 drift 검사와 무관하게 돌도록 여기에 둔다. poc-ci 가 정상화되면
#   db-integration 의 KL 단계·인수팩 단계는 poc-ci 와 겹친다 — 그때 이 워크플로에서 지워도 된다.
#
# 잡 구성:
#   db-integration  KL 연동 계약 + W3 라우터 + audit(PG 필요) · 인수팩 시험 · 업무 흐름 e2e(PG 필요)
#   console-e2e     관리자 콘솔 jsdom 시나리오 169건. test-lite 는 이것을 수집만 하고 jsdom 이
#                   없어 파일 전체를 skip 한다(tests/test_e2e_console_scenarios.py 의 skipif).
#
# 넣지 않은 것: 인수 샘플팩 채점(make acceptance-test). --require-model 이 필수인데 학습 가중치
#   (artifacts/)가 리포에 없어 CI 에서 돌릴 수 없고, 옵션을 빼면 rule-fallback 이 PASS 로 나와
#   가짜 초록이 된다(Makefile acceptance-test 주석).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'poc/**'
      - '.github/workflows/poc-integration.yml'
  pull_request:
    paths:
      - 'poc/**'
      - '.github/workflows/poc-integration.yml'

permissions:
  contents: read

jobs:
  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ./poc
    # poc-ci.yml test-lite 잡과 같은 PostgreSQL 서비스. Redis·ES 는 이 시험들에 불필요하다
    # (Redis 가 없으면 인메모리 폴백 — 로컬 실측에서 확인).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: koipa
          POSTGRES_PASSWORD: koipa_dev_pg
          POSTGRES_DB: koipa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koipa -d koipa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://koipa:koipa_dev_pg@localhost:5432/koipa
      PGPASSWORD: koipa_dev_pg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - name: Install dependencies (기본 + dev extras, test-lite 와 동일)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bootstrap DB schema (alembic 단일 경로)
        run: alembic upgrade head

      # 아래 세 단계는 서로 독립이다 — 하나가 실패해도 나머지를 돌려 한 번에 전부 보이게 한다
      # (`!cancelled()`). test-lite 가 앞 단계 하나 때문에 뒤를 통째로 건너뛰던 것을 되풀이하지 않는다.
      - name: KL contract + W3 router + audit integration (make test-kl-integration)
        # PG 에 붙지 못하면 이 시험들은 skip 으로 빠지고 pytest 는 초록불을 낸다(_pg_ok() 가드).
        # 로컬 실측: PG 없이 39 passed · 9 skipped, PG 있으면 skipped 0. skip 이 하나라도 있으면 실패시킨다.
        if: ${{ !cancelled() }}
        env:
          TESTING: '1'
        run: |
          set -o pipefail
          make test-kl-integration 2>&1 | tee /tmp/kl-integration.log
          if grep -Eq "[0-9]+ skipped" /tmp/kl-integration.log; then
            echo "::error::건너뛴 시험이 있다 — PostgreSQL 접속 실패로 시험이 조용히 빠졌을 수 있다"
            exit 1
          fi

      - name: Acceptance pack tests (판정기 severity-floor veto + 렌더러 round-trip)
        # 채점기(scripts/run_acceptance.py)의 판정 로직 단위시험. hwpx round-trip 1건은 [hwp] extra 가
        # 없으면 시험 스스로 skip 한다(설계된 skip) — 그래서 여기서는 skip 개수로 실패시키지 않는다.
        if: ${{ !cancelled() }}
        env:
          TESTING: '1'
        run: python -m pytest -q tests/test_acceptance_pack.py

      - name: Business flow e2e (업로드→분류→검수큐→확정→책임추적→골든, 단계별 DB 행 확인)
        # 응답이 200 이어도 저장이 안 되는 경우를 잡는다(scripts/e2e_business_flow_live.py docstring).
        # 한 단계라도 실패하면 exit 1. 학습 가중치(artifacts/)는 리포에 없다 — 로컬에서
        # CLASSIFIER_MODEL_DIR 없이 돌린 결과가 label=S3 conf=0.0 status=needs_review 였다.
        # 이 단계가 보는 것은 분류 정확도가 아니라 저장 경로다(정확도 판정에 쓰지 말 것).
        if: ${{ !cancelled() }}
        env:
          TESTING: '1'
        run: python scripts/e2e_business_flow_live.py

  console-e2e:
    # 관리자 콘솔 화면을 jsdom(node 위의 DOM 구현)으로 실제로 띄워 버튼을 눌러 보는 시나리오.
    # PG·모델·서비스 컨테이너 없이 돈다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'poc/pyproject.toml'

      - uses: actions/setup-node@v4
        with:
          # jsdom 30.0.1 의 engines 는 ^22.22.2 || ^24.15.0 || >=26.0.0
          # (poc/tests/e2e_console/node_modules/jsdom/package.json). 러너 기본 node 버전에 기대지 않는다.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'poc/tests/e2e_console/package-lock.json'

      - name: Install dependencies (기본 + dev extras, test-lite 와 동일)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install console e2e harness (jsdom, package-lock.json 고정)
        working-directory: ./poc/tests/e2e_console
        run: npm ci

      - name: Guard — jsdom 시나리오가 skip 되지 않고 실제로 수집되는가
        # tests/test_e2e_console_scenarios.py 는 node·jsdom·run.mjs 중 하나라도 없으면 파일 전체를
        # 조용히 skip 하고 pytest 는 초록불을 낸다. 그 상태로 이 잡이 통과하면 안 된다.
        run: |
          node --version
          test -d tests/e2e_console/node_modules/jsdom || { echo "::error::jsdom 미설치 — 시나리오 시험이 통째로 skip 된다"; exit 1; }
          n=$(node tests/e2e_console/run.mjs --list | grep -c .)
          echo "수집된 시나리오: ${n}건"
          # 시험 파일의 test_harness_collected_scenarios 와 같은 하한(40건).
          [ "$n" -ge 40 ] || { echo "::error::시나리오가 ${n}건뿐이다(하한 40) — 하니스 로딩 실패 의심"; exit 1; }

      - name: Console e2e scenarios + API contract (make test-console-e2e)
        env:
          TESTING: '1'
        run: make test-console-e2e

      - name: Golden console jsdom tests (검수자 숨김 화면·별칭 화면) — 건너뛰면 실패
        # 이 두 시험은 node·jsdom 이 없으면 스스로 skip 하고 pytest 는 초록불을 낸다(test-lite 잡에는 jsdom 이 없어 거기서는
        # 늘 건너뛴다). 여기는 jsdom 이 있는 잡이므로 skip 이 하나라도 나오면 시험이 조용히 빠진 것이다.
        # 검수자 접근 통제(2026-09-22): 숨김 화면이 문법·동작을 깨지 않았는지, 화면이 별칭으로만 요청하는지를 실제 DOM 에서 확인한다.
        if: ${{ !cancelled() }}
        env:
          TESTING: '1'
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            "tests/test_golden_blind_review.py::test_blind_screen_behaves_in_a_real_dom" \
            "tests/test_golden_alias_ids.py::test_manage_html_lists_opens_and_saves_by_alias_in_a_real_dom" \
            2>&1 | tee /tmp/golden-jsdom.log
          if grep -Eq "[0-9]+ skipped" /tmp/golden-jsdom.log; then
            echo "::error::건너뛴 시험이 있다 — jsdom 화면 시험이 조용히 빠졌을 수 있다"
            exit 1
          fi
