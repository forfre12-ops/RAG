name: quality

on:
  push:
  pull_request:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip uv ruff
      - run: python -m uv lock --locked
      - run: python -m ruff check src tests
